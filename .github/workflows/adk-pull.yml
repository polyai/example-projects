name: ADK pull

# Keeps every template project's Agent Studio config in sync locally by
# running `poly pull` across each agent folder and committing any changes.
on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ADK
        run: pip install polyai-adk

      - name: Pull each agent folder
        env:
          POLY_ADK_KEY: ${{ secrets.POLY_ADK_KEY }}
        run: |
          set -euo pipefail
          # An "agent folder" is any top-level directory containing a project.yaml.
          for project_yaml in */project.yaml; do
            dir=$(dirname "$project_yaml")
            echo "::group::poly pull — $dir"
            (cd "$dir" && poly pull --force --format)
            echo "::endgroup::"
          done

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: poly pull latest agent configs"
          git push origin HEAD:main
