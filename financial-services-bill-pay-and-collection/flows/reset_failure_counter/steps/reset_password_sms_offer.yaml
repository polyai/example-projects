step_type: advanced_step
name: Reset Password SMS Offer
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 0
  max_digits: 0
  end_key: "#"
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  === ACTIONS ===

  The user has already been given instructions and asked if they want an SMS. Wait for their response.

  ## User says YES — wants SMS
  Call {{fn:start_sms_flow}} with sms_id="reset_password_unlock"

  ## User says NO — does not want SMS
  Say "Is there anything else I can help you with?" and call {{ft:walkthrough_complete}}
