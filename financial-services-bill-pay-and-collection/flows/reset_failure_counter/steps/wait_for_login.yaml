step_type: advanced_step
name: Wait For Login
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords:
    - logged in
    - it worked
    - still loading
    - not working
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 0
  max_digits: 0
  end_key: "#"
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  === ACTIONS ===

  The user is attempting to log in while you stay on the line. Wait for them to report the outcome.

  If the user is silent or takes a long time, check in with them using one of:
  - "Have you been able to log in yet?"
  - "Are you still trying to log in?"
  - "Are you having any issues?"

  ## User has logged in successfully
  Say exactly: "Great. Glad we could get that sorted for you."
  Then call {{ft:walkthrough_complete}}

  ## User mentions they need to reset a specific detail (password, security number, customer number)
  Call {{ft:route_missing_details}} with the appropriate missing_detail value ("password", "security_number", "customer_number")

  ## User is having issues or login was unsuccessful (and does not mention a specific detail)
  Call {{fn:handoff}} with reason="RESET_FAILURE_COUNTER", requested_by_user=false, account_type="N/A", handoff_required_by_faq=true

  === GUIDELINES ===

  - All "Say exactly" utterances are client-approved — say them word-for-word. Do NOT paraphrase or add to them.
  - Do NOT use filler utterances ("Right...", "Mhm..."). Give the user plenty of time to attempt login. Do NOT speak until the user says something.
  - If user mentions a specific error, acknowledge it before transferring.
  - If prolonged silence after checking in, call {{fn:silence_hangup}}.
