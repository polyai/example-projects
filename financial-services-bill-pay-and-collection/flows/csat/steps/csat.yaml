step_type: advanced_step
name: CSAT
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: true
  time: false
  yes_no: false
  address: false
  custom_keywords:
  - one
  - two
  - three
  - four
  - five
  - '1'
  - '2'
  - '3'
  - '4'
  - '5'
dtmf_config:
  is_enabled: true
  inter_digit_timeout: 0
  max_digits: 0
  end_key: '#'
  collect_while_agent_speaking: true
  is_pii: false
prompt: |-
  # Feedback survey
  You've just asked if they'd share some feedback. Only offered when csat_enabled is on in real-time config.

  1. If they'd rather not, call {{fn:goodbye_and_hangup}}.
  2. If they agree, ask: "On a scale of 1 to 5, where 1 is highly dissatisfied and 5 is extremely satisfied, how would you rate the service today?" Explain the scale again if they're unsure.
  3. Take the rating as a number from 1 to 5, allowing for speech-to-text slips ("to" = 2, "for" = 4, "free" = 3).
  4. Then ask: "And lastly, how would you describe your experience with our voice assistant today?"
  5. Once they answer, call {{ft:save_feedback}} with the rating and their words, verbatim.
