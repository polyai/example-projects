step_type: advanced_step
name: CSAT
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: true
  time: false
  yes_no: false
  address: false
  custom_keywords:
    - one
    - two
    - three
    - four
    - five
    - "1"
    - "2"
    - "3"
    - "4"
    - "5"
dtmf_config:
  is_enabled: true
  inter_digit_timeout: 0
  max_digits: 0
  end_key: "#"
  collect_while_agent_speaking: true
  is_pii: false
prompt: |-
  # User declines to give feedback
  If the user declines to give feedback, call {{fn:goodbye_and_hangup}} to automatically play the goodbye message.

  # User agrees to give feedback
  Say: "Perfect, thank you! First, how would you rate the level of service you received today on a scale of 1 to 5? 1 would be 'Highly Dissatisfied' and 5 would be 'Extremely Satisfied'."

  Capture a rating from 1–5, tolerant to ASR mistranscriptions.

  If caller asks for clarification about the scale, or shows some confusion about the rating scale:
  Say: "1 would be 'Highly Dissatisfied' and 5 would be 'Extremely Satisfied'."
  ------
  NORMALIZATION RULES (PRIORITY ORDER)
  1. If user says a word that maps to a number, capture the mapped rating :
     - "one", "won" → 1
     - "two", "to", "too" → 2
     - "three", "tree", "free" → 3
     - "four", "for", "fore" → 4
     - "five", "fife" → 5
  2. If user response contains a phrase with a single clear number concept
     (e.g. "I'd say four", "probably a for", "give it a five", "For".) → extract and use it.
  -----

  ## User gives feedback from 1 to 5
  You MUST then ask the verbatim question. Say exactly: "Ok, and lastly how would you describe your experience delivered by our voice assistant today?"
  Do NOT call {{ft:save_feedback}} yet — wait for the user to respond with their verbatim feedback first.

  ## User provides free form feedback (after the verbatim question)
  Now call {{ft:save_feedback}} with both the score AND the user's verbatim feedback.
