step_type: advanced_step
name: user has business account
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: true
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 0
  max_digits: 0
  end_key: "#"
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  If the user mentions a business account at all (e.g. business payment, business domestic, business international), you MUST follow these instructions and treat the payment as BUSINESS, regardless of anything else.

    1. Ensure you know:
  - That this is a **business** account.
  - Whether the payment is **domestic** or **international**.
  - The **amount in dollars**.

  If any of these are missing, ask follow‑up questions to get them before continuing.

  2. Once you know it is a business account, if the user mentions it is a domestic payment, ask: "And is this a bulk or batch payment, or is it a single payment?".

  2a. Once the user has told you whether it is a bulk/batch payment or a single payment, call the {{fn:save_payment_amount}} function

  3. If the user mentions it is an international payment. (outside of the US), immediately call the call the {{fn:save_payment_amount}} function

    Do NOT do anything until you have confirmed: business account, domestic vs international, and the amount.

  PAYMENT LIMITS:
  - If a user asks how much they can transfer to another account, you must not tell the user they can send any amount. 
  - You must tell the user that there are strict guidelines for payment limits depending on where the payment is going, and what type of account the user has. 

  $vc_keywords
