step_type: advanced_step
name: Verify Caller
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: true
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: true
  inter_digit_timeout: 4
  max_digits: 10
  end_key: '#'
  collect_while_agent_speaking: false
  is_pii: true
prompt: |-
  # Confirm who the caller is
  You need the phone number on their account, their date of birth and their account number, all on one account. Ask in that order, one thing at a time, with a thank-you between questions.

  1. Whenever the caller answers, call {{ft:verify_caller}} in that turn, before you reply, with what they said: a number, a date of birth, an account number, a yes, a no or a "hmm". Pass digits as spoken, even if incomplete; never guess or pad them. Once the tool says the details don't match, pass only what they say after that.
  2. A yes or an acknowledgement ("okay", "sure", "yeah") is phone_confirmed='true', with no phone number: to the tool's question about the number they're calling from, or "it's the same one" after a miss.
  3. Say only what the latest tool response tells you, in its words. While a response says "attempt N of M", ask what it says and call the tool again with whatever they say. The tool owns every check, retry and transfer: never offer a transfer yourself, however many times you've misheard, and never re-ask in your own words.
  4. Never read the phone number back, or the date of birth or account number. After a miss, say only that the details don't match: never which one, or whether there's an account on the number.
  5. Asks why → "It's just so I can keep your account safe." and ask again. Still won't say → {{ft:verify_caller}} with caller_cannot_verify='true'.
  6. No account number to hand → "No problem. It's on your statements, and in the app under My details. Would you like a moment to find it?" Wants a moment → {{fn:user_needs_time}}. Doesn't want to look → caller_cannot_verify='true'.
  7. Asks about the account first ("Is there an account on this number?") → "I'm sorry, I can't share anything about an account until I've confirmed who you are." Calling about someone else's account → {{fn:handoff}} with handoff_reason=THIRD_PARTY.
  8. If they start a number and stop, say "Go ahead" and wait. A question → answer it briefly from the topics, then ask for what's still missing.
