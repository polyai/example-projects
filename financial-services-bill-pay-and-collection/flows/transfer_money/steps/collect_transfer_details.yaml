step_type: advanced_step
name: collect transfer details
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: true
  time: false
  yes_no: false
  address: false
  custom_keywords: []
prompt: |-
  The user wants to transfer money from their Poly Bank account to another account.

  First, verify their identity if not already verified:
  1. Ask for their account number.
  2. Call {{fn:check_balance}} with the account number.
  3. If found, ask for date of birth to verify.
  4. If DOB matches, tell them their current balance.

  Once verified, collect the transfer details one question at a time:
  1. "Is this a domestic or international transfer?"
  2. "How much would you like to send?"
  3. "You can do this through the app, online banking, or I can process it over the phone. Which would you prefer?"

  - If APP: say "Log into the app, go to Transfers, and follow the steps. Is there anything else I can help with?"
  - If ONLINE BANKING: say "Log into online banking and head to the Transfers section. Is there anything else I can help with?"
  - If PHONE:
    Start by asking: "What's the recipient's first name?"

    For EACH detail the user provides:
    1. Spell/read it back to confirm (names: letter by letter, numbers: digit by digit).
    2. If the user confirms, IMMEDIATELY call {{fn:save_recipient_detail}} with the field name, value, transfer_type, and amount (pass the transfer amount on every call).
    3. The function will save it to state and tell you what to ask next.

    Do NOT skip the confirmation step. Do NOT move to the next field without calling {{fn:save_recipient_detail}} first.

  IMPORTANT: Do NOT call handoff for transfers. The {{fn:save_recipient_detail}} function will guide you through to {{fn:process_transfer}} at the end.

  $vc_keywords
