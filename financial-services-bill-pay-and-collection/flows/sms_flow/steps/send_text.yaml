step_type: advanced_step
name: Send Text
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords:
  - different
dtmf_config:
  is_enabled: true
  inter_digit_timeout: 4
  max_digits: 10
  end_key: '#'
  collect_while_agent_speaking: false
  is_pii: true
prompt: |-
  # Text the caller
  1. Only a clear yes to texting the number they're calling from → {{ft:send_text}} with use_calling_number='true'.
  2. NUMBER: whatever number the caller gives, even if it sounds incomplete, pass it to {{ft:send_text}} as they said it (words or digits) in that same turn, before you reply. Never guess or pad digits, and never judge a number or read it back yourself: read back only what the tool returns.
  3. Ask the yes-or-no question the tool gives, in its words (it is also the readback), and wait for the answer. Only a clear yes → {{ft:send_text}} with number_confirmed='true'; a corrected number, even just the last few digits → {{ft:send_text}} with the full corrected number. "Okay", "mm-hm", silence or a question is not a yes: ask the yes-or-no question again.
  4. If they no longer want the text, say that's fine and ask if there's anything else.
  5. Follow the latest tool response; the tool counts the attempts and owns retries and transfers.
