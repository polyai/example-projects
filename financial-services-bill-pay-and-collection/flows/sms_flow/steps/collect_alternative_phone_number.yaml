step_type: advanced_step
name: Collect Alternative Phone Number
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: true
  inter_digit_timeout: 5
  max_digits: 10
  end_key: '#'
  collect_while_agent_speaking: false
  is_pii: true
prompt: |-
  === ACTIONS ===
  When collecting a phone number (either for the first time or as a repeat) you must always ask the user: "What number should I send it to? Could you give me the ten-digit number, starting with the area code? You can also type it on your keypad, then press the pound key."

  --- SAVE PHONE NUMBER ---

  Every time you're able to extract a phone number, call the {{ft:phone_number_given}} function to save the corresponding values. Call this function even if the input is clearly ill-formed, too short, unintelligible, or identical to one of the previous inputs - every time the user attempts to input the information, we should record it by calling this function. Do *not* say anything else when calling the function.

  --- CONFIRM PHONE NUMBER ---

  As soon as you've saved the phone number and the user explicitly confirmed that everything is correct, call the {{ft:phone_number_confirmed}} function to proceed. Do *not* say anything else when calling the function.

  If the user says "no" when you've read back the phone number, but doesn't specify a new phone number, just say "What phone number should I send this to? You can either say it or type it in on your keypad, then press the pound key."

  If the user corrects only part of the number (for example "no, it ends in seven eight"), apply the correction to the number you read back and call {{ft:phone_number_given}} again with the full corrected ten-digit number.

  === TASK ===

  Referring back to the user's previous messages, your task is to extract the following value(s):
  - phone_number
  - country_code

  Never read out example phone numbers to the user, just let them speak however they want.

  === ADDITIONAL GUIDELINES ===

  --- NUMERIC INPUTS ---

  The user provides these numbers over the phone, so they might use expressions typical of spoken language:
  - Interpret multipliers such as "double" and "triple" as a quantity of numbers: "double nine" = "nine nine", "triple eight" = "eight eight eight"
  - Interpret "oh" as "zero", and ensure that multipliers before "oh" are interpreted in the same manner as above: "double oh" = "zero zero"

  --- COLLECTING THE NUMBER ---

  Ask for the number in groups, starting with the area code: "Could you give me the ten-digit number, starting with the area code?"
  If the caller says "oh", treat it as zero. Treat "double" and "triple" as repeated digits.
  If a digit is heard as a similar-sounding word, use the digit: "to" or "too" is two, "for" is four, "won" is one, "ate" is eight.
  If you could not catch it, offer: "You can also type it on your keypad, then press the pound key."

  === READBACK RULES ===
  Read the number back as one flowing sentence and finish with "is that right?" with no pause before it.
  Say every digit as its own word. Always say "zero", never "oh".
  Group the ten digits three, three, four, joined with "then" and "and finally".
  Example for 2015550123: "I heard two zero one, then five five five, and finally zero one two three, is that right?"
  If the caller says "oh" for a digit, treat it as zero.
