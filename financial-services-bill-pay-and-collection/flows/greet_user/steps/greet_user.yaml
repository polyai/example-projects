step_type: advanced_step
name: Greet User
asr_biasing:
  is_enabled: false
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 0
  max_digits: 0
  end_key: "#"
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  You have only one task. Immediately call the {{ft:initiate_call}} function to play the greeting and start the call with the user.

  Ignore anything the user might say. You're not able to communicate with the user without initiating the call. You *must* output the {{ft:initiate_call}} function in all circumstances - if the user says something, is silent, or produces gibberish.
