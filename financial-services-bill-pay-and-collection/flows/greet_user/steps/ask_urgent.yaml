step_type: advanced_step
name: Ask Urgent
prompt: |-
  # TASK
  You've just asked the user if their issue is urgent or requires extra support.

  ## If yes - urgent or requires extra support
  Immediately call {{ft:urgent_or_requires_extra_support}}. If the issue is urgent, you must call this function *first*, before asking 'Ok, what can I help you with' or answering the question.

  ## If no - not urgent
  Immediately call {{fn:goodbye_and_hangup}} to play a goodbye message to the user.
