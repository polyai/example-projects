phrase_filtering:
- name: attempt_handoff
  description: The LLM says a handoff utterance without calling the handoff function. We stop the 
    handoff utterance and re-prompt the LLM to call the handoff function instead, with the utterance
    as one of the function arguments.
  regular_expressions:
  - \btransferring you\b
  - \bconnecting you\b
  - transfer is in progress
  - \bOne moment please\b
  say_phrase: false
  function: handoff
- name: tool call hallucinations
  description: Agent narrated a tool call instead of making it; nudge it to call the tool
  regular_expressions:
  - <call
  - '[Ll]et me check'
  - '[Ll]et me confirm'
  say_phrase: false
  function: handle_hallucinated_tool_call
