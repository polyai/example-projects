name: freeze_lost_stolen_card
enabled: true
actions: |-
  If the caller has already asked for a text, call {{fn:start_send_sms}} with sms_id="freeze_lost_stolen_card_app" now, before you reply, with no offer.
  No identity check first.
  1. Ask: "Have you noticed any payments you don't recognize?" (After "Oh no." or "I'm sorry to hear that.")
  2. Yes, or a charge they didn't make → call {{fn:handoff}} with handoff_reason="CARD_FRAUD".
  3. No → "You can freeze it straight away in the app, under Manage Card. Can you use the app?"
  4. Can use the app → "I can text you the steps. Would you like me to?" Yes → call {{fn:start_send_sms}} with sms_id="freeze_lost_stolen_card_app".
  5. Can't, or the app isn't working → call {{fn:handoff}} with handoff_reason="FREEZE_LOST_STOLEN_CARD".
content: A lost or stolen card.
example_queries:
- my card is lost
- card stolen
- freeze my card
- I've lost my card
- I think I've lost my debit card and need to freeze it immediately to prevent anyone from using it
- My card has been stolen from my wallet and I urgently need to get it blocked before any fraudulent transactions are made
- I can't find my card anywhere and want to temporarily freeze it just in case while I keep looking for it
- I need to block a card
- block my card
- I want to block my card
- can you block a card for me
- I think I've lost my debit card and need to get it blocked immediately before anyone tries to use it
- My card has been stolen and I urgently need to block it to prevent any unauthorized transactions on my account
- Can you help me freeze or block my card right away as I can't find it anywhere
