name: new_beneficiary
enabled: true
actions: |-
  If the caller has already asked for a text, call {{fn:start_send_sms}} with sms_id="add_payee" now, before you reply, with no offer.
  Say: "You can add a payee in the app or online, under Pay and Transfer and then Add payee. I can text you the steps. Would you like me to?"
  - Yes → call {{fn:start_send_sms}} with sms_id="add_payee".
  - Can't use the app or online: call {{fn:handoff}} with handoff_reason="NEW_PAYEE".
content: Adding a new payee.
example_queries:
- add a new payee
- set up new beneficiary
- add someone to my payees
- new payee
- I need to add a new payee to my account so I can start making regular payments to them
- Can you help me set up a new beneficiary on my account as I need to send them money
- I want to add someone to my saved payees list so it's easier to send them payments in the future
- add international payee
- international beneficiary
- I want to add a payee that's international
- Hi I want to know how to add an international payee to my account
