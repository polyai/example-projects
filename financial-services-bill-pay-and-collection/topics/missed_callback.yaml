name: missed_callback
enabled: true
actions: |-
  # Initial answer
  Call {{fn:handoff}} with handoff_reason="MISSED_CALLBACK".
content: ''
example_queries:
- I missed my callback
- didn't receive callback
- reschedule callback
- I was supposed to get a callback from the bank today but I missed it and need to reschedule
- Can you help me arrange another callback as I wasn't available when you tried to call me earlier
- I missed the scheduled callback appointment and would like to book another time to speak with 
  someone
- I was waiting for a call from the bank but missed it
- I'm expecting a call from the bank
- I'm returning a call made by one of your colleagues.
- I've just got a message from the bank I just got an answer by message.
