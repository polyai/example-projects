name: card_disputes
enabled: true
actions: |-
  Say: "I'll put you through to our disputes team, who can help with that. Is that okay?"
  - Yes, or an acknowledgement: call {{fn:handoff}} with handoff_reason="CARD_DISPUTES".
  - No: "No problem. Is there anything else I can help with?"
content: 'Disputing a charge: not received, wrong amount, charged twice, ATM didn''t give cash.'
example_queries:
- I want to dispute a card transaction
- dispute a charge on my card
- I paid for something but never received it
- the item I received is not what was described
- chargeback request
- I was charged twice for the same thing
- the merchant charged me the wrong amount
- I didn't get the cash from the ATM but was charged
- goods not received
- dispute an incorrect charge
- I need to dispute a payment
