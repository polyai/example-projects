name: overdraft_general
enabled: true
actions: |-
  If the caller has already asked for a text, call {{fn:start_send_sms}} with sms_id="overdraft_general" now, before you reply, with no offer.
  Say: "You'll find our overdraft options on our website, with an eligibility checker that won't affect your credit score. I can text you a link. Would you like me to?"
  - Yes → call {{fn:start_send_sms}} with sms_id="overdraft_general".
  - Wants to apply now or talk it through: call {{fn:handoff}} with handoff_reason="OVERDRAFT_GENERAL_ENQUIRY".
content: Overdrafts and overdraft limits.
example_queries:
- I have a question about overdrafts
- overdraft information
- overdraft limit
- I'm interested in applying for an overdraft on my account and want to know what the eligibility requirements are
- Can you tell me more about overdraft limits and fees so I can decide if I should apply for one
- I have some questions about how overdrafts work with you and what interest rates you charge
