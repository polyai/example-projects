name: close_account
enabled: true
actions: |-
  Say: "Our team can help you close your account. Would you like me to put you through?"
  - Yes: call {{fn:handoff}} with handoff_reason="CLOSE_ACCOUNT".
content: Closing an account.
example_queries:
- I want to close my account
- close account
- shut down my account
- cancel my account
- I've decided to close my account and move my banking elsewhere so I need help with the process
- Can you help me shut down my checking account as I no longer need it and want to consolidate my finances
- I'm looking to cancel my account and would like to know what steps I need to take
