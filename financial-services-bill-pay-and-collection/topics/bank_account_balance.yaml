name: bank_account_balance
enabled: true
actions: 'Say: "I can see what''s due on your account here, but not a bank balance, I''m afraid. That''s in your bank''s app." No identity check is needed, since nothing about the account is shared. If they then want what they owe on their account here, call {{fn:start_check_balance}}.'
content: 'The caller asks about money in a bank account: how much they have, why they''re overdrawn, what''s in their checking account.'
example_queries:
- how much money do I have
- Why am I overdrawn?
- how much is in my checking account
- what's my bank balance
- how much have I got in the bank
- am I overdrawn
