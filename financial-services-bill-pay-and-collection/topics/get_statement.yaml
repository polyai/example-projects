name: get_statement
enabled: true
actions: |-
  If the caller has already asked for a text, call {{fn:start_send_sms}} with sms_id="get_statement" now, before you reply, with no offer.
  Say: "Your statements are in the app and online, under Documents and then Statements. I can text you the steps. Would you like me to?"
  - Yes → call {{fn:start_send_sms}} with sms_id="get_statement".
  - Can't find one, or needs one sent: call {{fn:handoff}} with handoff_reason="GET_STATEMENT".
content: Getting or downloading a statement.
example_queries:
- I need a statement
- how do I get a statement
- download statement
- send me a statement
- I need to get a copy of my bank statement for the last three months for a mortgage application
- Can you help me download my bank statement as my accountant needs it for my tax return
- I'm trying to access my account statement but I'm not sure where to find it online or how to get a paper copy
- I need to download a copy of my statement
- bank statement get a copy
