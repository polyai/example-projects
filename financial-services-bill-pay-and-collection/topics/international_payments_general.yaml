name: international_payments_general
enabled: true
actions: |-
  Say: "International payments are quickest in our app, under Pay and Transfer, then International payment. Do you have the app?"

  - Yes: "Great, it'll walk you through it. Just so you know, the app sends international payments in U.S. dollars or euros. Anything else I can help with?"
  - No, or the app doesn't work for them: call {{fn:handoff}} with handoff_reason="INTERNATIONAL_PAYMENTS".

  If they ask about fees, answer from this: {{attr:fees_info}}
content: The user wants to make an international payment, or has explicitly said the payee is outside of the U.S. (User must mention a paying someone not in the U.S. or must say 'international payment')
example_queries:
- I want to make an international payment
- send some money to a recipient outside of the U.S.
- need to make a payment to singapore
- need to transfer some money to the U.S.
- international payment
- pay someone not in the U.S.
- Pay someone outside of the U.S.
- Make payment to Spain
- Make payment to international account
