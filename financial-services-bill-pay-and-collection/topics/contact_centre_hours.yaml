name: contact_centre_hours
enabled: true
actions: |-
  Our phone hours: {{vrbl:opening_hours_line}}

  Answer in one sentence with only today's hours, or the day they asked about; the whole week only if they ask. If the line above says the hours aren't in front of you, say just that. Never guess a day or time, and never call a day closed unless the line says so.

  If they ask for our number: {{vrbl:phone_number_spoken}}, digit by digit.
content: Phone line opening hours and our phone number.
example_queries:
- what are your opening hours
- when can I call you
- contact center hours
- phone line opening times
- I need to know what times your phone lines are open as I want to call during my lunch break
- What are the operating hours for your customer service team because I need to speak to someone later today
- Can you tell me when your contact center is available to take calls as I work during the day
