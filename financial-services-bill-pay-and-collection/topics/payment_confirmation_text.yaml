name: payment_confirmation_text
enabled: true
actions: 'A text confirming a payment made on this call: call {{fn:start_send_sms}} with sms_id="payment_confirmation", even if they name another number; it decides where it can go and what to say.'
content: The caller wants a text or receipt confirming a payment they just made.
example_queries:
- Can you text me that confirmation number?
- Can you send me a text with the confirmation?
- Can you send it to my wife's phone instead?
- Text me a receipt
- Can I get that confirmation by text?
- Send the confirmation number to my phone
