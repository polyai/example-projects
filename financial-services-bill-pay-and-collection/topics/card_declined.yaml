name: card_declined
enabled: true
actions: |-
  Say: "I'm sorry about that. A new card needs activating before it works, and the app shows if there's a block on your card. If it's still being declined, I can put you through to our cards team. Would that help?"
  - Yes: call {{fn:handoff}} with handoff_reason="CARD_DECLINED".
content: A card payment was declined or stopped.
example_queries:
- my card was declined
- card not working
- why was my card declined
- card transaction failed
- I tried to make a purchase at the shop today but my card was declined and I don't understand why
- My debit card keeps getting rejected when I try to use it even though I know I have money in my account
- I was really embarrassed when my card got declined at the checkout and I need to know what's going on with it
- declined payment
- A payment I made that has been stopped.
- A payment i made on my card has been stopped I want to speak to someone
