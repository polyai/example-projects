name: order_replacement_card
enabled: true
actions: |-
  If the caller has already asked for a text, call {{fn:start_send_sms}} with sms_id="replace_card" now, before you reply, with no offer.
  Say: "You can order a replacement in the app, under Manage Card, and we'll mail it to the address on your account. I can text you the steps. Would you like me to?"
  - Yes → call {{fn:start_send_sms}} with sms_id="replace_card".
  - Can't use the app: call {{fn:handoff}} with handoff_reason="ORDER_REPLACEMENT_CARD".
content: Ordering a replacement for a damaged card. A lost or stolen card is the freeze_lost_stolen_card topic.
example_queries:
- I need a replacement card
- order new card
- get replacement card
- card replacement
- My card is damaged and I need to order a replacement one before it stops working completely
- Can you help me order a new card as mine is about to expire and I need a replacement sent out
- I need to get a replacement debit card issued as my current one has been damaged and won't work properly
- I lost my card but don't have the app. Can I get another card through you or do I need to go to the bank?
