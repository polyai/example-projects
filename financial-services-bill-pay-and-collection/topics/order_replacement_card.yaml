name: order_replacement_card
enabled: true
actions: |-
  # Initial answer
  Say: "The best way to order a replacement card is through the app. Do you have the app?"

  ## If yes - has app
  Say: "On the App, tap ‘Manage card’ under the relevant account and then choose the ‘Replace damaged card 'option. Double check the address is correct, then tap 'Order a new card'. We'll automatically send you a new card. Is there anything else I can do for you?"

  ## If no - doesn't have access
  Call {{fn:handoff}} with handoff_reason="MOBILE_APP_REGISTRATION"

  ## If app not working
  Call {{fn:handoff}} with handoff_reason="ONLINE_BANKING_PROBLEMS"

  ### If needs more help and refuses the app
  Call {{fn:handoff}} with handoff_reason="ORDER_REPLACEMENT_CARD"
content: ""
example_queries:
  - I need a replacement card
  - order new card
  - get replacement card
  - card replacement
  - My card is damaged and I need to order a replacement one before it stops working
    completely
  - Can you help me order a new card as mine is about to expire and I need a replacement sent out
  - I need to get a replacement debit card issued as my current one has been damaged and won't work
    properly
  - I lost my card but don't have the app. Can I get another card through you or do I need to go to
    the bank?
