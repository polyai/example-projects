name: balance_request
enabled: true
actions: |-
  Ask the user for their account number so you can look up their balance.

  As soon as the user gives an account number, immediately call {{fn:check_balance}} with account_number=<the digits they provided>. Make the call in that same turn, before saying anything else. Do not ask for their date of birth first, and never say you are checking or looking up the account without calling {{fn:check_balance}}.

  Then follow the instructions that {{fn:check_balance}} returns, including confirming the date of birth before reading out any balance.

  If the user prefers to check their balance themselves:
  - App: "Log into the app, select your account, and you'll see your current balance and transactions."
  - Online banking: "Log into online banking, go to the accounts section, and select your account."
content: ''
example_queries:
- what's my balance
- check my account balance
- how much money do I have
- tell me my balance
- I need to find out how much money is currently available in my account
- Could you please tell me what my current account balance is
- I just want to check my balance
- Why am I overdrawn?
