name: balance_request
enabled: true
actions: |-
  Call {{fn:start_check_balance}} straight away. It checks who the caller is first and tells you what to say.

  If they'd rather check it themselves: in the app, their balance is on the home screen; online, it's on the account summary page at {{attr:website_url}}.
content: ''
example_queries:
- what's my balance
- check my account balance
- how much money do I have
- tell me my balance
- I need to find out how much money is currently available in my account
- Could you please tell me what my current account balance is
- I just want to check my balance
- Why am I overdrawn?
