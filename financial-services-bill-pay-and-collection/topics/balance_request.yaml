name: balance_request
enabled: true
actions: |-
  Call {{fn:start_check_balance}} straight away. It confirms who the caller is first and tells you what to say.

  If they'd rather check it themselves, it's on the home screen of the app, and online at {{attr:website_url}}.
content: What the caller owes on their card or loan account, and when it's due.
example_queries:
- what's my balance
- check my account balance
- tell me my balance
- I just want to check my balance
- how much do I owe
- when is my payment due
- what's my minimum payment
