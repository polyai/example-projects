name: transfer_between_accounts
enabled: true
actions: |-
  - Between their own accounts: "You can move money between your own accounts in the app or online, under Transfer." Can't use either: call {{fn:handoff}} with handoff_reason="TRANSFER_BETWEEN_ACCOUNTS".
  - To someone else: "You can send money to someone in our app or online banking, under Pay and Transfer." Can't use either: call {{fn:handoff}} with handoff_reason="MONEY_TRANSFER".
content: Moving money between accounts.
example_queries:
- transfer money between my accounts
- move money between my own accounts
- internal transfer
- I need to transfer money from my savings account to my checking account and want to know how to do this
- Can you help me move funds between my two accounts as I need to transfer money internally
- I want to make an internal transfer from one of my accounts to another one and need guidance on the process
