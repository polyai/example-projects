name: online_banking_problems
enabled: true
actions: |-
  If the caller has already asked for a text, call {{fn:start_send_sms}} with sms_id="troubleshooting_login" now, before you reply, with no offer.
  Say: "Clearing your browser's cookies fixes most login problems, and our troubleshooting guide on the website walks you through it. I can text you the steps. Would you like me to?"
  - Yes → call {{fn:start_send_sms}} with sms_id="troubleshooting_login".
  - Still locked out: call {{fn:handoff}} with handoff_reason="ONLINE_BANKING_LOGIN".
content: Problems with online banking or logging in on the website.
example_queries:
- online banking problems
- troubleshooting online banking
- I'm having problems logging into my online banking account and need help troubleshooting the issue
- My online banking isn't working properly and I need assistance fixing whatever is causing the problem
- Can you help me resolve some technical difficulties I'm experiencing with the online banking platform
