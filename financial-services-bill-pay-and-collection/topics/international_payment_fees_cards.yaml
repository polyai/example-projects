name: international_payment_fees_cards
enabled: true
actions: |-
  Answer only what they asked, in one sentence, from this: {{attr:fees_info}}

  Needs more detail: call {{fn:handoff}} with handoff_reason="INTERNATIONAL_PAYMENT_FEES_CARDS".
content: Fees for using a card abroad or in a foreign currency.
example_queries:
- what are the fees for using my card abroad
- international card fees
- charges for using card overseas
- foreign transaction fees
- I'm going to France next month and want to know what fees I'll be charged for using my debit card there
- Can you tell me how much it costs to use my debit card abroad for purchases and ATM withdrawals
- I need to understand the charges for making card payments in foreign currencies when I'm traveling internationally
