name: savings_account_info
enabled: true
actions: |-
  Say: "You'll find our savings accounts, with their rates and features, on our website, {{attr:website_url}}."
  - Wants help from the team: call {{fn:handoff}} with handoff_reason="SAVINGS_ACCOUNT_INFO".
content: Information about savings accounts.
example_queries:
- tell me about savings accounts
- savings account information
- do you have savings accounts
- savings account rates
- I'd like to learn about the different types of savings accounts you offer and what interest rates are currently available
- Can you provide me with information about savings accounts including features, rates, and any special offers
- I'm interested in opening a savings account and want to compare the different options the bank has available
