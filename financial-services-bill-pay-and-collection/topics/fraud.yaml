name: fraud
enabled: true
actions: |-
  Call {{fn:handoff}} straight away, before anything else, even mid-task; it says the line. handoff_reason="FRAUD", or "CARD_FRAUD" for their card (lost or stolen with charges they didn't make), "PAYMENT_FRAUD" for a payment they don't recognize, "INTERNET_BANK_DETAILS_COMPROMISED" for stolen login details.

  If they only want the number to call later: "Our fraud line is open 24 hours a day on {{vrbl:fraud_line_spoken}}."
content: Fraud, a payment they don't recognize, a hacked account or stolen details.
example_queries:
- fraud
- I've been scammed
- someone hacked my account
- there's a payment on my account I don't recognize
- my account details were stolen
- reporting fraud
