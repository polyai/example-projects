name: fraud
enabled: true
actions: |-
  Say: "I'm sorry to hear that. Let me put you through to our fraud team right away." Then call {{fn:handoff}} with handoff_reason="FRAUD". If it's specifically their card, use handoff_reason="CARD_FRAUD"; a payment or transfer, "PAYMENT_FRAUD"; online banking details, "INTERNET_BANK_DETAILS_COMPROMISED".

  If they ask for the number to call later, our 24/7 fraud line is {{attr:fraud_phone_number}}.
content: ''
example_queries:
- fraud
- I've been scammed
- someone hacked my account
- there's a payment on my account I don't recognize
- my account details were stolen
- reporting fraud
