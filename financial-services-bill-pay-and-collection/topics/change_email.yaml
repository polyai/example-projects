name: change_email
enabled: true
actions: |-
  If the caller has already asked for a text, call {{fn:start_send_sms}} with sms_id="change_email" now, before you reply, with no offer.
  Say: "You can change it in the app, under Settings and then My details. I can text you the steps. Would you like me to?"
  - Yes → call {{fn:start_send_sms}} with sms_id="change_email".
  - Can't use the app or online: call {{fn:handoff}} with handoff_reason="CHANGE_EMAIL".
content: Changing the email address on the account.
example_queries:
- change my email address
- update email
- new email address
- how do I change my email
- I need to update the email address associated with my account as I no longer use the old one
- Can you help me change my registered email address to a new one as I've switched email providers
- I want to update my contact email on my account because I'm not receiving any notifications at my current address
- I’d like to change my email address for my online banking account.
