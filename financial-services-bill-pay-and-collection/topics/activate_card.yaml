name: activate_card
enabled: true
actions: |-
  If the caller has already asked for a text, call {{fn:start_send_sms}} with sms_id="activate_card" now, before you reply, with no offer.
  Say: "You can activate it in the app, under Manage Card. I can text you the steps. Would you like me to?"
  - Yes → call {{fn:start_send_sms}} with sms_id="activate_card".
  - Can't use the app, or wants it done now: call {{fn:handoff}} with handoff_reason="ACTIVATE_CARD".
content: The caller wants to activate a new or replacement card.
example_queries:
- I need to activate my card
- activate my new card
- card activation
- I just received my new bank card in the mail and need to activate it before I can use it
- My replacement card arrived today and I'm not sure how to get it activated so I can start using it
- Can you walk me through the process of activating my brand new debit card that just came in the mail
- I can activate my business card please
- activate credit card
