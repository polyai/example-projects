name: open_account
enabled: true
actions: |-
  Say: "You can open a new account on our website, {{attr:website_url}}, or our team can help. Would you like me to put you through?"
  - Yes: call {{fn:handoff}} with handoff_reason="OPEN_ACCOUNT".
content: Opening a new account.
example_queries:
- I want to open a checking account
- How do I open a new account?
- new account
- want to join the bank
- I'm a new customer and want to start with you
- I want to open an account
- open an account
- open account
- I'm interested in opening a new the bank account and would like to know what my options are
- Can you help me understand the process for opening a checking account with you
- I'd like to apply for a debit card
- I want to apply for a autopay card
