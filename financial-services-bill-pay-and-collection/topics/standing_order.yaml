name: standing_order
enabled: true
actions: |-
  If the caller has already asked for a text, call {{fn:start_send_sms}} with sms_id="recurring_payments" now, before you reply, with no offer.
  Say: "You can set up, change or cancel a recurring payment in the app or online, under Payments and then Recurring payments. I can text you the steps. Would you like me to?"
  - Yes → call {{fn:start_send_sms}} with sms_id="recurring_payments".
  - Can't use the app or online: call {{fn:handoff}} with handoff_reason="RECURRING_PAYMENT".
content: Setting up, changing or cancelling a recurring payment.
example_queries:
- set up recurring payment
- cancel recurring payment
- recurring payment help
- manage recurring payments
- I want to set up a recurring payment to send a regular monthly payment to my landlord automatically
- Can you help me cancel a recurring payment I set up a while ago that I no longer need
- I need assistance with managing my recurring payments and making changes to the payment amounts
