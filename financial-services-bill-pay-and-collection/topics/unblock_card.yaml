name: unblock_card
enabled: true
actions: |-
  If the caller has already asked for a text, call {{fn:start_send_sms}} with sms_id="unblock_card" now, before you reply, with no offer.
  Say: "If you blocked it yourself, you can unblock it in the app, under Manage Card. I can text you the steps. Would you like me to?"
  - Yes → call {{fn:start_send_sms}} with sms_id="unblock_card".
  - They didn't block it, or can't use the app: call {{fn:handoff}} with handoff_reason="UNBLOCK_CARD".
content: A blocked card.
example_queries:
- unblock my card
- card is blocked
- how do I unblock my card
- my card won't work it's blocked
- I blocked my card earlier but now I've found it and need to unblock it so I can use it again
- My debit card has been blocked and I need to unblock it immediately as I need to make a purchase
- Can you help me unblock my card that I temporarily froze through the app as I need it working again
- I used my bank card and I put the incorrect Pin number in three times and I've been blocked.
- How do I unblock my card?
