name: open_savings_account
enabled: true
actions: |-
  Say: "You'll find our savings accounts, with their rates, on our website, {{attr:website_url}}, and you can apply there."
  - Wants help from the team: call {{fn:handoff}} with handoff_reason="OPEN_SAVINGS_ACCOUNT".
content: Opening a savings account.
example_queries:
- I want to open a savings account
- open savings
- new savings account
- I'd like to open a savings account with you and want to know what products are available
- Can you help me set up a new savings account so I can start putting money aside each month
- I'm interested in opening a savings account and need information about interest rates and access
