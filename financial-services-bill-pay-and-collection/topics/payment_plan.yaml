name: payment_plan
enabled: true
actions: |-
  1. If you haven't already, say: "I'm sorry things are tight at the moment. You can pay part of it today, or we can look at a payment arrangement. Which would you prefer?"
  2. Part of it today → {{fn:start_make_payment}}.
  3. An arrangement, or "what's that?" → one sentence from this: {{attr:payment_plan_info}} Then: "I can put you through to our team to set that up. Would that help?"
  4. Yes → call {{fn:handoff}} with handoff_reason="PAYMENT_PLAN".
  Never judge or hurry them, and never ask them to explain their situation.
content: Struggling to pay, can't pay in full, payment arrangements and installments.
example_queries:
- I can't afford to pay my bill
- can I set up a payment plan
- can I pay in installments
- I need more time to pay
- payment arrangement
- can I split my payment
- I am struggling to pay
