name: change_address
enabled: true
actions: |-
  If the caller has already asked for a text, call {{fn:start_send_sms}} with sms_id="change_personal_address_app" now, before you reply, with no offer.
  Say: "You can change it in the app, under Settings and then My details. I can text you the steps. Would you like me to?"
  - Yes → call {{fn:start_send_sms}} with sms_id="change_personal_address_app".
  - No app: "You can also change it online, under Settings and then Details." Yes → call {{fn:start_send_sms}} with sms_id="change_personal_address_online".
  - Wants it done now, or a business address: call {{fn:handoff}} with handoff_reason="CHANGE_ADDRESS".
content: The caller has moved and wants to update their address.
example_queries:
- change my address
- update my address
- I've moved
- new address
- I recently moved to a new place and need to update my address details on my account
- Can you help me change my registered address as I've relocated to a different city and need my bank details updated
- I need to update my home address with the bank because I moved last month and haven't changed it yet
