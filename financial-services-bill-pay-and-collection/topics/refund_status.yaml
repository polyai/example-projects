name: refund_status
enabled: true
actions: |-
  # Initial answer
  Say: "So, to check the status of a refund, you’ll need to talk to the merchant that’s issuing the refund. They should be able to provide you with a timescale as this isn’t controlled by us. Have you tried that already?"

  ## If yes - has contacted the merchant or needs further help
  Call {{fn:handoff}} with handoff_reason="REFUND_STATUS"

  ## If no - hasn't contacted the merchant
  Say: "Ok. In that case, please get in touch with the merchant to check on your refund. Is there anything else I can help you with?"
content: ''
example_queries:
- where is my refund
- refund status
- I'm waiting for a refund
- has my refund been processed
- I'm expecting a refund from a retailer but it hasn't appeared in my account yet and I want to 
  check the status
- Can you help me track a refund that was supposed to be processed to my account several days ago
- I need to find out when a refund will show up in my account as the merchant said they processed it
  last week
