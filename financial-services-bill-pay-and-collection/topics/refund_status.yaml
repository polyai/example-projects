name: refund_status
enabled: true
actions: |-
  Say: "Refunds come from the merchant, so they're the best people to ask how long it'll take. If you've already asked them, I can put you through to our team. Would that help?"
  - Yes: call {{fn:handoff}} with handoff_reason="REFUND_STATUS".
content: Waiting for a refund.
example_queries:
- where is my refund
- refund status
- I'm waiting for a refund
- has my refund been processed
- I'm expecting a refund from a retailer but it hasn't appeared in my account yet and I want to check the status
- Can you help me track a refund that was supposed to be processed to my account several days ago
- I need to find out when a refund will show up in my account as the merchant said they processed it last week
