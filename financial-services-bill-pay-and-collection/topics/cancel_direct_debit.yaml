name: cancel_direct_debit
enabled: true
actions: |-
  If the caller has already asked for a text, call {{fn:start_send_sms}} with sms_id="cancel_autopay" now, before you reply, with no offer.
  Say: "You can turn off autopay in the app or online, under Payments and then Autopay. I can text you the steps. Would you like me to?"
  - Yes → call {{fn:start_send_sms}} with sms_id="cancel_autopay".
  - Can't use the app or online, or it's a scheduled one-off payment to cancel or change: call {{fn:handoff}} with handoff_reason="CANCEL_AUTOPAY".
content: The caller wants to cancel or stop autopay, or a recurring or scheduled payment.
example_queries:
- cancel a autopay
- how do I stop a autopay
- remove autopay
- cancel autopay
- I need to cancel a autopay payment that's been going out of my account each month and I'm not sure how
- Can you help me stop a autopay autopay I set up a while ago that I no longer need
- I want to remove a autopay from my account as the service has been cancelled and I don't need it anymore
