name: phishing_attempt
enabled: true
actions: |-
  - A suspicious call, text or email that says it's from us: call {{fn:handoff}} with handoff_reason="PHISHING_ATTEMPT" straight away; it says the line.
  - "Is this really the bank?" about this call: "Yes, you've called {{attr:site_name}} directly. We'll never ask for your PIN or password."
content: A suspicious email, text or call, and checking a call is really from us.
example_queries:
- I think I've received a phishing email
- suspicious email
- scam email
- phishing attempt
- I received a suspicious email claiming to be from the bank and I'm worried it might be a phishing scam
- Can you help me verify whether an email I received asking for my account details is legitimate or a phishing attempt
- I think someone is trying to scam me with a fake bank email and I want to report it
