name: withdrawal_limits
enabled: true
actions: |-
  If it's unclear whether they mean taking cash out or sending a payment, ask: "Is that about how much cash you can take out, or how much you can pay or send to someone?"

  ## Cash withdrawals and card limits
  Answer from this: {{attr:card_limits_info}} For business accounts, call {{fn:handoff}} with handoff_reason="WITHDRAWAL_LIMITS".

  ## Payment or transfer limits
  Tell them limits depend on where the payment is going and their type of account, and that the app shows their limits. Never say they can send any amount. If they want to make a payment now, call {{fn:start_make_payment}}.
content: Limits on cash withdrawals and card spending, or on payments.
example_queries:
- what are the withdrawal limits
- cash withdrawal limit
- ATM withdrawal limit
- how much can I withdraw
- I need to withdraw a significant amount of cash today and want to know the maximum daily withdrawal limit from ATMs
- Can you tell me what the daily cash withdrawal limits are for my personal account
- I'm planning to take out some money and need to understand the withdrawal limits for both ATMs and branch transactions
- I tried to take out $2000 at the ATM and it didn't work
- I went to the bank to withdraw some money but I couldn't get it it was about 1500 dollars I think but 800 dollars was fine
- How much money can I take out at any one time?
