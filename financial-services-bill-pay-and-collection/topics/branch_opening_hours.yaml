name: branch_opening_hours
enabled: true
actions: |-
  Answer only what they asked, in one sentence, from this: {{attr:branch_info}}

  A particular branch that the website doesn't cover: call {{fn:handoff}} with handoff_reason="BRANCH_OPENING_HOURS".
content: Branch locations and branch opening hours.
example_queries:
- what are your branch opening hours
- when is the branch open
- opening times for branches
- branch hours
- I need to visit my local the bank branch tomorrow and want to know what time it opens in the morning
- Could you tell me the opening hours for the branch nearest to me as I need to pop in this week
- What are the typical opening and closing times for the bank branches and are you open on Saturdays
