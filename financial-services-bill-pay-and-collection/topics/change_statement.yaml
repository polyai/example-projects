name: change_statement
enabled: true
actions: |-
  If the caller has already asked for a text, call {{fn:start_send_sms}} with sms_id="change_statement" now, before you reply, with no offer.
  Say: "You can switch between paper and paperless statements online, under Settings and then Statement preferences. I can text you the steps. Would you like me to?"
  - Yes → call {{fn:start_send_sms}} with sms_id="change_statement".
  - Can't do it online: call {{fn:handoff}} with handoff_reason="CHANGE_STATEMENT".
content: 'Changing how statements arrive: paper by mail or paperless.'
example_queries:
- change statement preferences
- stop paper statements
- switch to electronic statements
- change how I receive statements
- I want to stop receiving paper statements by mail and switch to getting them electronically instead
- Can you help me change my statement preferences so I get digital statements rather than physical ones
- I'd like to modify how I receive my bank statements as I prefer to go paperless for environmental reasons
- where can I find paper statements? I prefer this
- How can I get my statement sent by mail?
- I can't seem to get my statements and I wanted to change how I receive them.
