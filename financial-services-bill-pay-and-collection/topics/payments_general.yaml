name: payments_general
enabled: true
actions: |-
  - Paying their bill or making a payment on their account: call {{fn:start_make_payment}}.
  - Sending money to someone else: say "You can send money to someone in our app or online banking, under Pay and Transfer." Can't use either: call {{fn:handoff}} with handoff_reason="MONEY_TRANSFER".
  - Not clear which: ask "Are you looking to pay your bill, or send money to someone?"
content: Making a payment, or sending money.
example_queries:
- I want to make a payment
- pay my bill
- How do I send money?
- Transfer money to someone
- Make a transfer of $100 to a friend
- I want to pay what I owe
- make a payment on my account
