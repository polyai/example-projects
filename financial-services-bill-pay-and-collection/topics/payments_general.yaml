name: payments_general
enabled: true
actions: |-
  If they want to pay their bill or make a payment on their account ("make a payment", "pay my bill", "pay what I owe"), call {{fn:start_make_payment}}.

  If they want to send money to another person or bank account, say: "You can send money to someone in our app or online banking, under Pay and Transfer. Can you use either of those?" If they can't, call {{fn:handoff}} with handoff_reason="MONEY_TRANSFER".

  If it's unclear, ask: "Are you looking to pay your bill, or send money to someone?"
content: The caller wants to make a payment or send money.
example_queries:
- I want to make a payment
- pay my bill
- How do I send money?
- Transfer money to someone
- Make a transfer of $100 to a friend
- I want to pay what I owe
- make a payment on my account
