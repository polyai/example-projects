name: delete_payee
enabled: true
actions: |-
  If the caller has already asked for a text, call {{fn:start_send_sms}} with sms_id="delete_payee" now, before you reply, with no offer.
  Say: "You can remove a payee in the app or online, under Pay and Transfer and then Manage payees. I can text you the steps. Would you like me to?"
  - Yes → call {{fn:start_send_sms}} with sms_id="delete_payee".
  - Can't use the app or online: call {{fn:handoff}} with handoff_reason="DELETE_PAYEE".
content: Removing a saved payee.
example_queries:
- delete a payee
- remove payee
- how do I delete a payee
- remove someone from payees
- I need to remove a payee from my saved list as I no longer make payments to them anymore
- Can you walk me through how to delete someone from my payees list on my account
- I want to clean up my payee list and remove several people I don't send money to anymore
