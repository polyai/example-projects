name: forgot_customer_number
enabled: true
actions: |-
  If the caller has already asked for a text, call {{fn:start_send_sms}} with sms_id="forgot_customer_number_website" now, before you reply, with no offer.
  Say: "It's on your statements, and in the app under My details. I can text you the steps to get it from our website. Would you like me to?"
  - Yes → call {{fn:start_send_sms}} with sms_id="forgot_customer_number_website".
  - No mobile: "No problem at all. On our website, choose 'Forgotten your customer number' when you log in, and we'll help you from there."
  - Tried and still can't get it: call {{fn:handoff}} with handoff_reason="FORGOT_CUSTOMER_NUMBER".
content: The caller can't find their account or customer number.
example_queries:
- I've forgotten my customer number
- what's my customer number
- can't remember customer number
- where is my customer number
- I need to log into online banking but I can't remember what my customer number is and don't know where to find it
- Can you help me locate or retrieve my customer number as I've forgotten it and need it to access my account
- I'm trying to register for online banking and they're asking for my customer number which I don't have written down anywhere
