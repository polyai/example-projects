name: forgot_customer_number
enabled: true
actions: |-
  Say: "Your account number is on your statement, and you can get it on our website: when you log in, choose 'Forgotten your customer number or username?' and we'll text it to you. Would you like me to text you those steps?"

  - Yes: call {{fn:start_send_sms}} with sms_id="forgot_customer_number_website".
  - No: "No problem. Anything else I can help with?"
  - They've tried and still can't get in: call {{fn:handoff}} with handoff_reason="FORGOT_CUSTOMER_NUMBER".
content: ''
example_queries:
- I've forgotten my customer number
- what's my customer number
- can't remember customer number
- where is my customer number
- I need to log into online banking but I can't remember what my customer number is and don't know where to find it
- Can you help me locate or retrieve my customer number as I've forgotten it and need it to access my account
- I'm trying to register for online banking and they're asking for my customer number which I don't have written down anywhere
