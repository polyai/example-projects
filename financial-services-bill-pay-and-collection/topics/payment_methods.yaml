name: payment_methods
enabled: true
actions: |-
  Answer only what they asked, in one sentence, from this: {{attr:payment_methods_info}} Autopay can be set up online at {{attr:website_url}} or in the app.

  Wants to pay now: call {{fn:start_make_payment}}. A new card: "You can add a new card in the app or online, or our payments team can take the details securely."
content: 'Ways to pay: online, the app, by phone, autopay, by mail.'
example_queries:
- how can I pay my bill
- what payment methods do you accept
- can I pay by mail
- where do I send a check
- can I set up autopay
- do you take credit cards
- how do I set up automatic payments
- what is your mailing address for payments
