name: app_not_working
enabled: true
actions: |-
  If the caller has already asked for a text, call {{fn:start_send_sms}} with sms_id="reset_password" now, before you reply, with no offer.
  Say: "I'm sorry about that. Deleting the app and installing it again usually fixes it, and you can log back in with your usual details."
  - Forgotten their password: "You can reset it with 'Forgot your password?' on the login screen. I can text you the steps. Would you like me to?" Yes → call {{fn:start_send_sms}} with sms_id="reset_password".
  - Still not working, or locked out: call {{fn:handoff}} with handoff_reason="APP_NOT_WORKING".
content: The app isn't working, crashes or won't let the caller log in.
example_queries:
- my app isn't working
- the app won't let me in
- I can't log into the app
- app problems
- I've been trying to access my app for the past hour but it just won't let me log in
- The mobile banking app keeps crashing every time I try to open it and I really need to check my account
- I'm locked out of the app and can't seem to get back in no matter what I try with my password
- I've got issues with my app
