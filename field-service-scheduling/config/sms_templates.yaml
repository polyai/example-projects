sms_templates:
- name: balance-due
  text: |-
    Dear Customer, thank you for calling {{vrbl:site_name}} today.
    Please use this to log into your account: {{vrbl:customer_portal_url}}.
    Once you log in, you will see your account details. Your username is your Account Number.
    Thank you!
  env_phone_numbers:
    sandbox: ''
    pre_release: ''
    live: '+12015550100'
- name: update-billing-info
  text: |-
    Dear Customer, thank you for calling {{vrbl:site_name}} today.
    Please use this link to access your online portal: {{vrbl:customer_portal_url}}
    Once you're logged in, you can update your billing information. Your username is your Account Number.
    Thank you!
  env_phone_numbers:
    sandbox: ''
    pre_release: ''
    live: '+12015550100'
- name: pay-online
  text: |-
    Dear Customer, thank you for calling {{vrbl:site_name}} today.
    Please use this link to log into your account: {{vrbl:customer_portal_url}}
    Once logged in, you'll see your account details right away and can pay online. Your username is your Account Number.
    Thank you!
  env_phone_numbers:
    sandbox: ''
    pre_release: ''
    live: '+12015550100'
- name: auto-payment
  text: |-
    Dear Customer, thank you for calling {{vrbl:site_name}} today.
    Please find more information on setting up automatic payments at {{vrbl:customer_portal_url}}. Your username is your Account Number.
    Thank you!
  env_phone_numbers:
    sandbox: ''
    pre_release: ''
    live: '+12015550100'
