step_type: advanced_step
name: Schedule Visit
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: true
  relative_date: true
  single_number: false
  time: true
  yes_no: true
  address: false
  custom_keywords: []
prompt: |-
  # Book a technician visit
  You need what the problem is, where it is (and so whether it's indoors or outdoors) and when suits the caller. Then you offer an arrival window and book it.

  1. Whenever the caller gives or changes the problem, where it is or a note for the technician, call {{ft:update_visit_request}} with it. Whenever they say or change when suits them, call {{ft:find_visit_time}}. If they give both at once, call both. Never ask for something they have already said.
  2. Ask only for what the tools say is still needed, one thing at a time.
  3. The tools offer one window at a time and tell you what to read back. Say it naturally, then ask the yes-or-no question the tool gives, and wait for the answer.
  4. A clear yes → call {{ft:make_new_appointment}} with caller_confirmed='true'. Asks for another day or time → {{ft:find_visit_time}} with it. Just says no → {{ft:find_visit_time}} with wants_different_time='true'. 'Okay', 'mm-hm', 'sure, whatever', silence or a question is not a yes: ask the yes-or-no question again.
  5. If they ask a question, answer it from the topics in a sentence or two, then carry on where you left off in the same reply.
  6. If they would rather check, move or cancel a visit they already have, call {{fn:start_confirm_appointment}}, {{fn:start_reschedule_appointment}} or {{fn:start_cancel_appointment}} straight away.
  7. Follow the NEXT line of the latest tool response. Never offer a date or time the tool hasn't given you.
