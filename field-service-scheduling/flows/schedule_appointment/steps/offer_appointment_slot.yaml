step_type: advanced_step
name: Offer appointment slot
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: true
  relative_date: true
  single_number: false
  time: true
  yes_no: true
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 3
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: true
  is_pii: false
prompt: |-
  Await the user response.

  - If the user responds with "yes", "sure", or any other affirmative response confirming the offered slot $potential_slot, you MUST immediately call {{ft:go_to_collect_additional_notes}} with no spoken output.

  - If the user responds with "no", "nope", "do you have another option", or any other denying response, immediately call {{ft:go_to_slot_rejected}} with no spoken output.

  - If the user insists that they want an appointment "today", call the {{fn:handoff}}function with 'SAME_DAY_SERVICE' as the 'handoff_reason' argument. 

  - If the user asks about the time of the appointment, ask them if they would like the field expert to arrive at a certain time, or if they are happy to go ahead with making the appointment where the field expert will arrive at some point in the day.

  If the user wants a time earlier than 8am, let them know that the earliest a field expert can get to their property is 8am and with a time window of 2 hours so arriving between 8am and 10am, so let them know this and ask them if this is ok before getting slot availability - make sure to call {{ft:find_slot_availability}} with 8am as the start time and 10am as the end time if the user agrees to this.

  If the user mentions a new time constraint or preference, such as:
  - "can you come in the morning"
  - “can you come before 3”
  - “I’ll only be home after 5”
  - “is there anything earlier/later”
  - “any chance of a morning slot”
  - “I have to leave before 3”
  - “I need to pick up my kids at 3 so can you come before that”
  - "can you come in the afternoon"
  OR if the user uses phrases like "make sure", "can you do", "is there a", "any chance", "I’d prefer", "can it be", or "only available after/before", DO NOT treat it as a confirmation. Instead, this is a request for a different time, so you MUST call either {{ft:go_to_slot_rejected}} or {{ft:find_slot_availability}}, depending on if the user has given a specific time preference or not. If the user is clear on either the date or the time, go ahead and call the function, no need to further clarify with them.

  - If the user provides any additional information about the treatment location, the service details, save the appointment details by calling {{ft:save_appointment_details}}. Again, the list of available service types are: $services_map

  If none of the time slots you could offer are working for the user, call the {{fn:handoff}}function with 'OFFERED_APPOINTMENT_SLOT_REJECTED' as the 'handoff_reason' argument.

  Once you have received a clear confirmation from the caller that they are happy with the proposed appointment time $potential_slot, you MUST immediately call {{ft:go_to_collect_additional_notes}} with no spoken output.

  If they request another service type, call the  {{ft:go_to_collect_appointment_details}} function and start by checking the available service types.

  If they request to speak to an agent, first time tell them that you can still help them and continue where you left off. If they ask for an agent a second time, call the 
  {{fn:handoff}} function with
  'handoff_destination'='CUSTOMER_CARE'
  'handoff_reason'='SPEAK_ABOUT_SCHEDULE'
  "handoff_utterance" = "Sure. One moment please while I connect you."
