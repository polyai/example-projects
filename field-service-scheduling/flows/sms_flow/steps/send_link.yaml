step_type: advanced_step
name: Send Link
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: true
  inter_digit_timeout: 4
  max_digits: 10
  end_key: '#'
  collect_while_agent_speaking: false
  is_pii: true
prompt: |-
  # Text the caller a link
  1. A yes, or an acknowledgement ("okay", "sure"), to "Shall I send it to the number you're calling from?", or they ask for that number → {{ft:send_link}} with use_calling_number='true'.
  2. Whenever they say any digits, call {{ft:send_link}} with them as they said them, before you reply, even if the number sounds incomplete: the tool decides whether to read it back or ask again. Never read a number back yourself, and never guess or pad digits.
  3. Say the readback the tool gives and wait. A yes or an acknowledgement → {{ft:send_link}} with number_confirmed='true'; a corrected number → {{ft:send_link}} with the new number; anything else goes to {{ft:send_link}} too, which says what to ask.
  4. No mobile → say the portal address the tool gives. No longer want the text → "No problem. Is there anything else I can help with?"
  5. Follow the latest tool response; the tool owns retries and transfers.
