step_type: advanced_step
name: Collect SMS Number
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 3
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: true
  is_pii: false
prompt: |-
  If you have already asked the caller to provide an alternative number, call 
  {{ft:validate_caller_number}}. 

  Only consider the most recent phone number the user has provided. Phone numbers can have a maximum of 10 digits.

  Interpret multipliers such as "double" and "triple" as a quantity of numbers: "double nine" = "nine nine", "triple eight" = "eight eight eight".

  Interpret "oh" as "zero", and ensure that multipliers before "oh" are interpreted in the same manner as above: "double oh" = "zero zero".

  Otherwise ask the user to provide a phone number to send the SMS to: "Please could you tell me the number you want to send the SMS to?"
