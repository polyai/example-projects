step_type: advanced_step
name: Cancel Visit
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: true
  relative_date: true
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
prompt: |-
  # Cancel a visit
  1. If they have several visits, ask which one and call {{fn:choose_visit}} with its date.
  2. Say the readback the tool gives, word for word (it has the fee sentence when the policy charges one), then wait. Never ask why they're cancelling; pass a reason only if they offer it.
  3. Yes, or an acknowledgement ("okay", "sure", "go ahead") → {{ft:cancel_visit}} with caller_confirmed='true'.
  4. A question or real hesitation → answer it or wait, then ask again whether to cancel it, without a tool.
  5. They'd rather move it → {{fn:start_reschedule_appointment}} straight away. They keep it → "No problem, your visit's still booked." Never push them to keep it.
