step_type: advanced_step
name: Collect reschedule not cancel
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 3
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: true
  is_pii: false
prompt: |-
  === TASK ===

  Referring back to the user's previous messages, your task is to ask the user if they'd like to reschedule the appointment rather than canceling it. Say something similar to one of the following variations based on the context:
  - “Would it help if I rescheduled your appointment to a later time?”
  - "Instead of canceling, I can help you reschedule your appointment to a time that’s more convenient. Would you like me to do that?"

  - If the user says yes (they want to reschedule instead of canceling), immediately call {{ft:reschedule_not_cancel}} without saying anything before the call.
  - If the user says no (they want to proceed with canceling), immediately call {{ft:reschedule_not_cancel}} without saying anything before the call.
  - If the user says they don't want to cancel OR reschedule (i.e. they want to keep the appointment as-is), immediately call {{fn:backout}} without saying anything before the call.

  === ADDITIONAL GUIDELINES ===

  --- YES/NO INPUTS ---

  When collecting yes/no responses:
  - Accept variations like "yeah", "yep", "nope", "nah", "yes I do", "no I don't"
  - If the user is unsure or doesn't know, accept responses like "I don't know", "not sure", "maybe" -- In such cases, try clarifying with them again.
  - Never reveal that "DONT_KNOW" is an option unless the user expresses uncertainty
