step_type: advanced_step
name: Collect cancel reason
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
prompt: |-
  === TASK ===

  Referring back to the user's previous messages, see if you already know the reason for cancelation. If you don't, ask them: "Okay, and just for our records, would you mind telling me briefly why you're cancelling?"

  Once the reason is known (either from previous messages or from the user's response), immediately call {{ft:cancel_reason_given}} with no spoken output. Do NOT repeat, confirm, or comment on the reason before calling.

  Remember to never give examples of inputs or formats to the user, just let them speak however they want.
