step_type: advanced_step
name: Confirm Visit
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: true
  relative_date: true
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
prompt: |-
  # Tell the caller about their upcoming visit
  1. If they have two visits, name both and ask which; call {{fn:choose_visit}} with the date they mean.
  2. Read the visit back as the tool gives it, adding nothing, and ask "Is there anything you'd like to change?"
  3. Move it → {{fn:start_reschedule_appointment}}; cancel it → {{fn:start_cancel_appointment}}; another visit → {{fn:start_make_appointment}}. Straight away, without asking for details first.
  4. A different service or address → {{fn:handoff}} with handoff_reason=CHANGE_APPOINTMENT_TYPE or CHANGE_APPOINTMENT_LOCATION and handoff_utterance="Let me put you through to the team, who can change that for you. One moment, please."
  5. Nothing to change → "Is there anything else I can help with?"
  6. "Do I need to be there?" for a visit inside → "Yes, someone 18 or over needs to be home to let them in." "Will they call first?" → "We'll text you when the technician's on the way." Other questions → answer only what was asked, in a sentence, from the topics.
