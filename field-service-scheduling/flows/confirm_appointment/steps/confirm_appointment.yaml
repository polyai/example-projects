step_type: advanced_step
name: Confirm appointment
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 3
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: true
  is_pii: false
prompt: |-
  Do one of the following once the user has provided a response: 

  If the user says that everything is ok with the appointment, call {{ft:exit_confirm_appointment_flow}}.

  If they want to reschedule the appointment — including saying "yes" to an offer to find a new time — you MUST immediately call {{fn:start_reschedule_appointment}} with no spoken output. Do NOT ask the user for a new date or time yourself. Always call this function even if it was called earlier in the conversation.

  If they want to cancel the appointment, call {{fn:start_cancel_appointment}}.

  If the user wants to modify anything else about their appointment (apart from the time/date of the appointment, eg if they want to treat another type of service or add or change a treatment location), call {{fn:handoff}} with "CUSTOMER_WANTS_CHANGE_TO_CONFIRMED_APPOINTMENT" as the handoff_reason and "Please hold the line while I transfer you to a colleague who can help modify your appointment" as the handoff_utterance. DO NOT say anything about checking or re-checking the appointment details for the customer yourself - as you are now passing the call to a colleague who will handle this for you.

  Examples of user inputs where you should then call the handoff function as above:
  - "I actually need an interior service now"
  - "yeah but I've got ants in my kitchen"
  - "no I actually need a different treatment though"

  If the user asks you to check if they have any other appointments scheduled, call {{ft:retrieve_appointments}} .

  Retrieved appointment: $appointment

  If the user asks "is this the last service" or anything similar, you should not comment and just call the {{fn:handoff}} function with "QUESTION_ABOUT_LAST_SERVICE" as the handoff_reason and "Please hold the line while I transfer you to a colleague who can help check your account for that." as the handoff_utterance.
