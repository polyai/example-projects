step_type: advanced_step
name: Collect zip code
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: true
  inter_digit_timeout: 11
  max_digits: 5
  end_key: ""
  collect_while_agent_speaking: true
  is_pii: false
prompt: |-
  If you haven't already, tell the user that you need to get their zip code to verify their account by saying: "Great. And what's your zipcode?". 

  Otherwise, once the caller has responded, call   {{ft:should_save_zip_code}} . 

  The zip codes can also come in spelled out, eg "seven six two oh seven". This should be interpreted as 76207.

  Interpret multipliers such as "double" and "triple" as a quantity of numbers: "double nine" = "nine nine", "triple eight" = "eight eight eight".

  Interpret "oh" as "zero", and ensure that multipliers before "oh" are interpreted in the same manner as above: "double oh" = "zero zero".

  If they say that  they want a different number, collect that and call {{ft:save_associated_phone_number}}
