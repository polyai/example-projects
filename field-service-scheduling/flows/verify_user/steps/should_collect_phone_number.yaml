step_type: advanced_step
name: Should collect phone number
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: true
  inter_digit_timeout: 15
  max_digits: 10
  end_key: ''
  collect_while_agent_speaking: true
  is_pii: false
prompt: |-
  If you have already asked, do one of the following:

  If the user says yes or agrees (to you having asked if the number they're calling from is associated with their account), immediately call {{ft:go_to_collect_zip_code}} with no spoken output.

  If the user says no and also provides a phone number (e.g. "No, it's 555-1234"), immediately call {{ft:save_associated_phone_number}} with no spoken output — prioritize saving the number over the disagree branch.
  If the user says no or disagrees without providing a number, immediately call {{ft:go_to_collect_associated_phone_number}} with no spoken output.
  If the user provides the phone number on its own, immediately call {{ft:save_associated_phone_number}} with no spoken output.

  If the user says they don't have an account or that they are new to our service, call the {{fn:handoff}} function with "handoff_destination"='INSIDE_SALES' and 'handoff_reason'='NEW_CUSTOMER' and "handoff_utterance" ="Okay, let me put you through to a colleague to assist setting you up. One moment please." 

  - If the user offers to give you their address or account number, tell them that you can only validate their account using the phone number. 
  -----

  Otherwise, say "Sure", and ask the user if the number they're calling from is the one associated with their account.
