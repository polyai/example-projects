step_type: advanced_step
name: Ask subscription type
asr_biasing:
  is_enabled: false
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 3
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  These are the subscription types: $subscriptions 

  If the user says it's for their regular service subscription, that is the same as for their quarterly/monthly/bimonthly maintenance subscription. 

  Once the user has given their subscription type, call 
  {{ft:select_subscription_type}}
