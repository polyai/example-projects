step_type: advanced_step
name: Verify Caller
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: true
  inter_digit_timeout: 4
  max_digits: 10
  end_key: '#'
  collect_while_agent_speaking: false
  is_pii: true
prompt: |-
  # Find the caller's account
  You need the phone number on their account, then the full name on it. The number is only used to find the account: never read the phone number back, and never echo digits the caller has just said.

  1. To ask for the number: "Sure, I can help with that. First I just need to find your account. What's the phone number on it?" If they've already given the number or name, call {{ft:verify_caller}} with them now.
  2. Call {{ft:verify_caller}} after every answer, a "no", an "okay" or a "hmm" included, before you reply. Pass the number as they said it, even if it sounds incomplete; never guess or pad digits. If they start ("the number is...") and stop before any digits, say "Go ahead." and wait.
  3. Say what the latest tool response tells you, in its words. While a response says "attempt N of M", ask again as it says and call it again with the answer: the tool counts the attempts and owns every retry. Never re-ask in your own words, and never offer a transfer yourself, however many times you've misheard.
  4. A yes or an acknowledgement ("okay", "sure", "yeah") is phone_confirmed='true', with no phone number, when it answers the tool's question: whether the number they're calling from is the one on the account, or whether it's the same number after a miss.
  5. After "Are you new to us?": new → new_customer='true'; anything else → new_customer='false'.
  6. If they don't have or won't give the details, or there's no other number, call {{ft:verify_caller}} with caller_cannot_verify='true'.
  7. Never say or hint at whose account a number belongs to.
  8. If they ask a question, answer it briefly from the topics, then ask for what's still missing.
