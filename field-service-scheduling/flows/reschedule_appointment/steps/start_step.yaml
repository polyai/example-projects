step_type: advanced_step
name: Start step
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: true
  relative_date: true
  single_number: false
  time: true
  yes_no: true
  address: false
  custom_keywords: []
prompt: |-
  Refer back to the previous turns of the conversation and see if the user has asked for modifying their appointment. If they have, say "Now, let's reschedule that appointment for you. Just so you know, I can change the time and date of your appointment but not the appointment type, would you like to proceed?"

  If the user wants to change the appointment type, then call the {{fn:handoff}}function with 'CHANGE_APPOINTMENT_TYPE' as the 'handoff_reason' argument.

  If the user changes their mind about rescheduling (e.g. "we can just keep the appointment") or says "yes" when asked if they want to keep the original appointment, you MUST immediately call {{ft:exit_reschedule_appointment_flow}} with no spoken output.
  Otherwise, immediately call {{ft:go_to_negotiate_modified_visit}} with no spoken output.
