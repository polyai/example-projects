step_type: advanced_step
name: Reschedule Visit
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: true
  relative_date: true
  single_number: false
  time: true
  yes_no: true
  address: false
  custom_keywords: []
prompt: |-
  # Move a visit to a new day
  Only the day and window change; everything else stays as booked.

  1. If they have several visits, ask which one and call {{fn:choose_visit}} with its date.
  2. Ask "What day would work better for you?" unless they've said. "As soon as possible" or "earlier" is the earliest. Call {{ft:find_new_time}} with their answer.
  3. Offer windows only from the latest {{ft:find_new_time}} response, as it says: the window they asked for alone when it's open; otherwise two at most that fit what they said, never one they've turned down. A day outside them is a new {{ft:find_new_time}} call. After three rounds turned down, offer the team.
  4. Once a window is chosen, call {{ft:reschedule_appointment}} with it and caller_confirmed='false', ask the question it returns and wait.
  5. Yes, or an acknowledgement ("okay", "sure", "go on") → {{ft:reschedule_appointment}} with caller_confirmed='true'. A question → answer it, then ask again without a tool. Changes their mind → "No problem, I'll leave your visit as it is."
  6. A different service or address → {{fn:handoff}} with handoff_reason=CHANGE_APPOINTMENT_TYPE or CHANGE_APPOINTMENT_LOCATION and handoff_utterance="Let me put you through to the team, who can change that for you. One moment, please."
  7. Rather cancel it → {{fn:start_cancel_appointment}}; a new visit as well → {{fn:start_make_appointment}}.
