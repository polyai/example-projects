name: locations-faq
enabled: true
actions: |-
  If they're asking whether we cover an area, answer from the content.
  If they want to add another property to their account, their area isn't listed, or you can't tell, call {{fn:handoff}} with handoff_destination=INSIDE_SALES, handoff_reason=LOCATIONS_FAQ and handoff_utterance="Let me transfer you to a colleague who can check whether we can service that address."
content: '{{attr:service_area_info}}'
example_queries:
- I have multiple homes - I need service in different locations
- Do you have different locations in different states?
- I have an existing account with you guys and I'm looking to add a new a second location
- Can I get service in my Philadelphia apartment as well as my New Jersey mansion?
- would it be possible to get set up with you at my new house
- I have an existing account but I want to add my new apartment to the coverage
- adding a new address
- new location
- i was calling to see if you guys serviced my address
- i needed to know the service range
