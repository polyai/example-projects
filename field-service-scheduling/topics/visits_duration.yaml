name: visits-duration
enabled: true
actions: Answer only the part of the content about how long a visit takes. If the caller is really asking when their visit is (not how long it takes), call {{fn:start_confirm_appointment}} instead.
content: '{{attr:appointment_window_info}}'
example_queries:
- How long will the appointment take?
- How long does a visit take?
- How long should I expect the technician to take?
- What's the duration of an appointment?
- How long does it take to complete the service?
