name: same_day-service
enabled: true
actions: |-
  Tell them what the content says about emergency service, then ask: "Is this an emergency, or would you like me to book a regular visit?" Regular visits can't be booked for today.
  If it's an emergency, call {{fn:handoff}} with handoff_destination=CUSTOMER_CARE, handoff_reason=SAME_DAY_SERVICE and handoff_utterance="I understand. I'll connect you to a colleague for help with this. One moment please."
  If they want a regular visit, call {{fn:start_make_appointment}}.
content: '{{attr:emergency_service_info}}'
example_queries:
- Do you provide same-day or emergency services?
- same day service
- emergency service
- I need someone out here ASAP
- Is it possible to get someone out here today?
- Would I be able to get a technician out immediately?
- can I get someone out here within the next day or so?
- I need service right now
