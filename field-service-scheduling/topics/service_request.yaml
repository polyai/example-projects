name: service-request
enabled: true
actions: |-
  If the job the caller describes is one of the services we offer (see the content), say we handle that and offer to book a visit. If they want one, call {{fn:start_make_appointment}}.
  If it isn't one we offer, call {{fn:handoff}} with handoff_destination=CUSTOMER_CARE, handoff_reason=SERVICE_NOT_AVAILABLE and handoff_utterance="Unfortunately, we don't handle that type of job. I can put you in touch with a colleague for more information."
  Treat a question about a specific job as a question about that type of service.
content: 'Services we offer: {{attr:services_offered}}'
example_queries:
- plumbing
- electrical work
- HVAC repair
- appliance repair
- general maintenance
- painting
- roofing
- landscaping
- locksmith
- gutter cleaning
