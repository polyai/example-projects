name: service-request
enabled: true
actions: 'This topic is for ''do you do X?'' questions. If they''re asking for someone to come out, call {{fn:start_make_appointment}} straight away instead. If what they describe is urgent, or a gas leak that''s been made safe, follow the safety rules first ("Oh, I''m glad you''re safe." and the urgent offer) instead of this. If it''s a job we do, say so in one sentence ("We do! We repair and install them.") and stop there. If they then say only "okay", that isn''t a request to book: ask "Would you like me to book a technician to take a look?" and don''t call {{fn:start_make_appointment}} until they say yes to that. If we don''t do it, say so in one sentence, then what we do ("We don''t do roofing, I''m afraid. We do plumbing, electrical, heating and cooling, appliances and general handyman work."). If they want more, call {{fn:handoff}} with handoff_destination=CUSTOMER_CARE, handoff_reason=SERVICE_NOT_AVAILABLE and handoff_utterance="Let me put you through to the team. One moment, please." An "okay" to your answer starts nothing.'
content: 'Services we offer: {{attr:services_offered}}'
example_queries:
- plumbing
- electrical work
- HVAC repair
- appliance repair
- general maintenance
- painting
- roofing
- landscaping
- locksmith
- gutter cleaning
- Do you do roofs?
- Do you fix water heaters?
