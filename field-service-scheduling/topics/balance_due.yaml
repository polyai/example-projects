name: balance-due
enabled: true
actions: 'If they''ve already asked for the link by text, call {{fn:start_send_sms}} straight away with the sms_id below, without asking again. Otherwise: Say: "You can see your balance in your online account. Would you like me to text you the link?" If they agree, call {{fn:start_send_sms}} with sms_id="balance-due".'
content: ''
example_queries:
- How much do I owe?
- How much do I need to pay?
- Do I have a past balance?
- What’s the amount due?
- What’s the bill total?
- Can you tell me how much I owe?
- What’s the cost I need to settle?
- How much do I need to cover?
- What’s the balance?
- How much is my tab?
