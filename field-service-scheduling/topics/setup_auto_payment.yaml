name: setup_auto-payment
enabled: true
actions: |-
  ##If routing is enabled (routing_enabled is {{vrbl:routing_enabled}}), immediately call {{fn:route_call}} with caller_intent='BILLING_QUESTION'. Do not answer the question.

  ##Otherwise, tell the user: "We can send you a text with your online portal link, where you can set up auto payments. Would you like that link?"
  If the user confirms, call {{fn:start_send_sms}} with sms_id="auto-payment"
content: ""
example_queries:
  - How can I set up auto payments?
  - enable auto payments for my bills
  - Can you tell me how to set up recurring payments
  - How do I set up automatic payments?
  - How can I arrange for recurring payments?
  - schedule automatic payments
  - make my payments automatic
