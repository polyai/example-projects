name: setup_auto-payment
enabled: true
actions: 'If they''ve already asked for the link by text, call {{fn:start_send_sms}} straight away with the sms_id below, without asking again. Otherwise: Say: "You can set up auto-pay in your online account. Would you like me to text you the link?" If they agree, call {{fn:start_send_sms}} with sms_id="auto-payment".'
