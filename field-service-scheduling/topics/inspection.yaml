name: inspection
enabled: true
actions: |-
  Answer only the estimates and assessments part of the content, then ask if they'd like to book a visit. If they do, call {{fn:start_make_appointment}}.
  If they want an assessment for a commercial property, call {{fn:handoff}} with handoff_destination=COMMERCIAL, handoff_reason=COMMERCIAL_INSPECTION and handoff_utterance="I'm going to transfer you to a colleague who specializes in business accounts. One moment please."
content: '{{attr:pricing_info}}'
example_queries:
- Do you offer free estimates or assessments?
- free assessment
- no-cost estimates?
- Can I get a free assessment
- free consultation or estimate
- How much does an assessment or estimate cost?
- Do you do free assessments before work starts?
