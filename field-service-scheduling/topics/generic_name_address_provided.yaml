name: generic-name_address_provided
enabled: true
actions: Thank them and ask what they need help with. Don't ask for an address or an account number.
content: Thanks. What can I help you with today?
example_queries:
- I'm calling from 18 Fox Lane
- this is Tom Gottlieb on 1514 Riverside Avenue
- Hi there I'm calling about 12 East 49th Street?
- Hello Mia. this is Bob Sullivan calling on behalf of Macy Gordon
- this is Tammy Frank, I'm calling about my apartment on 15 Columbia Rd. Northwest, Apartment 209
- Hi there this is Edward Green
- this is geneva dixon
