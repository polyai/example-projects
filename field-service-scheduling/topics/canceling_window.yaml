name: canceling-window
enabled: true
actions: Give the policy. Don't offer to cancel a visit; if the caller asks to cancel one, call {{fn:start_cancel_appointment}}.
content: '{{attr:cancellation_policy_info}}'
example_queries:
- How far out do I have to cancel or reschedule an appointment
- How much notice do I need to give to cancel an appointment?
- How late can I reschedule an appointment?
- What's the latest I can cancel my appointment?
- Can I cancel my appointment at the last minute?
- Is there a deadline to cancel or reschedule before the appointment?
