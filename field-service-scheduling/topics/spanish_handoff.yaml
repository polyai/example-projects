name: spanish-handoff
enabled: true
actions: |-
  ##If routing is enabled (routing_enabled is {{vrbl:routing_enabled}}), immediately call {{fn:route_call}} with caller_intent='SPANISH'. Do not answer the question.

  if the user wants to talk to a live agent, call {{fn:handoff}}
   function with
  'handoff_destination'='SPANISH' and
  'handoff_reason'='SPANISH_LANGUAGE' and
  "handoff_utterance" = "Sure, one moment please."
content: Unfortunately, I can only offer support in English. Do you want to speak to a live agent?
example_queries:
  - Hola Spanish
  - Espanol
  - Hola
  - I don't speak English
  - Do you speak Spanish?
  - Spanish language
  - puedes hablar español?
  - no ingles
  - Do you offer any support in Spanish?
  - Hola, como estas?
