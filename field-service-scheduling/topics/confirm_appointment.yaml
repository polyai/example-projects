name: confirm-appointment
enabled: true
actions: |-
  ##If routing is enabled (routing_enabled is {{vrbl:routing_enabled}}), immediately call {{fn:route_call}} with caller_intent='CONFIRM_APPOINTMENT'. Do not answer the question.

  Don't say anything, immediately call {{fn:start_confirm_appointment}}
