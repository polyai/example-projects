name: change-appointment-location
enabled: true
actions: |-
  call {{fn:handoff}}
   function with
  'handoff_destination'='CUSTOMER_CARE'
  'handoff_reason'='CHANGE_APPOINTMENT_LOCATION'
  "handoff_utterance" = "I'll put you through to a colleague who can assist with that. One moment please."
content: ''
example_queries:
- I accidentally put down the wrong address for my home
- change visit address
- wrong visit location
- I need to change the address associated with my next visit
- can I move my upcoming service visit to another one of my houses?
- modify location of the appointment
- my booking is for the wrong house
- Hi there so I just got a text confirming my next appointment, but it had the wrong address down for my house
- I actually want the tech to come to my beach house instead of my apartment in the city
