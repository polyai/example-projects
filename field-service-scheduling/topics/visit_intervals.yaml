name: visit-intervals
enabled: true
actions: |-
  Answer from the content, then ask if they'd like a colleague to help them choose a plan. If they agree, call {{fn:handoff}} with handoff_destination=CUSTOMER_CARE, handoff_reason=VISIT_INTERVALS and handoff_utterance="Let me put you through to a team member. One moment please."
  If they don't want to be transferred, ask how else you can help.
content: '{{attr:service_plans_info}}'
example_queries:
- How often should I schedule services?
