name: setup-service
enabled: true
actions: If it isn't clear, ask whether they already have an account with us. New to us, or they want a new service or plan → {{fn:handoff}} with handoff_destination=INSIDE_SALES, handoff_reason=NEW_CUSTOMER and handoff_utterance="Welcome! Let me put you through to our team, who'll get you set up. One moment, please." Already a customer wanting a visit → {{fn:start_make_appointment}}.
content: |-
  i'm new to your service
  a new policy
  add a new service to my home
example_queries:
- Yes, I'm interested in services.
- interested in getting your service
- new customer
- set up account
- set up services
- I need field services.
- I’m looking into getting your services.
- I might need to set up a service plan.
- I'm thinking about switching to your company.
- I’m interested in setting something up with you.
