- name: return_policy_info
  values:
    Poly Store: Items can be returned within 30 days, unworn and with tags. Online orders can be returned in any store for free, or by mail through the returns portal for $6.99, taken off the refund (free for loyalty members). In-store purchases can be returned to any store. Defective items can be returned within 45 days.
- name: exchange_policy_info
  values:
    Poly Store: Exchanges are made in any store. Online orders can also be exchanged through the returns portal; the exchange arrives up to two weeks after the return reaches us, with standard shipping. If the new item is out of stock, a refund is issued instead.
- name: refund_info
  values:
    Poly Store: Returns take 5 to 6 business days to reach our returns facility, then up to 14 days to process. Card refunds then take 5 to 7 business days; Klarna takes longer. In-store returns are refunded by the store team.
- name: shipping_costs_info
  values:
    Poly Store: Standard shipping (3 to 5 business days) is $8.99, or free over $75. Express (2 business days) is $17.99 and Overnight is $27.99. Add $3 for Alaska, Hawaii and Puerto Rico. Items shipping from a store only ship within the continental US.
- name: shipping_times_info
  values:
    Poly Store: Standard shipping takes 3 to 5 business days. Express and Overnight orders ship the same day if placed by 1pm Central on a business day; later orders ship the next business day. Add a day for holidays.
- name: order_changes_info
  values:
    Poly Store: Orders can be cancelled or have their delivery address changed until they ship. Items, sizes and payment can't be changed once an order is placed; shipped orders can be returned once they arrive.
- name: instore_pickup_info
  values:
    Poly Store: Pickup orders are usually ready within 2 hours; wait for the email saying it's ready. We hold them for 10 days. Bring the confirmation email and a photo ID.
- name: loyalty_program_info
  values:
    Poly Store: PolyPerks is free to join on our website. Members get free standard shipping and free returns by mail when logged in, except on some launches.
