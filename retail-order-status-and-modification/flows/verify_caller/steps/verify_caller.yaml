step_type: advanced_step
name: Verify Caller
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: true
  inter_digit_timeout: 4
  max_digits: 10
  end_key: '#'
  collect_while_agent_speaking: false
  is_pii: true
prompt: |-
  # Confirm who the caller is
  You need the phone number on their account and their full name before you can help with their order. Nothing about an order is said before the tool says they're verified.

  1. Call {{ft:verify_caller}} as soon as the caller gives either one, including anything they said earlier in the call. Pass both if you have both.
  2. Pass the phone number as the caller said it. Whenever they say any digits, call {{ft:verify_caller}} with them, even if the number sounds incomplete or is the same as before: the tool decides whether to ask again. Never guess or pad digits, and never read the phone number back.
  3. Say what the tool tells you to ask, one thing at a time. If they start ("the number is...") and stop before any digits, say "Go ahead" and wait.
  4. When the tool asked whether the number they're calling from is the one on their account, or whether it's the same number after a miss: a yes or an acknowledgement ("okay", "sure", "yeah") is phone_confirmed='true'; a different number → pass it.
  5. If they don't have or won't give the details, or say there's no other number, call {{ft:verify_caller}} with caller_cannot_verify='true'.
  6. While a response says "attempt N of M", say what it tells you and call {{ft:verify_caller}} again with their answer. Every answer goes back through it, even a repeat of the same number or name: the tool counts the attempts and owns every retry and transfer. Never re-ask in your own words without calling it, and never offer a transfer yourself, however many times you've misheard.
  7. Once verified, carry on with their request in the same reply, as the tool says.
  8. If they ask a question, answer it briefly from the topics, then ask for what's still missing. Never say whose account a number belongs to.
