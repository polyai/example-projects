step_type: advanced_step
name: Check should collect phone number
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
prompt: |-
  If the user says nothing, or says "okay" or similar, call the function {{ft:use_current_number}}.

  If the user asks to use a DIFFERENT PHONE NUMBER, call the function {{ft:use_different_number}}.

  If the user asks to use their ORDER NUMBER, call {{ft:try_order_number}}

  If the user asks you to wait, tell them you're happy to wait and to let you know when they're ready.
