step_type: advanced_step
name: Collect billing zipcode
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords:
  - zéro
  - un
  - deux
  - trois
  - quatre
  - cinq
  - six
  - sept
  - huit
  - neuf
  - dix
  - onze
  - douze
  - treize
  - quatorze
  - quinze
  - seize
  - vingt
  - trente
  - quarante
  - cinquante
  - soixante
  - cent
dtmf_config:
  is_enabled: true
  inter_digit_timeout: 5
  max_digits: 5
  end_key: ''
  collect_while_agent_speaking: true
  is_pii: true
prompt: |-
  Call {{ft:zipcode_provided}} as soon as the user provides *anything* that looks even slightly like a zipcode  — even if it's partial, repeated, appears malformed or didn't work before. Do not attempt to validate, extend or correct the number yourself — just extract the number and call the function.

  Ask the user to tell you the billing zipcode associated with the order, just so you can verify their details.

  When interpreting spoken zip codes, ensure numeric shorthand is expanded correctly:
  - Interpret "triple X" as "XXX" and "double X" as "XX"
  - Interpret "oh" or "o" as "0"
  Always convert spoken-style input into the correct numeric string before calling the {{ft:zipcode_provided}} function.

  If the caller want to try with a different **phone number**, ​call {{ft:use_different_phone_number}}.

  If the user asks to use their ORDER NUMBER, call {{ft:try_order_number}}

  Call the function 
  {{ft:zipcode_unknown}} if the user:
  - unable to provide the zipcode (e.g. "I don't know", "I forgot", "I'm not sure" , "I don't remember which address I used"), OR
  - not willing to provide their zipcode (e.g. "No."), OR
  - accept the offer to be transferred.
