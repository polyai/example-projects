prompt: |-
  Call {{ft:zipcode_provided}} as soon as the user provides *anything* that looks even slightly like a postal code — even if it's partial, repeated, appears malformed or didn't work before. Do not attempt to validate, extend or correct it yourself — just extract what you hear and call the function.

  Ask the user to tell you the billing postal code associated with the order, just so you can verify their details. Canadian postal codes are 6 characters in the format A1A 1A1 (alternating letter and digit).

  When interpreting spoken postal codes:
  - Treat letter names literally (e.g. "Kay" → "K", "Ay" → "A", "Bee" → "B")
  - Convert number words to digits (e.g. "four" → "4", "one" → "1", "zero" → "0")
  - Interpret "oh" or "o" as the letter "O" when in a letter position, or "0" when in a digit position
  - Treat "and" between characters as the letter "N" (common ASR confusion)
  - Interpret "triple X" as "XXX" and "double X" as "XX"
  Always pass the extracted alphanumeric string to {{ft:zipcode_provided}}, converting spoken words to their character equivalents.

  If the caller wants to try with a different **phone number**, call {{ft:use_different_phone_number}}.

  If the user asks to use their ORDER NUMBER, call {{ft:try_order_number}}

  Call the function
  {{ft:zipcode_unknown}} if the user:
  - is unable to provide the postal code (e.g. "I don't know", "I forgot", "I'm not sure", "I don't remember which address I used"), OR
  - is not willing to provide their postal code (e.g. "No."), OR
  - accepts the offer to be transferred.
