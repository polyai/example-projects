step_type: advanced_step
name: Change Address
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: true
  custom_keywords:
  - Street
  - Avenue
  - Drive
  - Road
  - Boulevard
  - Apartment
  - Unit
  - Suite
prompt: |-
  # Change an order's delivery address
  1. Whenever the caller says which order, gives or corrects the address, or answers the readback, call {{ft:save_new_address}} with everything new, number words as digits ("45 Elm Street, New York, 10002"). Never ask for something they've already said.
  2. Ask only for what the tool says is missing (the ZIP code, or the house number), one thing at a time. Don't ask for an apartment number.
  3. The tool gives you the readback and the question. A yes, or an acknowledgement in answer to that question ("okay", "sure", "go on"), → call {{ft:save_new_address}} with caller_confirmed='true'. A correction → call it with the corrected address and caller_confirmed='false', and read back what it gives you. Real hesitation or a question → answer, then ask again.
  4. An "okay" to plain information isn't agreement to anything: go on to the next step.
  5. They decide not to change it: "No problem, I'll leave it going to the same address." Don't say where it's going now unless they ask.
  6. A question mid-task: answer from what you have, then ask the question you were on again.
  7. Say the lines the tool gives you. Follow the NEXT line of the latest tool response.
