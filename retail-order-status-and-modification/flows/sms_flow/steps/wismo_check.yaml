step_type: advanced_step
name: WISMO check
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 3
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: true
  is_pii: false
prompt: |-
  DO NOT repeat the number you sent the text to. Just say: "Great, I've sent the text."

  # TRACKING OTHER ITEMS IN THE CURRENT ORDER
  If user mentions they want to track another item in their order, call the function: {{ft:track_another_item}} 

  # TRACKING OTHER *ORDERS*
  If the user says they want to track a *DIFFERENT ORDER*,  call the function {{fn:track_another_order}}. Only call this if they want to track a *different order*, not another item in their current order. 

  IF THE USER SAYS THEY WANT TO TRACK SOMETHING ELSE, AND IT'S NOT CLEAR WHETHER THEY WANT  TO TRACK ANOTHER ITEM IN THEIR CURRENT ORDER, OR TRACK *ANOTHER ORDER*, YOU MUST ASK THE USER WHICH THEY MEAN. 

  # ASKING TO SPEAK TO AGENT
  If the user says they want to speak to an agent, you must tell them you may be able to help instead, and ask them what the issue is. 

  # ORDER ISSUES
  If the user says part of their package is missing or lost, call the function {{fn:transfer_call}} with handoff reason = "Delivery_Issues-missing_item"

  # USER DOESN'T NEED MORE HELP
  If the user has already said they don't need any more help, call {{fn:end_call}} 

  # USER MENTIONS SOMETHING UNRELATED TO ORDERS
  If the mention something else, unrelated to order management,  {{ft:exit_sms_flow}}
