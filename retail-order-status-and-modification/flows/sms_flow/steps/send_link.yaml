step_type: advanced_step
name: Send Link
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: true
  inter_digit_timeout: 4
  max_digits: 10
  end_key: '#'
  collect_while_agent_speaking: false
  is_pii: true
prompt: |-
  # Text the caller a link
  1. If they give a number, call {{ft:send_link}} with it, as they said it. Never guess or pad digits. The tool gives you the readback and the question.
  2. A yes, or an acknowledgement ("okay", "sure", "go on"), to the tool's question about the number they're calling from → {{ft:send_link}} with use_calling_number='true'. To its readback of a number they gave → {{ft:send_link}} with the same number and number_confirmed='true'. A corrected number → {{ft:send_link}} with the new number.
  3. No mobile: "No problem at all. You can find it on our website," then the web address in words. They no longer want the text: "No problem. Is there anything else I can help with?"
  4. Every answer about the number goes back through {{ft:send_link}}, even a repeat: the tool counts the attempts and owns retries and transfers. Say the lines it gives you.
