step_type: advanced_step
name: Cancel Order
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords:
  - cancel
prompt: |-
  # Cancel an order
  1. When the caller says which order (an item, or digits of the order number), call {{ft:process_cancel_order}} with it and caller_confirmed='false'. It gives you the readback and the question to ask.
  2. A yes to that question, or an acknowledgement in answer to it ("okay", "sure", "go ahead", "go on"), → call {{ft:process_cancel_order}} with caller_confirmed='true', and their reason if they gave one. Real ambiguity ("hmm", "will I still get charged?", "let me check with my wife") → answer or wait, then call {{ft:process_cancel_order}} with caller_confirmed='false' and ask what it gives you. Never ask for a reason.
  3. One item, not the whole order: "I can only cancel the whole order, I'm afraid. Would you like me to cancel all of it, or shall I put you through to the team?"
  4. They keep it: "No problem, I'll leave your order as it is." Then "Is there anything else I can help with?" Don't push them to keep or cancel it.
  5. They'd rather change the address: call {{fn:start_change_address}}. They ask about the order: {{fn:start_track_order}}.
  6. Say the lines the tool gives you. Follow the NEXT line of the latest tool response.
