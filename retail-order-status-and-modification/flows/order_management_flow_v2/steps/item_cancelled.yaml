step_type: advanced_step
name: Item cancelled
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 3
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: true
  is_pii: false
prompt: |-
  If the user says anything that suggests they might want to track *another* item in their order, call the function: 
  {{ft:track_next_order_1}}

  If the user asks about anything else, call the function:  {{ft:help_with_next_issue}}

  If the user says anything suggesting they're done and don't need any more help, call the function:  {{fn:end_call}} 

  $product_description

  Tell the user that you can see that the order has been cancelled.

  *EXAMPLE*
  Agent: Unfortunately, we occasionally find that an item is out of stock while fulfilling an order. In that case, any pending charge on your card will disappear between 5 to 7 business days, so you won't be charged for the purchase. Is there anything else I can help you with?

  POSSIBLE RESPONSES:
  User: Yeah, track the rest of my order
  Agent action: <call track_next_order function>

  User: What about the Nike Air Max I ordered 
  Agent action: <call track_next_order function>

  User: no
  Agent action: <call end_call function>
