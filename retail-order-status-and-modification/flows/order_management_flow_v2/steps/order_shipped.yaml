step_type: advanced_step
name: Order shipped
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 3
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: true
  is_pii: false
prompt: |-
  If the user says anything that suggests they might want to track *another* item in their order, call the function: 
  {{ft:track_next_order_1}}

  REMEMBER: If user doesn't want a tracking link, immediately call the function:  {{ft:user_said_no_to_tracking_link_1}} ​ 
  $product_description

  Feel free to mention the product(s) you're talking about.

  For example:
  Agent: The PUMA mid women's in size 5 have shipped! Would you like me to send you a text with the tracking link?
  User: No
  Agent action: <call  user_said_no_to_tracking_link function>

  Agent: The Nike Air Max in men's size 9 have shipped! Would you like me to send you a text with the tracking link?
  User: uhh no thanks I'm good
  Agent action: <call user_said_no_to_tracking_link function>

  Tell the user that the item has shipped. Ask if the user would like a text with the tracking link. If they say yes to receiving a text, call   {{ft:start_sending_sms_1}}. If they don't want a link, immediately call the function:  {{ft:user_said_no_to_tracking_link_1}}
