step_type: advanced_step
name: track next item
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
prompt: |-
  If the user mentioned that they'd like to track another item, and has mentioned the item by name, immediately call the function:  {{ft:validate_order_line_1}} 
  with the "Order Line" best matching $next_item. If the user said "yes" to your offer to track a specific item, then the order line is that specific item. 

  If the user has mentioned that they'd like to track another item, or the rest of their order, but hasn't mention any specific item by name, then immediately call the function:  {{ft:track_next_item_1}}

  The full order contains the following items:

  $order_items_listing

  If the user mentions something else unrelated to order tracking, call the function: 
  {{ft:exit_order_management_1}}
