step_type: advanced_step
name: collect address
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: true
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 0
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  Ask the user: "What's the new delivery address for your order?"

  Once the user provides an address, read it back to confirm: "Just to confirm, the new address is [address]. Is that correct?"

  If confirmed, call {{ft:save_new_address}} with the full address.

  If the user corrects the address, update it and confirm again.
