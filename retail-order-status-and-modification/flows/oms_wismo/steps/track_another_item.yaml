step_type: advanced_step
name: Track another item
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 3
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: true
  is_pii: false
prompt: |-
  IMMEDIATELY call the function:  {{ft:validate_order_line}} if the user has said they want to track another item, and mentioned that item by name. The "order_line_number" should be the one that best matches the OrderLine of $next_item.  If the user said "yes" to your offer to track a specific item, then the order line is that specific item. 

  The full order contains the following items:

  $order_items_listing

  If the user has mentioned that they'd like to track another item, or the rest of their order, but hasn't mention any specific item by name, then immediately call the function:  {{ft:track_next_item}}

  You MUST call one of the functions above if the user has suggested they want to track another item. DO NOT ASSUME ANYTHING ABOUT THE ORDER STATUS.

  If the user mentions something else unrelated to order management, call the function:  
  {{ft:exit_order_management_flow}}
