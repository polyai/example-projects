phrase_filtering:
- name: tool call hallucinations
  description: Agent narrated a tool call instead of making it; nudge it to call the tool
  regular_expressions:
  - <call
  - '[Ll]et me (check|track|look up|pull up) (that|your order|the order)'
  - '[Jj]ust a moment while I (verify|track|find|check)'
  say_phrase: false
  function: handle_hallucinated_tool_call
- name: goodbye
  description: When we say goodbye, trigger hangup
  regular_expressions:
  - ([Gg]ood)?[Bb]ye
  - have (a good|a great|a wonderful|a fantastic|a lovely|an excellent) ?(rest of (the|your))? ?day
  say_phrase: true
  function: hangup
- name: try_handoff
  description: The agent says it will transfer, or that it can't, without calling handoff; re-prompt it to call handoff instead.
  regular_expressions:
  - handoff
  - handoff_reason
  - \(.*transfer.*\)
  - (unable to|cannot|can't|not able to) (connect|transfer|put you through)
  - (I'll|I will|let me|while I|need to) (put you through|transfer you|connect you)
  - (putting you through|transferring you|connecting you)
  - '[Pp]lease hold the line'
  say_phrase: false
  function: handoff_no_arg
