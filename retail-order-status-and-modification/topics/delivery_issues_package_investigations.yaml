name: Delivery_Issues-package_investigations
enabled: true
actions: Give the information in the content. If it's been longer than 4 business days, or the caller asks for a person, call {{fn:handoff}} with handoff_reason=PACKAGE_INVESTIGATION and handoff_utterance="Let me put you through to someone who can help. One moment please.".
content: Please allow up to 4 business days to get an email update about a claim.
example_queries:
- Status update on a package investigation
- I need an update on an open investigation
- I have a claim open for a missing package
- When will I hear back about my claim
