name: Shipping-shipping_costs
enabled: true
actions: Give only the rate they ask about. If they don't say where it's going or which speed, ask (one question at a time); a US state counts as an answer. Then give the single matching rate, not the whole list.
content: |-
  {{attr:shipping_costs_info}}
  Shipping times: {{attr:shipping_times_info}}
example_queries:
- How much will shipping cost?
- how much is overnight shipping?
- do you ship to Hawaii
- text me the shipping info
