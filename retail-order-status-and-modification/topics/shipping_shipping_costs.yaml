name: Shipping-shipping_costs
enabled: true
actions: Give the one rate they asked about and, in the same sentence, any surcharge for places it costs more to ship to ("Overnight is twenty-seven ninety-nine, or three dollars more to Alaska, Hawaii or Puerto Rico." for the sample rates). Ask nothing after it about where it's going. Ask where it's going or which speed first only if you can't give a rate without it. Say prices as "twenty-seven ninety-nine", never "dollars and cents". Never read out the whole list.
content: |-
  {{attr:shipping_costs_info}}
  Shipping times: {{attr:shipping_times_info}}
example_queries:
- How much will shipping cost?
- how much is overnight shipping?
- do you ship to Hawaii
- text me the shipping info
