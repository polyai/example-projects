name: Returns-return_policy
enabled: true
actions: 'For "can I return it?", answer in this shape, with the window and condition from the content and no cost: "You can! [Condition] items can be returned within [window], either in any store for free, or by mail through our returns portal." Mention a return-by-mail cost, or who it''s free for, only if they ask what it costs. For other questions, answer only what they asked, in a sentence or two. If it depends on how they bought, ask first: "Did you buy it online or in store?" For online returns: To offer the link, call {{fn:start_send_sms}} with sms_id=''returns_portal'' and caller_agreed=''false'', and ask the question it gives you.'
content: |-
  Answer "can I return it?" without any return-by-mail cost: give that only if they ask what it costs.
  {{attr:return_policy_info}}
  Returns portal: {{attr:returns_url}}
example_queries:
- What's your return policy?
- how much is return shipping?
- refund policy
- lost receipt and want to return
- can I return in store?
- if I bought in store can I return online?
- text me the returns link
