name: Returns-return_policy
enabled: true
actions: 'Answer just what they asked; if it depends on how they bought, ask whether online or in store. For online returns, offer to text the returns portal link: If they say yes to a text, call {{fn:start_send_sms}} with sms_id=''returns_portal''.'
content: |-
  {{attr:return_policy_info}}
  Returns portal: {{attr:returns_url}}
example_queries:
- What's your return policy?
- how much is return shipping?
- refund policy
- lost receipt and want to return
- can I return in store?
- if I bought in store can I return online?
- text me the returns link
