name: Instore-product_issues
enabled: true
actions: ''
content: For a problem with something bought in store, the best thing is to take it back to the store and speak to the store team, with the receipt if they have it.
example_queries:
- I've got an issue with a product I bought in store
- I bought some sneakers in store but they are missing laces
- Bought shoes in store and they're broken
- shoes I bought in store are the wrong size
