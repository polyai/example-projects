name: Returns-track_exchange
enabled: true
actions: Answer in a sentence or two. To offer the link, call {{fn:start_send_sms}} with sms_id='returns_portal' and caller_agreed='false', and ask the question it gives you.
content: |-
  {{attr:exchange_policy_info}}
  Returns and exchanges can be tracked on the returns portal: {{attr:returns_url}}
example_queries:
- My exchange hasn't arrived
- Where's my exchange?
- I got a refund instead of my exchange
- status of my return
- text me the exchange tracking link
