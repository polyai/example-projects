actions: To cancel, call {{fn:start_cancel_order}}. To change the delivery address, call {{fn:start_change_address}}. For other changes, explain the content; if they still want help, call {{fn:handoff}} with handoff_reason=ORDER_MODIFICATION and handoff_utterance="Let me put you through to someone who can help. One moment please.".
content: '{{attr:order_changes_info}}'
