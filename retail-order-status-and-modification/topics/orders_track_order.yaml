name: Orders-track_order
enabled: true
actions: Call {{fn:start_track_order}} straight away, even if the caller is also giving details. Don't ask for an order number yourself.
content: We can look up where an order is, when it will ship or arrive, and text a tracking link.
example_queries:
- Where's my order?
- can you give me an update on my order?
- when will my order be shipping
- how long until I get my shoes
- track my order
- My package still hasn't arrived
- where are my sneakers
- can you text me a tracking link?
