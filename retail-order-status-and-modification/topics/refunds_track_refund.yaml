name: Refunds-track_refund
enabled: true
actions: If it isn't clear, ask whether they bought online or in store. For online purchases, give the timeline, then ask whether it's been more than two weeks since the latest status on the returns portal. If not, suggest they keep an eye on the portal (If they say yes to a text, call {{fn:start_send_sms}} with sms_id='returns_portal'.). If it has, call {{fn:handoff}} with handoff_reason=REFUND_DELAYED and handoff_utterance="Let me put you through to someone who can help. One moment please.".
content: |-
  {{attr:refund_info}}
  Returns can be tracked on the returns portal: {{attr:returns_url}}
example_queries:
- How long will my refund take?
- I haven't received my refund yet
- where's my refund
- returned my order but haven't got my money back
- text me the link to track my refund
