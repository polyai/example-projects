name: Refunds-track_refund
enabled: true
actions: 'If it isn''t clear, ask first: "Did you buy it online or in store?" For online, give the timeline in a sentence or two, then ask if it''s been more than two weeks since the latest status on the returns portal. If not: To offer the link, call {{fn:start_send_sms}} with sms_id=''returns_portal'' and caller_agreed=''false'', and ask the question it gives you. If it has, call {{fn:handoff}} with handoff_reason=REFUND_DELAYED and handoff_utterance="I''ll put you through to the team now. One moment, please."'
content: |-
  {{attr:refund_info}}
  Returns can be tracked on the returns portal: {{attr:returns_url}}
example_queries:
- How long will my refund take?
- I haven't received my refund yet
- where's my refund
- returned my order but haven't got my money back
- text me the link to track my refund
