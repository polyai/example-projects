name: Delivery_Issues-wrong_item_received
enabled: true
actions: Call {{fn:handoff}} with handoff_reason=WRONG_ITEM and handoff_utterance="Oh no, I'm sorry about that. I'll put you through to the team so they can sort it out. One moment, please." Don't promise a refund, a replacement or an exchange.
content: The team sorts out orders where the wrong item arrived.
example_queries:
- I received the wrong item
- My order just came and it's the wrong one
- I received sneakers in a size 9, but I ordered an 8
- I ordered an XXL but I received an XL
- you sent me the wrong colorway
