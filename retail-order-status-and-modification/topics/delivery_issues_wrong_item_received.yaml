name: Delivery_Issues-wrong_item_received
enabled: true
actions: Say you're sorry, then call {{fn:handoff}} with handoff_reason=WRONG_ITEM and handoff_utterance="Let me put you through to someone who can help. One moment please.".
content: A colleague sorts out orders where the wrong item arrived.
example_queries:
- I received the wrong item
- My order just came and it's the wrong one
- I received sneakers in a size 9, but I ordered an 8
- I ordered an XXL but I received an XL
- you sent me the wrong colorway
