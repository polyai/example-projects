name: Delivery_Issues-damaged_parcel
enabled: true
actions: Call {{fn:handoff}} with handoff_reason=DAMAGED_PARCEL and handoff_utterance="Oh no, I'm sorry about that. I'll put you through to the team so they can sort it out. One moment, please." Don't promise a refund, a replacement or a redelivery.
content: The team handles damaged or defective items from online orders.
example_queries:
- My order arrived but the box is ripped open
- My package arrived damaged
- I just got my parcel and it's damaged
- order came with a sensor tag
- defective item received
- my order is defective
