name: Discount_Codes-not_working
enabled: true
actions: Ask about the three reasons one at a time, as a question each, and wait for the answer. If one explains it, say that may be why. To offer the link, call {{fn:start_send_sms}} with sms_id='promotions' and caller_agreed='false', and ask the question it gives you. If none explains it, ask "Would you like me to put you through to the team?" and on a yes call {{fn:handoff}} with handoff_reason=DISCOUNT_CODE and handoff_utterance="I'll put you through to the team now. One moment, please." Never mention specific discounts.
content: |-
  Three common reasons a discount code doesn't work:
  1. The item is excluded from discounts: there's a note under the "add to cart" button on the product page.
  2. The code has already been used; most codes work once.
  3. The code has expired.
example_queries:
- Why is my discount code not working?
- my promo code won't apply
- coupon code isn't valid
- text me the promo link
