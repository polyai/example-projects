name: Discount_Codes-not_working
enabled: true
actions: Go through the three reasons one at a time, as a question each, and wait for the answer. If one explains it, say that may be why, and mention our current offers are at {{attr:promotions_url}}; If they say yes to a text, call {{fn:start_send_sms}} with sms_id='promotions'. If none of them explains it, ask if they'd like to speak to someone; if yes, call {{fn:handoff}} with handoff_reason=DISCOUNT_CODE and handoff_utterance="Let me put you through to someone who can help. One moment please.". Never mention specific discounts (student, veteran and so on).
content: |-
  Three common reasons a discount code doesn't work:
  1. The item is excluded from discounts: there's a note under the "add to cart" button on the product page.
  2. The code has already been used; most codes work once.
  3. The code has expired.
example_queries:
- Why is my discount code not working?
- my promo code won't apply
- coupon code isn't valid
- text me the promo link
