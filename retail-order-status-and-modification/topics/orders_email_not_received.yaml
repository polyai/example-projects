name: Orders-email_not_received
enabled: true
actions: Ask if they've checked those folders, and offer to wait while they look. If they still can't find it, call {{fn:handoff}} with handoff_reason=EMAIL_NOT_RECEIVED and handoff_utterance="Let me put you through to someone who can help. One moment please.". If they just want to know the order status, call {{fn:start_track_order}}.
content: Order emails sometimes end up in the spam, junk or promotions folder.
example_queries:
- I didn't get an email confirmation for my order
- Can you resend my confirmation? I never got one
