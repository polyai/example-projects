name: Orders-email_not_received
enabled: true
actions: Ask if they've checked their spam, junk or promotions folders, and offer to wait while they look. If it's still not there, call {{fn:handoff}} with handoff_reason=EMAIL_NOT_RECEIVED and handoff_utterance="I'll put you through to the team now. One moment, please." If they just want the order's status, call {{fn:start_track_order}}.
content: Order emails sometimes end up in the spam, junk or promotions folder.
example_queries:
- I didn't get an email confirmation for my order
- Can you resend my confirmation? I never got one
