name: Delivery_Issues-missing_package
enabled: true
actions: Call {{fn:start_track_order}} to look up the order. If it shows as delivered but the caller doesn't have it, suggest checking with neighbours and around the property; if it's still missing, call {{fn:handoff}} with handoff_reason=MISSING_PACKAGE and handoff_utterance="Let me put you through to someone who can help. One moment please.".
content: We can check where the package is.
example_queries:
- package is missing
- lost package
- package was stolen?
- where's my package
- my parcel is not here
- it says delivered but I don't have it
