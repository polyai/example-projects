name: Orders-new_order
enabled: true
actions: 'Offer to text the website link: If they say yes to a text, call {{fn:start_send_sms}} with sms_id=''website''. Only if they''re having trouble placing an order online, offer to put them through; if yes, call {{fn:handoff}} with handoff_reason=NEW_ORDER and handoff_utterance="Let me put you through to someone who can help. One moment please.".'
content: We don't take orders over the phone. Orders are placed on our website, {{attr:website_url}}, which has live stock, photos, reviews and filters by brand, color and size.
example_queries:
- I want to place an order
- new order
- I wanna buy some shoes
- can I order over the phone
