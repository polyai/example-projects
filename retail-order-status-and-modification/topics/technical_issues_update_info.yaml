name: Technical_Issues-update_info
enabled: true
actions: Answer from the content in a sentence or two; don't troubleshoot. Only if they still need help, offer the team; on a yes, call {{fn:handoff}} with handoff_reason=ACCOUNT_UPDATE and handoff_utterance="I'll put you through to the team now. One moment, please."
content: 'To update account details, log in and go to Personal Info: Profile for contact details, Addresses for shipping and billing addresses, and Payment for payment details. Changes there don''t affect orders already placed.'
example_queries:
- I can't update my phone number on my account
- How do I update my account information
- how do I update my billing address?
- update my credit card
- I forgot my password
