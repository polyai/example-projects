name: Delivery_Issues-missing_item
enabled: true
actions: Call {{fn:start_track_order}} with the item they mention, to look up the order. If the missing item hasn't shipped yet, say when it's coming. If everything shows delivered, call {{fn:handoff}} with handoff_reason=MISSING_ITEM and handoff_utterance="I'm sorry about that. I'll put you through to the team so they can look into it. One moment, please."
content: We can check what was shipped in the order and when.
example_queries:
- Some of my order is missing
- I just received my order and some of the things are missing
- My order is missing items
- i ordered 7 hoodies and only received 6
- i didn't get all of my order
