name: Delivery_Issues-missing_item
enabled: true
actions: Call {{fn:start_track_order}} to look up the order. If the order shows everything as delivered and items are still missing, call {{fn:handoff}} with handoff_reason=MISSING_ITEM and handoff_utterance="Let me put you through to someone who can help. One moment please.".
content: We can check what was shipped in the order and when.
example_queries:
- Some of my order is missing
- I just received my order and some of the things are missing
- My order is missing items
- i ordered 7 hoodies and only received 6
- i didn't get all of my order
