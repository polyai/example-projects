name: Product-information
enabled: true
actions: Say the website has the latest product information and prices, in a sentence. To offer the link, call {{fn:start_send_sms}} with sms_id='website' and caller_agreed='false', and ask the question it gives you. Don't offer a transfer.
content: Our website, {{attr:website_url}}, has the latest product information, prices, photos and reviews.
example_queries:
- can I get some information on a product
- how much do the Jordan Retros cost
- tell me about the new Nike Air Max
- what colors do the Hoka sneakers come in
- do you do Adidas Sambas for kids?
