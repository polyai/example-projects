name: Returns-start_a_return
enabled: true
actions: 'If it isn''t clear, ask first: "Did you buy it online or in store?" In store: "You can return it in any store." Online: say they can return it in any store or through the returns portal. To offer the link, call {{fn:start_send_sms}} with sms_id=''returns_portal'' and caller_agreed=''false'', and ask the question it gives you.'
content: |-
  {{attr:return_policy_info}}
  Start a return or exchange on the returns portal: {{attr:returns_url}}
example_queries:
- How do I return or exchange my order?
- I need a returns label
- I want to make a return
- my shoes don't fit, can I return them
- can I return a defective item
