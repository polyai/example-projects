name: Returns-start_a_return
enabled: true
actions: |-
  First, ask the user whether they purchased the item online or in store — the return process is different for each.

  If the user purchased the item ONLINE: provide the returns portal information from the content. If they say yes to receiving a text message, call {{fn:send_sms_message}} with sms_id="Returns-start_a_return".

  If the user purchased the item IN STORE: tell the user: {{attr:instore_return_policy}}.
content: |-
  # If purchased online:
  You can return your items either in store, or online, using our returns portal at {{attr:returns_url}}. Do you want me to text you the link?

  # If purchased in store:
  {{attr:instore_return_policy}}

  IMPORTANT: If the user is returning a defective item, you MUST tell them that defective returns must be made within 45 days of purchase, in addition to the standard return options.
example_queries:
  - How do I return/exchange my parcel?
  - I need a returns label
  - I want to make a return
  - I ordered my shoes too big can i get another size
  - my shoes don't fit can I return them
  - can i return a defective item
  - shoes are falling apart can i return?
  - return TEST
  - can you text me the return link?
