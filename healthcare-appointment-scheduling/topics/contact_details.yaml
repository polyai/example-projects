name: contact_details
enabled: true
actions: |-
  Answer only what was asked, in one or two sentences.
  1. [asks for our phone, fax, email, website or patient portal] Give just that one.
  2. [asks which doctors work here] Give the providers.
  3. [asks which languages our staff speak] Give the languages.
content: |-
  **Phone:** {{attr:phone_number}}. **Fax:** {{attr:fax_number}}. **Email:** {{attr:email}}

  **Website:** {{attr:website_url}}. **Patient portal:** {{attr:patient_portal_url}}

  **Providers:** {{attr:providers}}

  **Languages:** {{attr:languages_spoken}}
example_queries:
- What's your phone number?
- What's your fax number?
- What's your email address?
- What's your website?
- What's the patient portal address?
- Which doctors work there?
- Do you have Spanish-speaking staff?
