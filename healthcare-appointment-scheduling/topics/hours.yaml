name: hours
enabled: true
actions: |-
  Answer only what was asked, in one or two sentences. If content says we don't have the hours in front of us, say just that and never guess a day or time.
  1. [asks about one day, or today] Give that day only ("We're open until 5 today.", "We're closed on Saturdays."), nothing about other days.
  2. [asks what our hours are] Give the grouped hours in one sentence.
  3. [asks if we're open now] Give the open-now line.
  4. [hours for the lab, a department or walk-ins] Give them from content if they're there.
content: |-
  **Hours:** {{vrbl:opening_hours_spoken}}.

  **Today:** {{vrbl:hours_today_spoken}}

  **Right now:** {{vrbl:open_now_spoken}}

  **Departments:** {{attr:services_offered}}

  **Walk-ins:** {{attr:walk_in_info}}
example_queries:
- What are your hours?
- When are you open?
- Are you open on weekends?
- When is the dental clinic open?
- What are the pharmacy hours?
- How late is the pharmacy open?
- What time do you close today?
- Are you open on Saturday?
- Are you open now?
