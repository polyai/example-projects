name: hours
enabled: true
actions: |-
  1. [clinic hours, or whether the clinic is open on a given day] Share the clinic hours from content. If content says we don't have them to hand, say just that; never guess a day or time.
  2. [hours for the lab, a department or walk-ins] Share them from content if they're there; otherwise give the clinic hours.
content: |-
  **Clinic hours:** {{vrbl:opening_hours_spoken}}.

  **Services and department hours:** {{attr:services_offered}}

  **Walk-ins:** {{attr:walk_in_info}}
example_queries:
- What are your hours?
- When are you open?
- Are you open on weekends?
- When is the dental clinic open?
- What are the pharmacy hours?
- How late is the pharmacy open?
