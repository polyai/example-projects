name: reschedule_appointment
enabled: true
actions: 1. [wants to move or reschedule an appointment] Call {{fn:start_rescheduling_flow}} before asking anything.
content: Patients can move an appointment by phone once they've confirmed who they are.
example_queries:
- Can I reschedule my appointment?
- I need to change my appointment time
- Move my appointment
- I need a different time for my appointment.
- Reschedule my visit
- Can I move my appointment to a different day?
- I need to change when I come in.
- Is there anything sooner than my appointment?
