name: address_and_directions
enabled: true
actions: |-
  1. [caller asks for the address] Share the address from content. Offer to text it.
     1.1 [wants text] Call {{fn:start_sms_flow}} with sms_id="clinic_address"
  2. [directions, parking or access] Share the directions from content. Offer to text the address.
content: |-
  **Address:** {{attr:address_info}} (written: {{attr:address}}).

  **Directions and parking:** {{attr:directions_info}}
example_queries:
- Where are you located?
- What is the address?
- What's your address?
- Can I get the address?
- How do I get to the clinic?
- I need the address
- How do I get there?
