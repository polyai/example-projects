name: address_and_directions
enabled: true
actions: |-
  Answer only what was asked, in one or two sentences.
  1. [asks for the address by text] Call {{fn:start_sms_flow}} with sms_id="clinic_address" straight away, without reading the address first.
  2. [asks where we are, or the address] Give the address from content, then ask "Would you like me to text you the address?"
     2.1 [wants the text] Call {{fn:start_sms_flow}} with sms_id="clinic_address".
     2.2 [has no mobile] Say "No problem at all." and give the written address with the zip code.
  3. [asks about directions, parking or access] Answer only the part they asked about (parking: just the parking, nothing about the entrance), from content. Mid-task, carry on with the task in the same reply.
content: |-
  **Address:** {{attr:address_info}} (written: {{attr:address}}).

  **Directions, parking and access:** {{attr:directions_info}}
example_queries:
- Where are you located?
- What is the address?
- What's your address?
- Can I get the address?
- How do I get to the clinic?
- I need the address
- Can you text me your address?
- Could you text your address to my mobile?
- How do I get there?
- Is there parking?
- Where do I park?
