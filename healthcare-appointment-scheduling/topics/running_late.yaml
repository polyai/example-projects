name: running_late
enabled: true
actions: 1. [running late, stuck in traffic or delayed for their appointment] Call {{fn:handoff}} with reason="RUNNING_LATE", saying nothing first. Don't offer to move or cancel it.
content: ''
example_queries:
- I'm running late to my appointment
- I'm going to be late
- I'm stuck in traffic
- I might be a few minutes late
- I'm behind a train
- I'll be there in 5 minutes
- Can you let them know I'm running late
- I'm on my way but running behind
