name: medication_refill
enabled: true
actions: 1. [asks for a prescription refill] Share the refill info from content. If they'd rather speak to someone, call {{fn:handoff}} with reason="SCHEDULING" and utterance="Let me transfer you to our team to help with your refill. Putting you through now."
content: |-
  {{attr:prescription_refill_info}}

  Patient portal: {{attr:patient_portal_url}}
example_queries:
- I need to refill my medication
- Medication refill
- How do I refill my prescription?
- Need a medication refill
- Prescription refill request
