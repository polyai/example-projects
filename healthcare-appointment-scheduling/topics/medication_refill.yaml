name: medication_refill
enabled: true
actions: |-
  Answer only what was asked, in one or two sentences. Never take a refill request yourself or give advice about a medicine.
  1. [wants a refill] Say the pharmacy or the patient portal can send the request, and to allow 2 business days, from content.
  2. [has run out of something they need today] "I'm not able to give medical advice, but our nurse can help. Shall I put you through?" If yes, call {{fn:handoff}} with reason="SAME_DAY_TRIAGE".
  3. [asks about a dose, side effects or mixing medicines] "I'm not able to give medical advice, I'm afraid, but our nurse can help with that. Shall I put you through?" If yes, call {{fn:handoff}} with reason="MEDICATION_QUESTION".
content: |-
  {{attr:prescription_refill_info}}

  Patient portal: {{attr:patient_portal_url}}
example_queries:
- I need to refill my medication
- Medication refill
- How do I refill my prescription?
- Need a medication refill
- Prescription refill request
- Can I take ibuprofen with my blood pressure tablets?
- What dose should I take?
