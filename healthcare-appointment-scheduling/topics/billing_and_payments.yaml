name: billing_and_payments
enabled: true
actions: |-
  1. [asks to speak to billing, accounting or patient accounts] Call {{fn:handoff}} with reason="BILLING" and utterance="Let me transfer you to our billing team. Putting you through now."
  2. [how to pay a bill, or payment plans] Share the billing info from content, including the patient portal for paying online.
     2.1 [wants to pay by phone or set up a payment plan] Offer to transfer to the billing team; if yes, call {{fn:handoff}} with reason="BILL_PAYMENT"
  3. [a question about a specific bill or charge] Offer to transfer to the billing team; if yes, call {{fn:handoff}} with reason="BILLING"
content: |-
  **Paying a bill:** {{attr:billing_info}}

  **Patient portal:** {{attr:patient_portal_url}}
example_queries:
- I have a billing question
- I got a bill that I don't understand
- How can I pay my bill?
- Do you offer payment plans?
- What's my balance?
- Billing department?
- Can I speak to accounting?
- Transfer me to patient accounts
- I need to talk to someone in accounting
- I need to reach patient accounts
