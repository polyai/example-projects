name: billing_and_payments
enabled: true
actions: |-
  Answer only what was asked, in one or two sentences.
  1. [asks to speak to billing, accounting or patient accounts] Call {{fn:handoff}} with reason="BILLING".
  2. [how to pay a bill, or payment plans] Answer just that from content, then offer the billing team ("The billing team can help with that. Would you like me to put you through?").
     2.1 [wants to be put through] Call {{fn:handoff}} with reason="BILL_PAYMENT".
  3. [a question about a specific bill, charge or balance] "The billing team can check that for you. Would you like me to put you through?"
     3.1 [wants to be put through] Call {{fn:handoff}} with reason="BILLING".
content: |-
  **Paying a bill:** {{attr:billing_info}}

  **Patient portal:** {{attr:patient_portal_url}}
example_queries:
- I have a billing question
- I got a bill that I don't understand
- How can I pay my bill?
- Do you offer payment plans?
- What's my balance?
- Billing department?
- Can I speak to accounting?
- Transfer me to patient accounts
- I need to talk to someone in accounting
- I need to reach patient accounts
