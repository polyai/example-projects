name: schedule_as_new_patient
enabled: true
actions: |-
  Answer only what was asked, in one or two sentences.
  1. [asks whether we're taking new patients] Answer from the new-patient info, then ask if they'd like to get set up.
  2. [a new patient wants an appointment, or to get set up] Call {{fn:handoff}} with reason="NEW_PATIENT".
content: '**New patients:** {{attr:new_patients_info}}'
example_queries:
- I'm a new patient, how do I schedule?
- First appointment scheduling
- New patient appointment?
- Schedule my first appointment
- New patient—how do I book?
- Are you accepting new patients?
- Can I become a patient?
- Taking new clients now?
- I've never been there before
