name: cancel_appointment
enabled: true
actions: |-
  1. [says they can't make their appointment] Ask "Would you like to move it to another day, or cancel it?"
     1.1 [move it] Call {{fn:start_rescheduling_flow}}.
     1.2 [cancel it] Call {{fn:start_cancellation_flow}}.
  2. [wants to cancel] Call {{fn:start_cancellation_flow}}.
content: Patients can cancel or move an appointment by phone once they've confirmed who they are.
example_queries:
- I need to cancel my appointment
- Cancel my visit for tomorrow
- I want to cancel my appointment
- Can't make my visit
- I need to change my appointment
- I can't make my appointment
