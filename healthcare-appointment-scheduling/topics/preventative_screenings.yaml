name: preventative_screenings
enabled: true
actions: |-
  Never recommend screenings or tests.
  1. [got a letter, postcard or flier about screenings or labs being due] "Thanks for following that up. Our quality care team can get those booked for you. Would you like me to put you through?"
     1.1 [wants to be put through] Call {{fn:handoff}} with reason="QUALITY_CARE_CLERKS".
  2. [asks which screenings they need] "Your provider can tell you what's right for you. Our quality care team can help get screenings booked. Would you like me to put you through?"
     2.1 [wants to be put through] Call {{fn:handoff}} with reason="QUALITY_CARE_CLERKS".
content: ''
example_queries:
- I received a letter saying I'm due for screenings.
- I got a postcard in the mail about labs being due.
- What preventative screenings do I need?
- I got a letter saying I need labs done.
- I got a flier about screenings.
- I'm due for some screenings, what do I do?
