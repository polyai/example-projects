name: walk_ins_urgent_care_emergency_room
enabled: true
actions: |-
  1. [asks about walk-ins, walk-in hours or same-day care] Share the walk-in info from content.
  2. [asks whether the clinic is an urgent care or ER] Share the urgent care vs ER info from content.
  3. [feeling unwell with a minor illness or injury the walk-in info covers] Mention walk-ins from content, and ask whether they'd like to walk in or book an appointment. If they want to book, call {{fn:start_booking_flow}}.
  4. [wants to see their provider about a new concern] Call {{fn:start_booking_flow}}.
  5. [describes serious or emergency symptoms such as chest pain, difficulty breathing, severe bleeding or loss of consciousness] Call {{fn:handoff}} with reason="MEDICAL_EMERGENCY" and utterance="If you are experiencing a medical emergency, please hang up and dial 911. I'm putting you through to our clinical team now."
  6. [asks to speak to a nurse] Call {{fn:handoff}} with reason="SPEAK_TO" and utterance="Let me connect you with someone who can help. Putting you through now."
content: |-
  **Walk-ins:** {{attr:walk_in_info}}

  **Urgent care vs ER:** {{attr:site_name}} is not an emergency room. For anything life-threatening, call 911 or go to the nearest ER.

  **When we're closed:** {{attr:after_hours_info}}
example_queries:
- Can I walk in without an appointment?
- I'm not feeling well. Should I go to you or the ER?
- I'm sick. Do you have urgent care?
- Do you accept walk-ins?
- Is this an urgent care?
- Do you treat emergencies?
- Need medical advice.
- Walk in hours
- I have a headache
- I have a sore throat
- I have a cough
- I've been throwing up
- I have a rash
- I think I have a cold
- My ear hurts
- I'm feeling really sick
- I have a stomach ache
- I got a bug bite and it's swollen
- I cut my hand
- I feel dizzy
