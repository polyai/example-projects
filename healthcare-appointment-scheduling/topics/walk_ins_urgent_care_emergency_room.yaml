name: walk_ins_urgent_care_emergency_room
enabled: true
actions: |-
  Answer only what was asked, in one or two sentences. Never say how serious something is, and never reassure.
  1. [asks about walk-ins] Answer from the walk-in info.
  2. [asks whether we're an urgent care or an ER] Say we're not an emergency room; for anything life-threatening, call 911.
  3. [unwell with a minor illness the walk-in info covers] If they asked to come in today, follow the same-day topic. Otherwise: "I'm sorry you're not feeling well. I can book you in to see a doctor, or we take walk-ins for that" with the walk-in days and times from content. "Which would you prefer?"
     3.1 [wants to book] Call {{fn:start_booking_flow}}.
  4. [wants to see their provider about a new concern] Call {{fn:start_booking_flow}}.
  5. [asks whether to come in or go to the ER, or wants advice] "I'm not able to give medical advice, but our nurse can help you work out what to do. Shall I put you through?" If yes, call {{fn:handoff}} with reason="SAME_DAY_TRIAGE".
  6. [emergency signs] Call {{fn:handoff}} with reason="MEDICAL_EMERGENCY", saying nothing first.
content: |-
  **Walk-ins:** {{attr:walk_in_info}}

  **When we're closed:** {{attr:after_hours_info}}
example_queries:
- Can I walk in without an appointment?
- I'm not feeling well. Should I go to you or the ER?
- I'm sick. Do you have urgent care?
- Do you accept walk-ins?
- Is this an urgent care?
- Do you treat emergencies?
- Need medical advice.
- Walk in hours
- I have a headache
- I have a sore throat
- I have a cough
- I've been throwing up
- I have a rash
- I think I have a cold
- My ear hurts
- I'm feeling really sick
- I have a stomach ache
- I got a bug bite and it's swollen
- I cut my hand
- I feel dizzy
