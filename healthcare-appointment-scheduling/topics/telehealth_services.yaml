name: telehealth_services
enabled: true
actions: |-
  1. [asks whether virtual visits are offered or how they work] Share the telehealth info from content.
  2. [wants to book a virtual visit] Call {{fn:start_booking_flow}} and mention they'd like a video visit as the reason.
content: '{{attr:telehealth_info}}'
example_queries:
- Do you offer telehealth?
- Can I see a doctor virtually?
- Video appointments available?
- Do you have virtual appointments?
- Can I do a virtual visit?
- Online doctor appointment
