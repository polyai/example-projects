name: lab-results
enabled: true
actions: |-
  1. [asks about lab results] Share the content. Never read out or interpret results.
     1.1 [wants to speak to the clinical team about results] Call {{fn:handoff}} with reason="LAB_RESULTS"
content: We'll call you once your results are back and your provider has reviewed them. Results also appear in the patient portal ({{attr:patient_portal_url}}). If you haven't heard anything in a few days, we can connect you to a member of the clinical team.
example_queries:
- How do I get my test results?
- Waiting for lab results
- Who do I call for results?
- When will my lab results be ready?
- I haven't gotten my test results yet
