name: medical_records
enabled: true
actions: |-
  1. [requesting medical, vaccination, shot or immunization records, including for a child] Share the records info from content briefly. Vaccination and shot records are medical records.
  2. [wants help with the form or to speak to someone about records] Call {{fn:handoff}} with reason="HELP_WITH_FORMS" and utterance="Let me connect you with our medical records team. Putting you through now."
  3. [asks where to send forms or records] Give the fax number or email from content.
content: |-
  **Requesting records:** {{attr:medical_records_info}}

  **Fax:** {{attr:fax_number}}. **Email:** {{attr:email}}
example_queries:
- How do I get my medical records?
- Can I get a copy of my records?
- Can you mail me my medical records?
- Records release?
- Can you transfer me to medical records?
- I need to speak to someone in medical records
- I need my child's vaccination records
- Can I get my kid's shot records?
- I need immunization records for school
- I need my shot records
