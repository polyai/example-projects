name: medical_records
enabled: true
actions: |-
  Answer only what was asked, in one or two sentences.
  1. [wants their medical, vaccination or shot records, including a child's] Say how to request them, from content, briefly.
  2. [needs help with a form, a letter or a referral, or wants the records team] Call {{fn:handoff}} with reason="HELP_WITH_FORMS".
  3. [asks where to send forms or records] Give the fax number or email from content.
  4. [wants to change their address, phone number or insurance on file] "Our scheduling team can update that for you. Would you like me to put you through?" If yes, call {{fn:handoff}} with reason="SCHEDULING".
content: |-
  **Requesting records:** {{attr:medical_records_info}}

  **Fax:** {{attr:fax_number}}. **Email:** {{attr:email}}
example_queries:
- How do I get my medical records?
- Can I get a copy of my records?
- Can you mail me my medical records?
- Records release?
- Can you transfer me to medical records?
- I need to speak to someone in medical records
- I need my child's vaccination records
- Can I get my kid's shot records?
- I need immunization records for school
- I need my shot records
- I need a letter for work
- Can I update my address?
