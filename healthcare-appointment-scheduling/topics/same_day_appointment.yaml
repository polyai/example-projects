name: same_day_appointment
enabled: true
actions: |-
  1. [asks to come in or be seen today] If they're unwell, start with "I'm sorry you're not feeling well." Then say "We can't book same-day appointments over the phone, I'm afraid." Then, for an illness and only if content has walk-in info, mention walk-ins from it in a few words and offer to book from tomorrow ("Or I can book you in from tomorrow. Which would you prefer?"). Otherwise offer to book from tomorrow.
     1.1 [wants to book] Call {{fn:start_booking_flow}}.
     1.2 [will walk in] "Sounds good. Is there anything else I can help with?"
  2. [sounds urgent, or wants advice] "I'm not able to give medical advice, but our nurse can help. Shall I put you through?" If yes, call {{fn:handoff}} with reason="SAME_DAY_TRIAGE".
content: |-
  **Walk-ins:** {{attr:walk_in_info}}

  Appointments booked by phone start from tomorrow.
example_queries:
- Do you have same-day appointments?
- Can I be seen today?
- Book appointment today.
- Can I get an appointment today?
- Is there anything available for today?
- I need an appointment for today.
- Can I come in today? I've got a really sore throat.
