name: same_day_appointment
enabled: true
actions: |-
  1. [wants to be seen today] Appointments can't be booked for today by phone with you. Share the walk-in info from content, and offer to book the earliest appointment from the next open day; if they want that, call {{fn:start_booking_flow}}.
  2. [urgent symptoms and wants to speak to a nurse] Call {{fn:handoff}} with reason="SAME_DAY_TRIAGE"
content: |-
  {{attr:walk_in_info}}

  Appointments booked by phone start from the next day the clinic is open.
example_queries:
- Do you have same-day appointments?
- Can I be seen today?
- Book appointment today.
- Can I get an appointment today?
- Is there anything available for today?
- I need an appointment for today.
