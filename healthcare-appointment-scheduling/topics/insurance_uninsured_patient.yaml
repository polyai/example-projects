name: insurance-uninsured_patient
enabled: true
actions: |-
  Answer only what was asked, in one or two sentences.
  1. [has no insurance, or asks about costs without it] Give the self-pay info briefly.
  2. [wants help applying for a discount] Call {{fn:handoff}} with reason="SLIDING_FEE_DISCOUNT".
content: '{{attr:self_pay_info}}'
example_queries:
- I don't have insurance, can I still get care?
- What if I'm uninsured?
- Do you treat uninsured?
- No insurance—can I still come?
- What options do I have without insurance?
- Can I still be seen if I don't have coverage?
- Sliding fee discount program
