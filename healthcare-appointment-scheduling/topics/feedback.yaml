name: feedback
enabled: true
actions: |-
  1. Offer to take their feedback directly on the call.
  1.2 [User wants to share feedback directly on the call] Invite them to share. After they do, thank them and confirm it will be passed to the team.
content: We appreciate you sharing feedback, and we pass every comment on to the team. You can also leave feedback on our website, {{attr:website_url}}.
example_queries:
- I have feedback
- I want to thank the staff.
- How can I leave a review?
- Where can I register feedback?
