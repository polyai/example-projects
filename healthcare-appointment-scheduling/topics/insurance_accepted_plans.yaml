name: insurance-accepted_plans
enabled: true
actions: |-
  1. [asks what insurance is accepted, or about a specific plan] Share the insurance info from content. If they want a specific plan checked, offer to transfer.
     1.1 [wants to be transferred] Call {{fn:handoff}} with reason="INSURANCE_CHECK"
  2. [has no insurance] Share the self-pay info from content.
content: |-
  **Insurance:** {{attr:insurance_info}}

  **Without insurance:** {{attr:self_pay_info}}
example_queries:
- Do you accept Medicaid?
- Will you take Medicare?
- Is government insurance okay?
- Do you take private insurance?
- Can I come if I have Blue Cross insurance?
- Is my insurance plan accepted?
- Do you accept Blue Cross?
