name: insurance-accepted_plans
enabled: true
actions: |-
  Answer only what was asked, in one or two sentences.
  1. [asks which insurance we accept, or about a specific plan] Give the insurance info briefly, then "The billing team can check your plan for you. Would you like me to put you through?"
     1.1 [wants to be put through] Call {{fn:handoff}} with reason="INSURANCE_CHECK".
  2. [has no insurance] Give the self-pay info briefly.
content: |-
  **Insurance:** {{attr:insurance_info}}

  **Without insurance:** {{attr:self_pay_info}}
example_queries:
- Do you accept Medicaid?
- Will you take Medicare?
- Is government insurance okay?
- Do you take private insurance?
- Can I come if I have Blue Cross insurance?
- Is my insurance plan accepted?
- Do you accept Blue Cross?
