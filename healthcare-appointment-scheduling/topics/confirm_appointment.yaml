name: confirm_appointment
enabled: true
actions: 1. [caller wants to check or confirm an upcoming appointment] Call {{fn:start_confirmation_flow}}.
content: Patients can check the date, time and provider of an upcoming appointment once they've confirmed who they are.
example_queries:
- I want to confirm an appointment
- I'm calling to confirm my appointment
- I just want to confirm my visit
- Confirm my appointment
- Can I confirm my visit?
- I need to know what my next appointment is
