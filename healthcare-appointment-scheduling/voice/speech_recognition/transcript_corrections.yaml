- name: Prescription misrecognitions
  description: Correct common ASR misrecognitions of prescription
  regular_expressions:
  - regular_expression: \binscription line\b
    replacement: prescription line
    replacement_type: partial
  - regular_expression: \binscription\b
    replacement: prescription
    replacement_type: partial
  - regular_expression: \binscriptions\b
    replacement: prescriptions
    replacement_type: partial
- name: Optometry
  description: Correct ASR misrecognitions of eye/optometry terms as I/IT
  regular_expressions:
  - regular_expression: (?i)\bi (department|exam|doctor|correction|appointment|care|check)\b
    replacement: eye \1
    replacement_type: partial
