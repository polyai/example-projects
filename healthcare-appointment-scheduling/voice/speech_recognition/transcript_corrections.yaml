corrections:
- name: Dr R. Chang
  description: Prevent parsing Dr R. Chang as 2 sentences
  regular_expressions:
  - regular_expression: Dr R. Chang
    replacement: Dr R Chang
    replacement_type: partial
  - regular_expression: R. Chang
    replacement: R Chang
    replacement_type: partial
  - regular_expression: Dr. Chang
    replacement: Dr Chang
    replacement_type: partial
