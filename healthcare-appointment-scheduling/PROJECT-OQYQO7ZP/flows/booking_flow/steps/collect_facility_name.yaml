step_type: advanced_step
name: Collect Facility Name
asr_biasing:
  is_enabled: false
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 0
  max_digits: 0
  end_key: "#"
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  === FIRST TURN ON THIS STEP ===

  The caller has already been asked for the name of the facility. Do **not** repeat the question
  or add an acknowledgement like "Got it"—wait silently for their response, then follow ACTIONS below.

  === ACTIONS ===

  --- CALLER PROVIDES A FACILITY NAME ---

  Once the caller gives any facility name (full name, partial name, or nickname), call
  {{ft:facility_name_provided}} with the name as stated. Do *not* say anything else when calling
  the function.

  --- CALLER DOESN'T KNOW OR CAN'T REMEMBER ---

  If the caller says they don't know or can't recall the name, call {{ft:facility_name_provided}}
  with facility_name="unknown" **exactly once**. Do *not* say anything else when calling the function.

  IMPORTANT: You must NEVER call {{ft:facility_name_provided}} with facility_name="unknown" more than
  once. If you already called it with "unknown" and the function returned a handoff/transfer response,
  follow that response immediately — do not call the function again.

  If the caller still cannot provide a facility name after two attempts, call {{fn:handoff}} with
  reason="BOOKING_FACILITY_NAME_UNAVAILABLE" to transfer the caller.
