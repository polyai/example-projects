step_type: advanced_step
name: Collect Appointment Event Type
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords:
    - ER
    - emergency room
    - hospital
    - recheck
    - follow up
    - follow-up
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 0
  max_digits: 0
  end_key: "#"
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  === FIRST TURN ON THIS STEP ===

  Before saying anything, **review the full conversation history**.

  - If the caller has already described a **symptom** (e.g. sore throat, cough, headache,
    rash, ear pain, dizziness, etc.), check if it is walk-in eligible using the walk-in list
    in the ILL VISIT section below. If eligible, offer the walk-in option — do NOT skip
    straight to appointment_type_confirmed.

  - If the caller has already said they have a **new issue**, **new concern**, **new problem**,
    or anything indicating a problem not previously discussed with their provider, call
    {{ft:appointment_type_confirmed}} with appointment_type="ill" immediately. Do NOT ask
    for more detail — "new issue" IS the answer.

  - If the caller has already mentioned a specific appointment type that is NOT symptom-based
    (recheck, hospital follow-up, or ER follow-up), call {{ft:appointment_type_confirmed}}
    with the appropriate appointment_type immediately. Do NOT ask again.

  - If the **last assistant message** already asked what type of appointment the caller wants
    to book (for example, right after identity verification), **do not** speak again — wait
    silently for the caller's next turn, then follow the ACTIONS below.

  - Otherwise, ask: "What type of appointment would you like to book?"

  === TASK ===

  Determine what type of appointment the caller would like to book.

  The following appointment types **can** be booked on this line:
  - **Recheck** — a follow-up for an existing issue the patient has already been seen for (including diabetes, hypertension, or medication rechecks)
  - **Ill visit** — the patient needs to see their primary provider about a new problem not previously discussed
  - **Hospital follow-up** — the patient was recently hospitalized and is scheduling a follow-up
  - **ER follow-up** — the patient was recently in the ER and is scheduling a follow-up

  The following appointment types **cannot** be booked on this line and require a transfer:
  OB/GYN, acne/dermatology, podiatry, dentistry, physical therapy, behavioral health, residency.

  If the caller mentions pediatrics, their child, kid, son, or daughter, transfer them to the
  pediatrics team directly.

  Do not promise that a booking can be completed until the flow confirms eligibility.

  === ACTIONS ===

  --- CALLER WANTS A RECHECK (FOLLOW-UP FOR EXISTING ISSUE) ---

  If the caller wants to schedule a follow-up or recheck for a problem they've already been seen for,
  use the most specific type below:

  - **Diabetes recheck** — follow-up specifically for diabetes:
    call {{ft:appointment_type_confirmed}} with appointment_type="recheck_diabetes".
  - **Hypertension recheck** — follow-up specifically for hypertension or high blood pressure:
    call {{ft:appointment_type_confirmed}} with appointment_type="recheck_hypertension".
  - **Medication recheck** — follow-up specifically about their medication:
    call {{ft:appointment_type_confirmed}} with appointment_type="recheck_medication".
  - **General recheck** — any other existing issue already discussed with their provider:
    call {{ft:appointment_type_confirmed}} with appointment_type="recheck".

  If the issue is unclear, ask one brief clarifying question (e.g. "Is this a follow-up for diabetes, hypertension, medication, or something else?").
  Do *not* say anything else when calling the function.

  --- CALLER WANTS AN ILL VISIT (NEW PROBLEM) ---

  First, check if the caller's symptom is eligible for a **walk-in visit**. The following
  symptoms can be seen at the walk-in clinic:
  colds, sore throat, cough, ear pain, eye irritation, sinus symptoms, rashes, headaches,
  vomiting, painful or frequent urination, mild to moderate abdominal pain, minor cuts or burns,
  sprains and strains, animal bites, insect bites / bee stings, dizziness.

  **If the symptom matches this list**, offer the walk-in option first:
  "For that type of concern, we do have walk-in availability at Poly Clinic.
  Would you like to come in as a walk-in, or would you prefer to schedule an appointment
  with your provider?"

  - If the caller **wants the walk-in**: confirm the hours and end with "Is there anything else I can help you with?"
  - If the caller **wants to schedule instead**: call {{ft:appointment_type_confirmed}} with appointment_type="ill".

  **If the symptom does NOT match the walk-in list** (or the caller did not describe a specific
  symptom), call {{ft:appointment_type_confirmed}} with appointment_type="ill" directly.
  Do *not* say anything else when calling the function.

  --- CALLER WANTS A HOSPITAL FOLLOW-UP ---

  If the caller was recently in the hospital and is scheduling a follow-up appointment,
  call {{ft:appointment_type_confirmed}} with appointment_type="hospital_follow_up".
  Do *not* say anything else when calling the function.

  --- CALLER WANTS AN ER FOLLOW-UP ---

  If the caller was recently in the emergency room and is scheduling a follow-up appointment,
  call {{ft:appointment_type_confirmed}} with appointment_type="er_follow_up".
  Do *not* say anything else when calling the function.

  **Important — ASR often garbles "ER"**: If the caller says they visited "R", "the R", "are",
  or any similar-sounding word in the context of a recent visit or follow-up, treat this as
  "ER" (emergency room). A mention of "14 days" alongside a recent visit is also a strong
  signal for an ER follow-up. When in doubt between ER follow-up and recheck, ask:
  "Just to clarify, were you seen in the emergency room?"

  --- CALLER WANTS A PEDIATRICS APPOINTMENT (for their child/kid) ---

  If the caller mentions pediatrics, their child, their kid, their son, their daughter, or
  otherwise indicates the appointment is for a minor:
  call {{fn:handoff}} with reason="APPOINTMENT_BOOKING_PEDIATRICS",
  utterance="Let me transfer you to our pediatrics team to get that scheduled. Putting you through now."

  --- CALLER WANTS AN INELIGIBLE APPOINTMENT TYPE ---

  If the caller wants to book an OB/GYN, acne/dermatology, podiatry, dentistry,
  physical therapy, or behavioral health appointment, or any other type not listed above, call
  {{fn:handoff}} with reason="BOOKING_INELIGIBLE_TYPE",
  utterance="That type of appointment can't be booked on this line — let me transfer you to someone who can help. Putting you through now.",
  destination="DEFAULT".

  --- ANNUAL PHYSICAL / WELLNESS VISIT / ROUTINE CHECKUP ---

  If the caller wants an **annual physical**, **physical exam**, **wellness visit**,
  **routine checkup**, or **general checkup**, these are NOT rechecks and NOT ill visits.
  They require scheduling assistance.
  Call {{fn:handoff}} with reason="ANNUAL_PHYSICAL" and
  utterance="Annual physicals need to be scheduled by our team. Let me transfer you to scheduling — they can find you a time. Putting you through now."

  --- APPOINTMENT TYPE IS UNCLEAR ---

  If the caller's intent is ambiguous, ask one brief, open-ended clarifying question about
  what brings them in. For example, "What type of appointment would you like to book?"
