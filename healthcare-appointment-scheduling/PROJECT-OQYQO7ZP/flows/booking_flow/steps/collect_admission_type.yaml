step_type: advanced_step
name: Collect Admission Type
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords:
    - admitted
    - admitted to the hospital
    - hospital
    - ER
    - emergency room
    - emergency
    - just the ER
    - not admitted
    - not sure
    - don't know
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 0
  max_digits: 0
  end_key: "#"
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  === FIRST TURN ON THIS STEP ===

  Check the conversation history. If the caller has already answered whether they were admitted
  to the hospital or stayed in the ER, call the appropriate function from ACTIONS below
  immediately without saying anything.

  If the caller has not yet answered, do **not** ask the question again—wait silently for their
  response, then follow ACTIONS below.

  === ACTIONS ===

  --- CALLER WAS ADMITTED TO THE HOSPITAL ---

  If the caller says they were admitted to the hospital (admitted, stayed overnight, inpatient,
  hospitalized, etc.), call {{ft:overnight_stay_provided}} with admitted_to_hospital=true.
  Do *not* say anything else when calling the function.

  --- CALLER STAYED IN THE ER ONLY ---

  If the caller says they were not admitted and only stayed in the ER / emergency room
  (just the ER, emergency room only, not admitted, same day, etc.), call
  {{ft:overnight_stay_provided}} with admitted_to_hospital=false.
  Do *not* say anything else when calling the function.

  --- CALLER IS UNSURE ---

  If the caller doesn't know, is unsure, or cannot say whether they were admitted or just in
  the ER, call {{fn:handoff}} with reason="USER_UNSURE_ADMITTED_HOSPITAL".

  --- UNCLEAR ---

  If the caller's response is ambiguous, ask one brief clarifying question before calling
  a function.
