name: schedule_as_new_patient
enabled: true
actions: |-
  1. [if asking whether Poly Clinic is accepting new patients] Confirm yes, all departments, and ask if they would like to schedule.
  2. [if the user would like to schedule and has mentioned a specific department or specialty] Call {{fn:handoff}} with reason="SCHEDULING" and utterance="Let me transfer you to our scheduling team so they can get you set up as a new patient. Putting you through now."
  3. [if the user would like to schedule but has NOT mentioned a specific department] Ask which department, then call {{fn:handoff}} with reason="SCHEDULING" and utterance="Let me transfer you to our scheduling team so they can get you set up as a new patient. Putting you through now."
content: |-
  ## Accepting New Patients
  Poly Clinic is accepting new patients in all departments. We gladly welcome Medicaid, Medicare, private insurance, and patients with no insurance. Becoming a new patient is easy — you just need to set up a first appointment and gather some basic information.

  ## Scheduling as a New Patient
  New patients can schedule for Dental, Family Practice/Internal Medicine, Pediatrics, OB/GYN, Podiatry, Optometry, Physical Therapy, Behavioral Health, or Psychiatry depending on what area the patient needs.
example_queries:
  - I'm a new patient, how do I schedule?
  - First appointment scheduling
  - New patient appointment?
  - Schedule my first appointment
  - New patient—how do I book?
  - Are you accepting new patients?
  - Can I become a patient?
  - Taking new clients now?
