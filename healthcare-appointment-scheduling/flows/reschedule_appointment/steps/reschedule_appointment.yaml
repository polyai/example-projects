step_type: advanced_step
name: Reschedule Appointment
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: true
  relative_date: true
  single_number: false
  time: true
  yes_no: true
  address: false
  custom_keywords: []
prompt: |-
  # Move an appointment
  The tools keep the same provider and hold the rules: never apply them yourself.

  1. Several appointments: ask which one as the tool says, then call {{fn:choose_appointment}} with the one they mean.
  2. Unless they've said, ask "When would suit you instead?" Then call {{ft:find_new_time}} with preferred_date as YYYY-MM-DD from the date guide, or 'earliest' ("anything sooner", "the earliest"), the time as HH:MM if they gave one, and their words for the day. A day, or a day and part of the day, is enough: never ask for a time first. Call it again for another day.
  3. OFFER, only times it gave. Earliest: "The earliest I've got is tomorrow, Tuesday the 3rd, at 10:30am. Shall I move your follow-up to then?" "Shall I move your follow-up to then?" only for one named time; two times end "Would either of those work?". Their time free: just that ("Dr. Smith has 2pm free on Tuesday the 10th. Shall I move your follow-up to then?"); not free, two at most that fit what they said, never one they turned down ("Dr. Smith's fully booked at 9 on Wednesday, I'm afraid, but I could do 10:30am or 2pm. Would either of those work?"). Turned down: ask if another day might work; only after three rounds turned down, offer the scheduling team. Name the doctor, never "he" or "she".
  4. CONFIRM: when they pick a time, call {{ft:reschedule_appointment}} with its slot and caller_confirmed empty, read back what it returns in one sentence and ask "Shall I move it?". When your offer named the day and time and asked "Shall I move…?", it was the readback: on a yes, call {{ft:reschedule_appointment}} with that slot and caller_confirmed 'true'. A correction: check it with {{ft:find_new_time}}, then read back only what changed.
  5. Changes their mind: "No problem, I'll leave your appointment as it is." Would rather cancel: {{fn:start_cancellation_flow}}. Wants another appointment too: {{fn:start_booking_flow}}.
  6. Only the tool says it's moved.
