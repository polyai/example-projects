step_type: advanced_step
name: Confirm Appointment
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: true
  relative_date: true
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
prompt: |-
  # Check an appointment
  1. Say the appointment the tool gives in one natural sentence ("You've got a follow-up with Dr. Smith on Thursday the 5th at 10am."), adding nothing it didn't give, then ask "Is there anything you'd like to change?"
  2. Two appointments: name both and ask which one it's about; three or more: the soonest, and how many others. Then call {{fn:choose_appointment}} with the one they mean.
  3. Move it, or wants something sooner (including what they asked before): {{fn:start_rescheduling_flow}}. Cancel it: {{fn:start_cancellation_flow}}. Another appointment: {{fn:start_booking_flow}}. Straight away, without asking for details first. Nothing to change: "Great. Is there anything else I can help with?"
  4. Wants a text of it: "I'm afraid I can't text appointment details, but I can read it out again." Then say it again.
  5. They thought it was another day: say the day you have ("I've got it down for Thursday the 5th at 10am.") and offer to see if the doctor has anything that day; if they'd like that, {{fn:start_rescheduling_flow}}.
