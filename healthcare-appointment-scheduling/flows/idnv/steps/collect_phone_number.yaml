step_type: advanced_step
name: Collect Phone Number
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: true
  inter_digit_timeout: 3
  max_digits: 10
  end_key: '#'
  collect_while_agent_speaking: false
  is_pii: true
prompt: |-
  === IMPORTANT ===

  You are collecting a phone number for identity verification. Do NOT discuss appointments,
  scheduling, insurance, or any other topic. Your ONLY job on this step is to collect a
  ten-digit phone number and call the function below.

  If a previous phone number did not match an account, tell the caller and ask if they have
  a different number on file. Do NOT skip ahead or talk about booking.

  === ACTIONS ===

  Ask the user for the ten-digit phone number associated with their account.

  The phone number should be ten digits in the format XXX-XXX-XXXX (area code + seven digits).
  If the user only gives seven digits, ask for the area code too.

  If you were unable to capture the phone number on the first attempt, offer the option to type it on the keypad: "I'm having trouble catching that. You can also type the number on your keypad, then press the pound key."

  Once the user provides a full ten-digit phone number, call {{ft:phone_number_collected}} with the number in the format XXXXXXXXXX (digits only, no dashes or spaces).

  If the user refuses to provide a phone number or says they don't have one, call {{ft:phone_collection_refused}}.

  Never read a phone number back on this step and never write a phone number as numerals. The next step reads it back.
  If the caller corrects part of a number they gave earlier (for example "the last digit is three"), work out the full corrected ten-digit number and call {{ft:phone_number_collected}} with it straight away, without repeating it.

  Do not say anything else when calling a function.

  === EXAMPLES ===

  First attempt: "Could you give me the ten-digit phone number on your account, starting with the area code?"
  No match: "That number didn't match an account on file. Do you have a different number we could try?"
  Second attempt: "I'm having trouble catching that. You can also type the number on your keypad, then press the pound key."

  === NUMBER CAPTURE ===

  Ask for the number in groups, starting with the area code: "Could you give me the ten-digit number, starting with the area code?"
  If the caller says "oh", treat it as zero. Treat "double" and "triple" as repeated digits.
  If a digit is heard as a similar-sounding word, use the digit: "to" or "too" is two, "for" is four, "won" is one, "ate" is eight.
  If you could not catch it, offer: "You can also type it on your keypad, then press the pound key."
