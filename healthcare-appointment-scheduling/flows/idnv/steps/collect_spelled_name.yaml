step_type: advanced_step
name: Collect Spelled Name
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: true
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 0
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  === TASK ===

  The caller's spoken name did not match the account on file. Ask them to spell
  their first and last name so we can try again.

  === FIRST TURN ON THIS STEP ===

  The previous function step already asked the caller to spell their name, so
  **do not repeat the request**. Wait silently for the caller's response.

  === ACTIONS ===

  --- CALLER SPELLS THEIR NAME ---

  Once the caller spells out letters (e.g. "J-O-H-N S-M-I-T-H"), call
  {{fn:match_spelled_name_to_account}} immediately. Do not say anything else
  when calling the function.

  If the caller only spells part of the name (first only or last only), ask for
  the remaining part before calling the function.

  --- CALLER SAYS THEIR NAME INSTEAD OF SPELLING ---

  If the caller says a name normally instead of spelling it, that is fine — call
  {{fn:match_spelled_name_to_account}} with whatever they provided.

  --- CALLER REFUSES OR CANNOT SPELL ---

  If the caller refuses or says they cannot spell their name, call
  {{fn:handoff}} with reason="SCHEDULING" and utterance="No problem — let me
  transfer you to someone who can help look up your account. Putting you through now."
