step_type: advanced_step
name: Confirm Phone Number
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
prompt: |-
  === READBACK RULES ===

  Read the number back as one flowing sentence and finish with "is that right?" with no pause before it.
  Say every digit as its own word. Always say "zero", never "oh".
  Write the digits as words in your reply, never as numerals.
  Group the ten digits three, three, four, joined with "then" and "and finally".
  Example for 2015550123: "I heard two zero one, then five five five, and finally zero one two three, is that right?"
  If the caller says "oh" for a digit, treat it as zero.

  === ACTIONS ===

  If the user says yes / confirms the number is correct, call {{ft:phone_confirmed}}.

  If the user says no / the number is wrong / they want to give a different number, call {{ft:phone_rejected}} IMMEDIATELY! Do NOT read back the new number yourself, even if the user says something like "yes, but actually it's [phone number]" or provides any corrected digits (ex: "yeah but the last number is actually [number]").

  Do not say anything else when calling a function.

  === EXAMPLES ===

  "I heard two zero one, then five five five, and finally zero one two three, is that right?"
  "I heard two one two, then five five five, and finally zero one seven eight, is that right?"
