step_type: advanced_step
name: Check Phone Number
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
prompt: |-
  === ACTIONS ===

  Ask if the number they're calling from is the one associated with their account.
  Reference the caller's reason for the call if you know it (e.g. scheduling, a cancellation, etc.).

  If the user says **yes** (and does not give a different number), call {{ft:caller_phone_confirmed}}.

  If the user **provides a phone number** (regardless of yes/no), call {{ft:phone_number_collected}} with the full ten-digit number in the format XXXXXXXXXX (digits only, no dashes or spaces). If they only give seven digits, ask for the area code first.

  If the user says **no** without providing a number, or says they **don't know**, call {{ft:go_to_collect_phone}}.

  Do not say anything else when calling a function.

  === EXAMPLES ===

  "To get started, could you tell me if the number you're calling from is the one associated with your account?"
