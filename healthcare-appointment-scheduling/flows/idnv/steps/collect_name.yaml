step_type: default_step
name: Collect Name
conditions:
  - name: Name collected
    condition_type: step_condition
    description: When the user has provided their name for verification.
    child_step: match_name_to_account
    required_entities:
      - full_name
  - name: User refuses to provide name
    condition_type: step_condition
    description: When the user refuses to provide their name.
    child_step: name_collection_failed
    required_entities: []
extracted_entities:
  - full_name
prompt: |-
  ## Goal
  Collect the name on the account as the final verification step.

  ## Actions
  1. Ask for the name on the account. Do NOT reference previous verification steps (phone number, date of birth) — just ask for the name naturally as a last step.
  2. Save what they say as {{entity:full_name}}. Accept first and last name in any order; middle names or nicknames are fine.

  If the user refuses to provide their name, trigger the refusal condition so they can be transferred.

  ## Example
  - If $caller_is_case_manager is true: "Alright, and as a last step, could you tell me the patient's name?"
  - Otherwise: "Alright, and as a last step, could you tell me the name associated with the account?"
