step_type: advanced_step
name: Check Work Injury
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 0
  max_digits: 0
  end_key: "#"
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  === FIRST TURN ON THIS STEP ===

  Before saying anything, **review the full conversation history**.

  - If the caller has already confirmed this appointment is related to a **work injury**,
    call {{fn:handoff}} with reason="work_injury" and:
      - If $caller_is_case_manager is true, use utterance="To get the patient scheduled we'll need
        approval from their employer and a few other details — let me get you to our patient
        accounts team. Putting you through now."
      - Otherwise, use utterance="To get you scheduled we'll need approval from your employer and a
        few other details — let me get you to our patient accounts team. Putting you through now."
    immediately. Do NOT ask again — they already told you.

  - If the caller has already confirmed this appointment is related to an **auto accident**,
    call {{fn:handoff}} with reason="auto_accident" and:
      - If $caller_is_case_manager is true, use utterance="To get the patient scheduled we'll need
        to gather some claim information — let me get you to our patient accounts team. Putting you
        through now."
      - Otherwise, use utterance="To get you scheduled we'll need to gather some claim information
        — let me get you to our patient accounts team. Putting you through now."
    immediately. Do NOT ask again — they already told you.

  - If the caller has already confirmed this appointment is **not** related to a work injury
    or auto accident, call {{ft:no_work_injury_confirmed}} immediately.
    Do NOT ask again — they already told you.

  - Otherwise, ask: "Is this appointment related to a work injury or auto accident?"

  === ACTIONS ===

  --- WORK INJURY ---

  If the caller says this is related to a work injury:
  call {{fn:handoff}} with reason="work_injury" and:
    - If $caller_is_case_manager is true, use utterance="To get the patient scheduled we'll need
      approval from their employer and a few other details — let me get you to our patient accounts
      team. Putting you through now."
    - Otherwise, use utterance="To get you scheduled we'll need approval from your employer and a
      few other details — let me get you to our patient accounts team. Putting you through now."

  --- AUTO ACCIDENT ---

  If the caller says this is related to an auto accident:
  call {{fn:handoff}} with reason="auto_accident" and:
    - If $caller_is_case_manager is true, use utterance="To get the patient scheduled we'll need to
      gather some claim information — let me get you to our patient accounts team. Putting you
      through now."
    - Otherwise, use utterance="To get you scheduled we'll need to gather some claim information —
      let me get you to our patient accounts team. Putting you through now."

  --- NEITHER / NOT APPLICABLE ---

  If the caller says no, it is not related to a work injury or auto accident:
  call {{ft:no_work_injury_confirmed}}.
  Do *not* say anything else when calling the function.

  --- UNCLEAR ---

  If the caller's response is ambiguous, ask one brief clarifying question before calling
  a function.
