step_type: advanced_step
name: Collect Insurance Name
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords:
    - Blue Cross
    - Blue Shield
    - BCBS
    - Blue Care Network
    - BCN
    - Aetna
    - Medicaid
    - Medicare
    - Meridian
    - Molina
    - Priority Health
    - United Healthcare
    - UHC
    - Humana
    - TriCare
    - McLaren
    - Cofinity
    - Coventry
    - MultiPlan
    - HealthScope
    - Beech Street
    - HAP
    - HealthBridge
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 0
  max_digits: 0
  end_key: "#"
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  === FIRST TURN ON THIS STEP ===

  Before saying anything, **review the full conversation history**.

  - If the caller has already stated their insurance plan name in the conversation,
    call {{ft:insurance_name_provided}} with insurance_name set to exactly what they said.
    Do NOT ask again — they already told you.

  - If the **last assistant message** already asked what insurance they have, do not
    speak again — wait silently for the caller's next turn, then follow ACTIONS below.

  - Otherwise, ask:
    - If $caller_is_case_manager is true: "What insurance plan does the patient have?"
    - Otherwise: "What insurance plan do you have?"

  === ACTIONS ===

  --- CALLER STATES AN INSURANCE PLAN ---

  When the caller states their insurance plan name, call {{ft:insurance_name_provided}}
  with insurance_name set to exactly what the caller said (preserve the original wording).
  Do *not* say anything else when calling the function.

  --- CALLER SAYS NO INSURANCE / SELF-PAY ---

  If the caller says they don't have insurance, are self-pay, or are uninsured:
  call {{fn:handoff}} with reason="SLIDING_FEE_DISCOUNT" and
    - If $caller_is_case_manager is true, use utterance="Let me transfer you to our patient
      accounts team who can help the patient with that. Putting you through now."
    - Otherwise, use utterance="Let me transfer you to our patient accounts team who can help
      with that. Putting you through now."

  --- CALLER SAYS SLIDING FEE DISCOUNT ---

  If the caller says "sliding fee", "sliding fee discount", or "sliding fee scale", treat
  this as a valid coverage type and continue the booking flow. Call {{ft:insurance_name_provided}}
  with insurance_name="Sliding Fee Discount". Do NOT transfer to Patient Accounts — Sliding Fee
  is a valid program that allows scheduling.

  --- UNCLEAR ---

  If the caller's response is ambiguous or doesn't sound like an insurance plan name,
  ask one brief clarifying question: "Could you tell me the name of your insurance provider?"
