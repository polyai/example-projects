step_type: advanced_step
name: Collect Appointment Category
asr_biasing:
  is_enabled: false
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 0
  max_digits: 0
  end_key: "#"
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  === FIRST TURN ON THIS STEP ===

  Before saying anything, **review the full conversation history**.

  - If the caller has already mentioned a **specialty department** (OB/GYN, dental, pediatrics,
    behavioral health, physical therapy, podiatry, optometry, residency) or indicated the appointment is
    **for their child, kid, son, or daughter**, call
    {{fn:handoff}} with reason="SCHEDULING" and utterance="Let me transfer you to our
    scheduling team for that department. Putting you through now."
    Do NOT ask again — they already told you.
    This also applies if $caller_is_case_manager is true and the appointment type is clearly
    pediatric (e.g. "sports physical", "well-child exam", "school physical") — a parent/guardian
    calling for their child should route to pediatrics.
    **IMPORTANT:** "a physical", "physical exam", "physical care", "annual physical", or
    "schedule a physical" means a **physical exam** — this is PRIMARY CARE, NOT physical therapy.
    Only route to physical therapy if the caller explicitly says "physical therapy" or "PT".
    **EXCEPTION:** "sports physical" when the caller is a parent ($caller_is_case_manager is true)
    is a PEDIATRIC appointment — transfer to scheduling via {{fn:handoff}} with reason="SCHEDULING".

  - If the caller has already mentioned **family practice, internal medicine, primary care,
    primary provider, general practice, a physical exam, an annual physical, a checkup,
    or a recheck/ill visit**, call
    {{ft:appointment_category_fpim_confirmed}} immediately.
    Do NOT ask again — they already told you.

  - Otherwise, ask the caller whether they need to see a primary provider in family practice and internal medicine, or if this is for another department.
    - If $caller_is_case_manager is true: "Does the patient need to see a primary provider in family practice and internal medicine, or is this for another department?"
    - Otherwise: "Do you need to see a primary provider in family practice and internal medicine, or is this for another department?"

  === TASK ===

  Determine whether the caller wants to book with a specialty department or with
  family practice / internal medicine / primary care.

  === ACTIONS ===

  --- CALLER MENTIONS A SPECIFIC PROVIDER BY NAME ---

  If the caller mentions a provider by name (e.g. "Dr. Jennings", "Stephanie George",
  "I want to see Dr. Chang"), ask whether the appointment is with their primary care
  provider or a different department so you can route them correctly.

  --- CALLER WANTS A SPECIALTY DEPARTMENT ---

  If the caller mentions OB/GYN, obstetrics, gynecology, dental, dentist, pediatrics,
  children's doctor, their child, their kid, their son, their daughter, a minor,
  behavioral health, mental health, counseling, physical therapy, PT,
  podiatry, foot doctor, optometry, eye doctor, or residency:
  call {{fn:handoff}} with reason="SCHEDULING" and utterance="Let me transfer you to our
  scheduling team for that department. Putting you through now."
  Do *not* say anything else when calling the function.
  **IMPORTANT:** "a physical", "physical exam", "physical care", "annual physical", or
  "schedule a physical" is a **physical exam** (primary care), NOT physical therapy.
  Only route to physical therapy if the caller explicitly says "physical therapy" or "PT".
  **IMPORTANT:** "sports physical" when $caller_is_case_manager is true (parent calling for
  their child) is a PEDIATRIC appointment — route to scheduling, NOT FPIM.

  --- CALLER WANTS FAMILY PRACTICE / INTERNAL MEDICINE / PRIMARY CARE ---

  If the caller mentions family practice, internal medicine, primary care, primary provider,
  general practice, a physical exam, an annual physical, a checkup, a recheck, a follow-up,
  an ill visit, a sick visit, or any appointment with their regular provider:
  call {{ft:appointment_category_fpim_confirmed}}.
  Do *not* say anything else when calling the function.

  --- UNCLEAR ---

  If the caller's intent is ambiguous, ask ONE brief clarifying question:
    - If $caller_is_case_manager is true: "Does the patient need to see a primary provider in family practice and internal medicine, or is this for another department?"
    - Otherwise: "Do you need to see a primary provider in family practice and internal medicine, or is this for another department?"

  If the caller still doesn't know or says "I'm not sure" after the clarifying question,
  transfer them to scheduling:
  Call {{fn:handoff}} with reason="SPEAK_TO" and utterance="No problem — let me transfer you to our scheduling team and they can help you find the right provider. Putting you through now."
