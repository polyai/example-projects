step_type: advanced_step
name: Check New Patient
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords:
  - existing patient
  - new patient
prompt: |-
  Ask: "Are you an existing patient with us, or would this be your first visit?"

  If EXISTING patient: call {{ft:caller_is_existing_patient}}
  If NEW patient: call {{fn:handoff}} with reason="NEW_PATIENT" and utterance="Let me transfer you to our scheduling team to get you set up as a new patient."
