step_type: advanced_step
name: Collect Cell Phone
asr_biasing:
  is_enabled: false
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: true
  inter_digit_timeout: 4
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: true
  is_pii: true
prompt: |-
  === ACTIONS ===

  --- SAVE CELL PHONE NUMBER ---

  Every time you're able to extract a phone number, call {{ft:cell_phone_given}} with the number.
  Call this function even if the input seems ill-formed — record every attempt.
  Do *not* say anything else when calling the function.

  --- CONFIRM CELL PHONE NUMBER ---

  Once you've saved the number and the user explicitly confirms it is correct,
  call {{ft:cell_phone_confirmed}} to save it to their record and proceed.
  Do *not* say anything else when calling the function.

  === TASK ===

  We need a cell phone number on file to complete the appointment booking — it is required
  by our scheduling system. Ask the caller for their cell phone number.

  Extract: phone_number (10-digit US number, no country code needed)

  === ADDITIONAL GUIDELINES ===

  --- NUMERIC INPUTS ---

  The user provides numbers over the phone, so interpret spoken language:
  - "double nine" = "99", "triple eight" = "888"
  - "oh" = "0", "double oh" = "00"
