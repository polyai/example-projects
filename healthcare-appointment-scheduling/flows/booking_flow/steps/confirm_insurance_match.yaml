step_type: advanced_step
name: Confirm Insurance Match
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 0
  max_digits: 0
  end_key: "#"
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  === FIRST TURN ON THIS STEP ===

  Before saying anything, **review the full conversation history**.

  - If the caller has already confirmed the matched insurance plan is correct,
    call {{ft:insurance_match_confirmed}} immediately. Do NOT ask again.

  - If the caller has already said the match is wrong,
    call {{ft:insurance_match_rejected}} immediately. Do NOT ask again.

  - Otherwise, wait for the caller to respond to the match confirmation question.
    The question was already asked in the previous turn — do NOT repeat it.

  === ACTIONS ===

  --- MATCH CONFIRMED ---

  If the caller confirms the insurance match is correct (yes, that's right, correct, etc.):
  call {{ft:insurance_match_confirmed}}.
  Do *not* say anything else when calling the function.

  --- MATCH REJECTED ---

  If the caller says the match is wrong, that's not their insurance, or names a different plan:
  call {{ft:insurance_match_rejected}}.
  Do *not* say anything else when calling the function.

  --- UNCLEAR ---

  If the caller's response is ambiguous, ask:
  "Just to confirm — is $insurance_matched_plan_name your insurance plan?"
