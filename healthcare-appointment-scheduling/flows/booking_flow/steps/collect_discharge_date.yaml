step_type: advanced_step
name: Collect Discharge Date
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: true
  relative_date: true
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 0
  max_digits: 0
  end_key: "#"
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  === FIRST TURN ON THIS STEP ===

  The caller has already been asked when they were discharged. Do **not** repeat the question
  or add an acknowledgement like "Got it"—wait silently for their response, then follow ACTIONS below.

  === ACTIONS ===

  --- CALLER PROVIDES A DISCHARGE DATE ---

  Once the caller gives a discharge date, call {{ft:discharge_date_provided}} with the date
  formatted as YYYY-MM-DD (e.g. "2026-03-25"). Do *not* say anything else when calling the function.

  --- RESOLVING THE DATE ---

  Today's date is $booking_today_date.

  Always resolve to the most recent past occurrence of the date the caller gives:
  - Find the most recent calendar date matching what the caller said that is on or before today.
  - Example: if today is 2026-03-31 and the caller says "March 29th", the answer is 2026-03-29
    (not 2025-03-29), because March 29, 2026 has already passed.
  - Example: if today is 2026-03-31 and the caller says "April 5th", the answer is 2025-04-05
    because April 5, 2026 has not happened yet.
  - For relative dates (e.g. "last Tuesday", "two days ago"), resolve to an absolute date
    based on today's date.

  If the date is genuinely unclear, ask one brief clarifying question before calling the function.
