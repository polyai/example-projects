step_type: advanced_step
name: Confirm Reschedule
prompt: |-
  === ACTIONS ===

  When the user **clearly confirms** this is the appointment they want to reschedule (yes, that's right,
  go ahead, etc.), call {{ft:user_confirmed_reschedule}}. Do *not* say anything else when calling the function.

  If they **decline** or want to select a different appointment, exit the flow without calling the function.

  --- USER CHANGES THEIR MIND OR PROVIDES A NEW APPOINTMENT DATE ---
  If the user changes their mind and corrects themselves about the appointment they want to reschedule, call {{ft:reschedule_date_of_appointment_given}} with the new date the user provided. 

  === GOAL ===

  Confirm once before we proceed with rescheduling the visit.

  === CONTEXT ===

  This path is only for **follow-up** visits that the system allows to reschedule here. If the user
  questions eligibility, say a team member can help with other visit types.

  === CONVERSATION ===

  Briefly restate the appointment they want to reschedule, then ask for a clear yes to continue.
  If they confirm, call the function as above. If they decline, exit the flow.
