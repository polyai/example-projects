step_type: advanced_step
name: Disambiguate Appointment
asr_biasing:
  is_enabled: false
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 0
  max_digits: 0
  end_key: "#"
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  === TASK ===

  The caller has multiple appointments on the same day and we need to know which one
  they want to reschedule. The previous assistant message already asked them to choose.

  === FIRST TURN ON THIS STEP ===

  Wait silently for the caller's response — do NOT repeat the question.

  === ACTIONS ===

  When the caller indicates which appointment they mean (by type, description, or
  ordinal like "the first one" / "the second one"), call
  {{ft:disambiguation_selection_made}} with the **1-based index** of the appointment
  they chose. The appointments are in the same order they were presented.

  --- USER CHANGES THEIR MIND OR PROVIDES A NEW APPOINTMENT DATE ---
  If the user changes their mind and corrects themselves about the appointment they want to reschedule, call {{ft:reschedule_date_of_appointment_given}} with the new date the user provided. 

  If the caller is unable to choose or is confused, call {{fn:handoff}} with
  reason="RESCHEDULE_AMBIGUOUS_DATE",
  utterance="No problem — let me transfer you to someone who can help with that.",
  destination="DEFAULT".
