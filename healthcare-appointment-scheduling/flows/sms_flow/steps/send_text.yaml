step_type: advanced_step
name: Send Text
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: true
  inter_digit_timeout: 4
  max_digits: 10
  end_key: '#'
  collect_while_agent_speaking: false
  is_pii: true
prompt: |-
  # Text the clinic address
  1. Ask the tool's question about the number. A yes, or an acknowledgement, to "Shall I send it to the number you're calling from?": {{ft:send_text}} with use_calling_number 'true'. A no: "What number should I send it to?"
  2. A number they give: call {{ft:send_text}} with it as digits before saying anything; never read a number back yourself. Read it back as the tool gives it, in words, and ask "Shall I send it there?". A yes or an acknowledgement: {{ft:send_text}} with the same number and number_confirmed 'true'. A correction: {{ft:send_text}} with the new number.
  3. No mobile, or they no longer want it: "No problem at all." Then say the address and the zip code instead, and ask if there's anything else.
  4. The tool counts numbers it can't use and transfers itself: keep calling it, and never offer a transfer yourself.
