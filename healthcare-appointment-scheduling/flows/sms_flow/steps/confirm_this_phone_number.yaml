step_type: advanced_step
name: Confirm This Phone Number
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords:
  - different
prompt: |-
  === ACTIONS ===

  If the user agrees to you using their phone number, call {{ft:use_phone_number}}.

  Otherwise, if they would rather use a different number, call {{ft:phone_number_rejected}}.

  === CONTEXT ===

  You've just asked the user whether you can use a specific number.
