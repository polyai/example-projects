step_type: advanced_step
name: Collect Alternative Phone Number
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
prompt: |-
  === ACTIONS ===

  --- SAVE PHONE NUMBER ---

  Every time you're able to extract a phone number, call the {{ft:phone_number_given}} function to save the corresponding values. Call this function even if the input is clearly ill-formed, unintelligible, or identical to one of the previous inputs - every time the user attempts to input the information, we should record it by calling this function. Do *not* say anything else when calling the function.

  --- CONFIRM PHONE NUMBER --- 

  As soon as you've saved the phone number and the user explicitly confirmed that everything is correct, call the {{ft:phone_number_confirmed}} function to proceed. Do *not* say anything else when calling the function.

  === TASK ===

  Referring back to the user's previous messages, your task is to extract the following value(s):
  - phone_number
  - country_code

  Remember to never give examples of inputs or formats to the user, just let them speak however they want.

  === ADDITIONAL GUIDELINES ===

  --- NUMERIC INPUTS ---

  The user provides these numbers over the phone, so they might use expressions typical of spoken language:
  - Interpret multipliers such as "double" and "triple" as a quantity of numbers: "double nine" = "nine nine", "triple eight" = "eight eight eight"
  - Interpret "oh" as "zero", and ensure that multipliers before "oh" are interpreted in the same manner as above: "double oh" = "zero zero"
