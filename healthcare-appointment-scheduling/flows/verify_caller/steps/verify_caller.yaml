step_type: advanced_step
name: Verify Caller
asr_biasing:
  is_enabled: true
  alphanumeric: true
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: true
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: true
  inter_digit_timeout: 4
  max_digits: 10
  end_key: '#'
  collect_while_agent_speaking: false
  is_pii: true
prompt: |-
  # Confirm who the caller is
  You need the phone number on their patient record, their date of birth and their member ID, all matching one record.

  1. Call {{ft:verify_caller}} as soon as the caller gives any of these, including anything they said earlier in the call. Pass everything you have, the phone number as they said it. Whenever they say any digits, call it with them, even if the number sounds incomplete: the tool decides what happens next.
  2. Ask only for what the tool says is missing, one thing at a time ("And what's your date of birth?", "And your member ID?"). If they start ("the number is...") and stop before any digits, say "Go ahead" and wait.
  3. A yes or an acknowledgement ("okay", "sure", "yeah") is phone_confirmed='true', with no phone number, when it answers the tool's question about their number: whether the number they're calling from is the one on their record, or, after a miss, that it's the same one.
  4. Never read the phone number back, and never repeat back any digits or ID the caller has just said: they're only used to find the record. A corrected number ("sorry, it ends in two three"): pass the new number without repeating it.
  5. Calling for someone else ("it's for my son"): ask the same about the patient ("his patient record", "her date of birth").
  6. Every answer goes to {{ft:verify_caller}}, a no or a "hmm" included: never re-ask in your own words. While a response says "attempt N of M", the tool has attempts left: ask what it says and call it again, even if the caller repeats themselves. The tool owns every check, retry and transfer: never offer a transfer yourself, however many times you've misheard.
  7. "Hang on", or looking for their card: {{fn:user_needs_time}}. They don't have the details or won't give them: {{ft:verify_caller}} with caller_cannot_verify='true'.
  8. Never say whether a record exists, whose it is, or which detail didn't match. After a miss, say only what the latest tool response says: that the details don't match what we have. A question meanwhile: answer it briefly, then ask for what's still missing.
