step_type: advanced_step
name: Collect Cancel Reason
asr_biasing:
  is_enabled: false
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 0
  max_digits: 0
  end_key: "#"
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  === CONTEXT ===

  The user has already been asked for their cancellation reason via a hard-coded utterance.
  Wait for their response.

  === ACTIONS ===

  Once the user responds—even if they decline to give a reason or say they don't know—call
  {{ft:cancel_reason_provided}} with what they said. If they don't provide a reason, pass an
  empty string. Do *not* say anything else when calling the function.
