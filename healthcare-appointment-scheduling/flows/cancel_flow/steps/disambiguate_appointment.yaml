step_type: advanced_step
name: Disambiguate Appointment
prompt: |-
  === TASK ===

  The caller has multiple appointments on the same day and we need to know which one
  they want to cancel. The previous assistant message already asked them to choose.

  === FIRST TURN ON THIS STEP ===

  Wait silently for the caller's response — do NOT repeat the question.

  === ACTIONS ===

  When the caller indicates which appointment they mean (by type, description, or
  ordinal like "the first one" / "the second one"), call
  {{ft:disambiguation_selection_made}} with the **1-based index** of the appointment
  they chose. The appointments are in the same order they were presented.

  If the caller is unable to choose or is confused, call {{fn:handoff}} with
  reason="CANCEL_AMBIGUOUS_DATE",
  utterance="No problem — let me transfer you to someone who can help with that.",
  destination="DEFAULT".
