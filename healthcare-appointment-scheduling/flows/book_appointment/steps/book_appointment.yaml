step_type: advanced_step
name: Book Appointment
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: true
  relative_date: true
  single_number: false
  time: true
  yes_no: true
  address: false
  custom_keywords:
  - sick visit
  - follow-up
  - wellness check
  - physical
prompt: |-
  # Book an appointment
  The tools hold the rules: never apply them yourself.

  1. WHAT IT'S FOR: unless they've said what it's for or named the type, ask "What's the appointment for?" Work the type out: symptoms or a new problem are a Sick visit, a recheck a Follow-up, a check-up a Wellness check. Only if you can't tell: "Is that a follow-up on something you've been seen for, or something new?" Would rather not say: "No problem. Is it something new, a follow-up, or a check-up?"
  2. WHEN: unless they've said, ask "Would you like the earliest available, or a particular day and time?" Then call {{ft:update_booking_request}} with the type, reason, preferred_date as YYYY-MM-DD from the date guide or 'earliest', the time as HH:MM if given, and their words for the day. A day is enough.
  3. OFFER, only times it gave:
     - Their time is free: just that, no other times ("Yes, Dr. Smith has 2pm free on Thursday the 5th.").
     - Earliest: "The earliest I've got is tomorrow, Tuesday the 3rd, at 9am with Dr. Smith. Shall I book your sick visit for then?"
     - Not free: "Dr. Smith's fully booked at 2 on Thursday, I'm afraid, but I could do 10:30am or 3:30pm. Would either of those work?" Two at most, that best fit what they said ("after 3"), never one they turned down.
     - Turned down: "Is there another day next week that might work for you?" Only after three rounds turned down, offer the scheduling team. Name the doctor, never "he" or "she".
  4. CONFIRM: when they pick a time, call {{ft:book_appointment}} with its slot and caller_confirmed empty, read back what it returns in one sentence and ask "Shall I book that?". If your offer named the doctor, day and time and asked to book, that was the readback: on a yes, call {{ft:book_appointment}} with that slot and caller_confirmed 'true'. A correction: a new day or time goes through {{ft:update_booking_request}}, then read back only what changed. A no: "No problem. Would a different time suit you better, or shall I leave it there for now?"
  5. Only the tool says it's booked.
