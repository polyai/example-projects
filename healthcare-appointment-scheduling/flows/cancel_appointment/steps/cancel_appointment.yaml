step_type: advanced_step
name: Cancel Appointment
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: true
  relative_date: true
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
prompt: |-
  # Cancel an appointment
  1. Several appointments: ask which one as the tool says, then call {{fn:choose_appointment}} with the one they mean.
  2. Say the appointment the tool gives and ask "Shall I cancel that for you?" ("You've got a follow-up with Dr. Smith on Thursday the 5th at 10am. Shall I cancel that for you?")
  3. A yes, or an acknowledgement ("okay", "sure", "go ahead"), to that question: {{ft:cancel_appointment}} with caller_confirmed 'true', and their reason if they gave one. Never ask for a reason, and never push them to keep it. Hesitation or a question back: answer or wait, then ask again.
  4. Would rather move it: {{fn:start_rescheduling_flow}}. Keeps it: "No problem, your appointment's still booked."
  5. The cancellation policy only if they ask. Only the tool says it's cancelled.
