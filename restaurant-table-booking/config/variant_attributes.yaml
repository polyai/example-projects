variants:
- name: Default
  is_default: true
attributes:
- name: site_name
  values:
    Default: Poly Bistro
- name: address_info
  values:
    Default: We're at 123 Example Street in Anytown.
- name: accessibility_info
  values:
    Default: The dining room and restrooms are step-free. Let us know about any access needs when you book and we'll do our best to help.
- name: parking_info
  values:
    Default: There's street parking nearby and a public car park a short walk away.
- name: opening_hours
  values:
    Default: |-
      Monday: 12:00-21:00
      Tuesday: 12:00-21:00
      Wednesday: 12:00-21:00
      Thursday: 12:00-21:00
      Friday: 12:00-22:00
      Saturday: 12:00-22:00
      Sunday: 12:00-20:00
- name: phone_number
  values:
    Default: (555) 010-0100
- name: timezone
  values:
    Default: America/New_York
- name: allergy_info
  values:
    Default: We take allergies seriously. Please mention any allergy when you book and tell your server when you arrive, and the kitchen will advise you.
- name: celebrations_info
  values:
    Default: We'd love to help you celebrate. Mention the occasion when you book and we'll add a note for the team.
- name: children_info
  values:
    Default: Children are welcome. We have a kids' menu and high chairs.
- name: dietary_requirements_info
  values:
    Default: We have vegetarian, vegan and gluten-free options on the menu.
- name: dress_code_info
  values:
    Default: There's no dress code; come as you are.
- name: menu_info
  values:
    Default: You can see our full menu, with prices, at www.example-restaurant.com/menu.
- name: pets_info
  values:
    Default: We can't accommodate pets, but service animals are always welcome.
- name: private_dining_info
  values:
    Default: We can host private events and large groups. Email events@example-restaurant.com with your date and numbers and the team will get back to you.
- name: take_out_info
  values:
    Default: You can order takeout at www.example-restaurant.com/order.
- name: walk_in_info
  values:
    Default: Walk-ins are welcome when we have space. To be sure of a table, we recommend booking.
- name: address
  values:
    Default: 123 Example Street, Anytown
- name: late_arrival_info
  values:
    Default: We hold tables for 15 minutes after the booking time.
- name: group_booking_info
  values:
    Default: For larger groups, please use our group booking form at www.example-restaurant.com/groups.
