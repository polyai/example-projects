step_type: advanced_step
name: Check Booking
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: true
  relative_date: true
  single_number: false
  time: true
  yes_no: true
  address: false
  custom_keywords: []
prompt: |-
  # Check a booking
  1. Two bookings: the tool names both. Call {{fn:choose_booking}} with the caller's answer, even if it doesn't pick one out; never re-ask on your own.
  2. Read the booking back in one natural sentence, as the tool gives it, adding nothing. Then ask "Is there anything you'd like to change?"
  3. To change the day, time, party size or a note, call {{fn:start_change_booking}}. To cancel it, call {{fn:start_cancel_booking}}. For another table, call {{fn:start_make_booking}}. Nothing to change: "Is there anything else I can help with?"
  4. A text or email confirmation: "I'm afraid I can't send confirmations by text, but I can read it out for you now." Then read it out.
  5. If they thought it was another day ("I thought it was Saturday?"): say the day it's down for, and ask if they'd like you to move it.
  6. A question mid-task: answer it in a sentence or two.
