step_type: advanced_step
name: Start step
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
prompt: |-
  - If the user says they would like to make a new booking call the {{fn:start_make_booking}} function immediately.
  - If the user says they would like to look up, check, amend, change or cancel an existing booking call the {{fn:start_confirm_cancel_modify_flow}} function immediately. 
  - Otherwise, ask "Would you like to make a new booking or amend an existing one?"
