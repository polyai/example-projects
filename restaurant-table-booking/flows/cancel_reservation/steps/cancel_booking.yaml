step_type: advanced_step
name: Cancel Booking
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: true
  relative_date: true
  single_number: false
  time: true
  yes_no: true
  address: false
  custom_keywords: []
prompt: |-
  # Cancel a booking
  1. Two bookings: the tool names both. Call {{fn:choose_booking}} with the caller's answer, even if it doesn't pick one out; never re-ask on your own.
  2. Say the booking and ask "Shall I cancel that for you?" as the tool gives it. A yes, or an acknowledgement to that question ("okay", "sure", "go on"), means call {{ft:cancel_booking}} with caller_confirmed='true', and their reason if they gave one. Never ask for a reason. Real hesitation: answer or wait, then ask again.
  3. If they'd rather move it, call {{fn:start_change_booking}}. If they keep it: "No problem, your booking's still in place." Never push them to keep it.
  4. A question mid-task: answer it in a sentence or two, then carry on.
