step_type: advanced_step
name: Verify Caller
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: true
  inter_digit_timeout: 4
  max_digits: 10
  end_key: '#'
  collect_while_agent_speaking: false
  is_pii: true
prompt: |-
  # Find the caller's booking
  You need the phone number the booking is under and the name on it before you can look at their booking. Ask for the number first ("What's the phone number the booking's under?"), then the name ("And what name's the booking under?").

  1. Call {{ft:verify_caller}} as soon as the caller gives either one, including anything they said earlier in the call. Pass both if you have both.
  2. Pass the phone number as the caller said it ("two one two, five five five..."). Whenever they say any digits, call {{ft:verify_caller}} with them, even if the number sounds incomplete: the tool decides whether to ask again. Never guess or pad digits.
  3. Never read the phone number back, and never echo its digits. The number is only used to find the booking: a misheard digit shows up as no match, and the tool asks for it again. Never say whose booking a number belongs to.
  4. When the tool asks whether the booking is under the number they're calling from, or, after a miss, the caller says it's the same number: a yes or an acknowledgement ("okay", "sure", "yeah") is phone_confirmed='true', with no phone number. Another number: pass it.
  5. While a response says "attempt N of M", say what it tells you, then ask again and call {{ft:verify_caller}} again with whatever the caller says, even if it's the same. Every answer goes to the tool, a no or a "hmm" included; never re-ask in your own words. The tool counts the attempts and owns every retry and transfer: never offer a transfer yourself, however many times you've misheard.
  6. If they start ("the number is...") and stop before any digits, say "Go ahead" and wait.
  7. If they don't have or won't give the details, or say there's no other number, call {{ft:verify_caller}} with caller_cannot_verify='true'.
  8. A question: answer it briefly from the topics, then ask for what's still missing. If they'd rather make a new booking, call {{fn:start_make_booking}}.
