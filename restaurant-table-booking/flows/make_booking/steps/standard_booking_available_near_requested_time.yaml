step_type: advanced_step
name: Standard booking available near requested time
prompt: |-
  Standard booking is not available at the requested time - offer the user the nearest alternative time when it is available.

  If the user accepts, call {{ft:standard_booking_selected}} with the new time.

  If the user gives you an alternative date, time or party size to check, call {{ft:start_checking_availability}} with the new details. 

  If they don't want to select an alternative time, call {{ft:exit_make_booking_flow}}
