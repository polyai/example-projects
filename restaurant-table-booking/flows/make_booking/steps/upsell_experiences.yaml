step_type: advanced_step
name: Upsell experiences
prompt: |-
  If user doesn't want to hear more about available experiences or is not interested in booking an experience, call {{ft:standard_booking_selected}}. Only directly offer the standard booking as an option if you are instructed to.

  Give user an overview of available experiences using the information bellow.

  $available_experiences_formatted 

  If the user wants to proceed with the booking with one of the available experiences, call {{ft:booking_slot_selected}}, making sure you include the relevant experience_id

  $unavailable_experiences_formatted 

  If the user requests or mentions an experience which is not available at the requested time, or asks to change the date, time or party size, immediately call  {{ft:experience_not_available_check}}. Do not try to convince them to book the available experience, just check about the experience they requested first.
