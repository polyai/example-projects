step_type: advanced_step
name: Table type selection
prompt: |-
  Once you determine what table type the user wants, call {{ft:temporarily_lock_slot}} without saying anything.

  If the user didn't specify the table type in the conversation so far, ask which of the available table types they would prefer: $available_table_types 

  If the user would like to select a different experience, or change the date, time or party size, call {{ft:start_checking_availability}} 
   with the relevant experience ids or other details.
