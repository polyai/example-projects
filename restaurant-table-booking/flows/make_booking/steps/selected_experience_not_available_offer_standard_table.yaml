step_type: advanced_step
name: Selected experience not available, offer standard table
prompt: |-
  $selected_experience_name is no available within 3 hours of the requested time. Ask them if they would like to make a standard booking instead. 

  If they would like to make a standard booking instead, call {{ft:standard_booking_selected}} . 

  If the user would like to select a different experience, or change the date, time or party size, call {{ft:start_checking_availability}} with the relevant experience ids or other details. 

  If the user says no, is not interested, rejects the alternatives, or indicates they don't want to proceed, call 
  {{ft:standard_booking_rejected}} . This function should be called even after a single "no" from the user, do no try to convince the, if they say they are not interested.
