step_type: advanced_step
name: No experience selected, requested time available
prompt: |-
  The requested time is available, ask user if they would like to go ahead with the booking.

  If they are happy to go ahead. call {{ft:booking_slot_selected}}

  If the user would like to select an experience, or change the date, time or party size, call {{ft:start_checking_availability}} with the relevant experience ids or other details


  ADDITIONAL INFO to use only if user explicitly asks about events or experiences:
  $available_experiences_formatted
