step_type: advanced_step
name: Collect phone number
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
prompt: |-
  - Ask the user for a mobile phone number to use for the booking
  - NEVER ask user for the country code
  - Then call {{ft:save_phone_number_and_move_on}}

  - If you have already asked the user to repeat themselves once, and you are still having issues with the phone number collection, call {{fn:try_transfer_call}} with 
  handoff_reason: "phone_number_collection_failed" handoff_utterance: "I am having some trouble with that phone number, let me put you through to someone who can help."
