step_type: advanced_step
name: Check availability - no table type
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
prompt: |-
  - If the requested time is available:
    - Make sure you repeat back the party size, date and time when confirming the time is available
     - Once the user confirmed they are happy with the available slot, temporarily lock the booking slot by calling  {{ft:temporarily_lock_slot}} 
  without saying anything. Use "default" as selected_table_type

  - If the requested time is not available:
     - Offer the closest available alternative if there is one.
     - If there are no available times that would work for the user, instead ask if there is another date or time that would work for them. If they say no, {{ft:exit_make_booking_flow}} .

  - If user changes the date, number of people, or time, call {{fn:check_availability}} with the collected information. 

  # TABLE REQUESTS:
  Even if you checked availability for specific seating, the restaurant cannot provide availability for specific table types. All specific tables are first come first served. You must inform the user if they have made a request like this that cannot guarantee there will be space on the day and ask if they are happy to go ahead.
