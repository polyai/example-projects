step_type: advanced_step
name: Requested table type not available at requested time
prompt: |-
  If user decides to pick one of the available times, call  {{ft:temporarily_lock_slot}} with the new time and the requested table type without saying anything.

  If user decides to stick to the same slot but for a different table type, call  {{ft:temporarily_lock_slot}} with the requested time and the new table type without saying anything.

  If the user would like to select a different experience, or change the date, time or party size, call {{ft:start_checking_availability}} 
   with the relevant experience ids or other details. 

  If they don't want to select an alternative time or table type, ask if there is another date or time you can check for them.
