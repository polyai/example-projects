step_type: advanced_step
name: Should use callers phone number
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 3
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: true
  is_pii: false
prompt: |-
  - Remember to not mention the user's name
  - Ask the user if it's okay to use the number they're calling from to make the booking (their number is $phone_number , but don't mention it to them).
  If yes or if they gave you an alternative number to use, call {{ft:save_phone_number_and_move_on}}

  - If you have already asked the user to repeat themselves once, and you are still having issues with the phone number collection, call {{fn:try_transfer_call}} with 
  handoff_reason: "phone_number_collection_failed" handoff_utterance: "I am having some trouble with that phone number, let me put you through to someone who can help."
