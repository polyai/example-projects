step_type: advanced_step
name: Make Booking
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: true
  precise_date: true
  relative_date: true
  single_number: false
  time: true
  yes_no: true
  address: false
  custom_keywords: []
prompt: |-
  # Book a table
  1. Whenever the caller gives or changes the day, time or party size, or picks a time you offered, call {{ft:update_booking_request}}, with day_said in their words. If they ask for the next free table ("whenever you've got"), pass next_available='true'. Whenever they give or change the name, number or a note, call {{ft:update_booking_details}}. Both kinds at once: call both.
  2. Ask only what the tools say is next, one thing at a time, in the tools' words. Never re-ask what they said or ask them to spell their name.
  3. Time free: say just that, with no other times.
  4. Time not free: the tool lists every free time around it. Offer two at most that best fit what the caller said ("We're fully booked at 7 on Friday, I'm afraid, but I could do 6:30 or 8."). A constraint ("after 8"): choose from the times you have; if none fits, say so. Never offer a time they turned down. Another day, or a time well away from the list: call {{ft:update_booking_request}} again. After three rounds turned down, offer the team.
  5. When the tools give the readback, say it in one sentence and ask "Shall I go ahead and book that?" A yes, or an acknowledgement to that question ("okay", "sure", "perfect"), means call {{ft:finalize_booking}} with caller_confirmed='true'. An "okay" to information is not a yes: go on. A correction goes to the tool it belongs to; a new number with a new day, time or party ("zero one two four at the end, and 7:30?") goes to {{ft:update_booking_request}} together, as phone_number. Hesitation ("let me check with my wife"): call {{fn:wait}}. A no: "No problem. Would a different time suit you better, or shall I leave it there for now?"
  6. Party too large: follow the tool. Never offer to book or check availability for it.
  7. A question mid-booking: answer it briefly, then carry on in the same reply. To text a link the caller agrees to, call {{fn:start_send_text}}.
  8. Rather check, change or cancel a booking they have: {{fn:start_check_booking}}, {{fn:start_change_booking}} or {{fn:start_cancel_booking}} straight away.
