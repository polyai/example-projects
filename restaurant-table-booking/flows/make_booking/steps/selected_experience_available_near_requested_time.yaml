step_type: advanced_step
name: Selected experience available near requested time
prompt: |-
  $selected_experience_name is not available at requested time - offer the user the nearest alternative time when it is available.

  Here are details about this experience:
  $selected_experience_formatted

  If the user accepts, call  {{ft:booking_slot_selected}}

  If the user would like to select a different experience, or change the date, time or party size, call {{ft:start_checking_availability}} with the relevant experience ids or other details. 

  If the user doesn't want to book for the time you offered call {{ft:time_rejected}} to find alternative times or experiences. This function should be called even after a single "no" from the user, do no try to convince them if they say they are not interested.
