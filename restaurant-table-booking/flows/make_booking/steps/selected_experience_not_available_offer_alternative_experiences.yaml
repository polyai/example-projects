step_type: advanced_step
name: Selected experience not available, offer alternative experiences
asr_biasing:
  is_enabled: false
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 3
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  Unfortunately, $selected_experience_name is not available within 3 hours of the requested time. Ask them if they are interested in any other experiences at their preferred time - listed below:
  $available_alternative_experiences_formatted

  If the user wants to book one of these experiences, call {{ft:booking_slot_selected}}

  If the user would like to select a different experience, or change the date, time or party size, call {{ft:start_checking_availability}} with the relevant experience ids or other details. 

  If the user says no, is not interested, rejects the alternatives, or indicates they don't want to proceed, call 
  {{ft:available_experiences_rejected}} . This function should be called even after a single "no" from the user, do no try to convince them if they say they are not interested.
