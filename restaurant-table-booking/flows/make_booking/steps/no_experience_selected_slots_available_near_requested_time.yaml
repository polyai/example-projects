step_type: advanced_step
name: No experience selected, slots available near requested time
asr_biasing:
  is_enabled: false
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 3
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  Inform user that you don't have any slots at requested time, and offer them the nearest alternative time.

  If they said yes or pick from the times you know are available, call {{ft:booking_slot_selected}}

  If the user would like to select an experience, or change the date, time or party size, call {{ft:start_checking_availability}} with the relevant experience ids or other details. 

  If they don't want to select an alternative time, call  {{ft:exit_make_booking_flow}} 

  ADDITIONAL INFO to use only if user explicitly asks about events or experiences:
  $available_experiences_formatted
