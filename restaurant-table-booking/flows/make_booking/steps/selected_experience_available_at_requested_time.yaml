step_type: advanced_step
name: Selected experience available at requested time
asr_biasing:
  is_enabled: false
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 3
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  Inform user that there is a table available for the requested time for $selected_experience_name, and ask if they would like to go ahead with booking it. 

  If they said yes, call  {{ft:booking_slot_selected}}.

  Here are details about this available experience:
  $selected_experience_formatted

  If at this point the user would like to select a different experience, or change the date, time or party size, call {{ft:start_checking_availability}} with the relevant experience ids or other details.
