step_type: advanced_step
name: No availability on requested day
asr_biasing:
  is_enabled: false
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 3
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: false
  is_pii: false
prompt: |-
  Inform user that the restaurant doesn't have any availability on the requested date.

  If the user gives you an alternative date or party size to check, call {{ft:start_checking_availability}} with the new details. 

  If they don't want to select an alternative time, call {{ft:exit_make_booking_flow}} . This function should be called even after a single "no" from the user, do no try to convince them if they say they are not interested.
