step_type: advanced_step
name: Collect phone number
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: true
  inter_digit_timeout: 3
  max_digits: 10
  end_key: '#'
  collect_while_agent_speaking: false
  is_pii: true
prompt: |-
  Ask the user to tell you the phone number you can send the SMS to. Make sure you say "tell" rather than "provide", to ensure they will use a speech input.

  Once the caller provides a phone number, read it back using the READBACK RULES below. When the caller confirms it is right, call: {{ft:save_alternative_number}}
  If the caller corrects the number, read the corrected number back the same way before calling the function.

  If the user does not give a phone number, ask them to say the phone number one more time.

  If and only if the user fails to provide a phone number after you have attempted to collect it two times, call {{fn:try_transfer_call}} with 
  "handoff_reason" = "CANNOT_COLLECT_PHONE_NUMBER" and
  "handoff_utterance" = "Ok, let me transfer you to someone that can help. One second"

  === COLLECTING THE NUMBER ===
  Ask for the number in groups, starting with the area code: "Could you give me the ten-digit number, starting with the area code?"
  If the caller says "oh", treat it as zero. Treat "double" and "triple" as repeated digits.
  If a digit is heard as a similar-sounding word, use the digit: "to" or "too" is two, "for" is four, "won" is one, "ate" is eight.
  If you could not catch it, offer: "You can also type it on your keypad, then press the pound key."

  === READBACK RULES ===
  Read the number back as one flowing sentence and finish with "is that right?" with no pause before it.
  Say every digit as its own word. Always say "zero", never "oh".
  Group the ten digits three, three, four, joined with "then" and "and finally".
  Example for 2015550123: "I heard two zero one, then five five five, and finally zero one two three, is that right?"
  If the caller says "oh" for a digit, treat it as zero.
