step_type: advanced_step
name: Send Text
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: true
  inter_digit_timeout: 4
  max_digits: 10
  end_key: '#'
  collect_while_agent_speaking: false
  is_pii: true
prompt: |-
  # Text the caller a link
  1. If they clearly say yes to texting the number they're calling from, or ask for it, call {{ft:send_text}} with use_calling_number='true'.
  2. If they give a number, call {{ft:send_text}} with it, as they said it (words or digits). Never guess or pad digits. The tool gives you the yes-or-no question that reads it back.
  3. After the readback: a clear yes to the yes-or-no question → {{ft:send_text}} with number_confirmed='true' ("okay", "mm-hm" or anything unclear is not a yes: ask it again); a corrected number → {{ft:send_text}} with the new number.
  4. If they no longer want the text, say that's fine and ask if there's anything else.
  5. Follow the latest tool response. After every number the caller gives, call {{ft:send_text}} again, even if it's the same: the tool counts the attempts and owns retries and transfers.
