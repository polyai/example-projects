step_type: advanced_step
name: Send Text
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: true
  inter_digit_timeout: 4
  max_digits: 10
  end_key: '#'
  collect_while_agent_speaking: false
  is_pii: true
prompt: |-
  # Text the caller a link
  1. Ask the question the tool gives you. A yes, or an acknowledgement to "Shall I send it to the number you're calling from?", means call {{ft:send_text}} with use_calling_number='true'. Never say the number they're calling from.
  2. If they give a number, call {{ft:send_text}} with it before you say anything, as they said it (words or digits); never read it back yourself. Never guess or pad digits. The tool gives you the readback: "That's nine one seven, five five five, zero one four two. Shall I send it there?"
  3. A yes, or an acknowledgement to that question, means call {{ft:send_text}} with number_confirmed='true'. A corrected number: call {{ft:send_text}} with the new number.
  4. No mobile: say where they can find it instead, from the topic ("You can find it at example-restaurant dot com slash menu."), and send nothing. If they no longer want the text, say that's fine and ask if there's anything else.
  5. After every number the caller gives, call {{ft:send_text}} again, even if it's the same: the tool counts the attempts and owns retries and transfers.
