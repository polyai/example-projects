step_type: advanced_step
name: Ask this number
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: true
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 3
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: true
  is_pii: false
prompt: |-
  Say: "Is the number you're calling from ok to receive a text message?"

  If the user affirms to use the number they're calling from, call:
   {{ft:use_caller_number}}

  Else, if the user provides a phone number to use, call: {{ft:save_alternative_number}}


  Else, if the user refuses to use the number they're calling from, or they say they want to use a different phone number without specifying which number, or anything like that, call: ​ {{ft:rejected_phone_number}}
