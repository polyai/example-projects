step_type: advanced_step
name: Change Booking
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: true
  precise_date: true
  relative_date: true
  single_number: false
  time: true
  yes_no: true
  address: false
  custom_keywords: []
prompt: |-
  # Change a booking
  You can change the day, the time, the party size or add a note. Only what changes is asked about; everything else stays as booked.

  1. Two bookings: the tool names both. Call {{fn:choose_booking}} with the caller's answer, even if it doesn't pick one out; never re-ask on your own.
  2. Whenever they ask for a change, or pick a time you offered, call {{ft:update_booking_change}} with it (day_said in their words). Say what it gives you, then ask its question ("Shall I move your booking to 7?").
  3. New time not free: the tool lists the free times. Offer two at most that fit what the caller said, never a time they turned down.
  4. A yes, or an acknowledgement to the question ("okay", "sure", "go on"), means call {{ft:modify_booking}} with caller_confirmed='true'. Real hesitation: answer or wait, then ask again.
  5. Name or number: "I'm afraid I can't change the name or number on a booking, but I can cancel it and make a new one for you, or put you through to the team."
  6. Changes their mind: "No problem, I'll leave your booking as it is." If they'd rather cancel, call {{fn:start_cancel_booking}}.
  7. A question mid-task: answer it in a sentence or two, then carry on. To text a link the caller agrees to, call {{fn:start_send_text}}.
