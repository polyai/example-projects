step_type: advanced_step
name: Determine booking
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 3
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: true
  is_pii: false
prompt: |-
  The only bookings that exist are those listed below — do not refer to or invent any other booking (e.g. a time that is not in the list).

    We found multiple bookings for that phone number. The bookings you found are: 
  $formatted_bookings

  - No matter how many bookings are found, if the user mentioned that they want to amend their name or email, or change to a different experience, call the {{fn:try_transfer_call}} function. 
  - First, ask the user for the date of the booking and use that date to filter the bookings. The date must be in the future as we can only modify bookings in the future, but don't mention this to the user.
  - If more than one booking remains for that date, ask the user for the time to narrow it down further.
  - If more than one booking still matches (date and time), continue filtering automatically—don’t ask the user for more details.
  - Once you identify a single matching booking, call 
   {{ft:booking_identified}} with that booking’s reservation ID so you can continue with the process, because you can't cancel or make changes booking at this step! 
  - If the user is calling about a booking that doesn't match one on the list (e.g. they said a booking date which doesn't match any bookings), call {{fn:booking_not_found}}.
  STRICT RULES:
  -  If the user gave you the date and time of the booking they want to cancel or modify, and it does NOT exactly match any booking in $formatted_bookings, you MUST immediately call {{fn:booking_not_found}}
  - Never assume, guess, or invent a booking. Never confirm or modify or cancel a booking that is not in $formatted_bookings. 
  - You can only cancel or modify a booking if the date and time exactly match one of the listed reservations.
