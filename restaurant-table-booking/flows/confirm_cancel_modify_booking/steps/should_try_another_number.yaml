step_type: advanced_step
name: Should try another number
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
prompt: |-
  We could not find any bookings, check with the user that their number is the one they've just mentioned.
  - If the user mentioned a new number right away, call 
  {{ft:save_phone_number_and_get_bookings}} with that number.
  - If user states they have booked online immediately call {{fn:try_transfer_call}}with handoff_reason "booked_online" and handoff_utterance "Let me transfer you to my colleague who can help with that. One second." 
  - Else, call
  {{ft:collect_another_number}} ​ 

  Note: When you are collecting a phone number from a user and you read it back to them, you MUST convert the numbers into words to read them back for example 07774036786 you should read as zero seven seven seven four zero three six seven eight six. When giving you their phone number, some users may say 'oh' instead of 'zero' for example oh seven seven seven four oh three six seven eight six. If they do this you must convert 'oh' into 0 or the number zero. When giving their phone number, if there is three of the same number together some users may say 'treble 9' instead of '9 9 9'.
