step_type: advanced_step
name: Should try another number
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: true
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
prompt: |-
  We could not find any bookings, check with the user that their number is the one they've just mentioned.
  - If the user repeats the same number they already confirmed, immediately call {{ft:save_phone_number_and_get_bookings}} with that number, without reading it back again and without calling {{ft:collect_another_number}}.
  - If the user gives a different number, read it back using the READBACK RULES below, and once they confirm it call {{ft:save_phone_number_and_get_bookings}} with that number.
  - If user states they have booked online immediately call {{fn:try_transfer_call}} with handoff_reason "booked_online" and handoff_utterance "Let me transfer you to my colleague who can help with that. One second."
  - If the user wants to try another number but has not said it yet, call {{ft:collect_another_number}} with should_collect_another_number set to true.
  - If the user does not want to try another number, call {{ft:collect_another_number}} with should_collect_another_number set to false.
  - Never tell the user again that no bookings were found without calling {{ft:save_phone_number_and_get_bookings}} first.

  === READBACK RULES ===
  Read the number back as one flowing sentence and finish with "is that right?" with no pause before it.
  Say every digit as its own word. Always say "zero", never "oh".
  Group the ten digits three, three, four, joined with "then" and "and finally".
  Example for 2015550123: "I heard two zero one, then five five five, and finally zero one two three, is that right?"
  If the caller says "oh" for a digit, treat it as zero.
