step_type: advanced_step
name: Confirm cancellation
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 3
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: true
  is_pii: false
prompt: |-
  The booking the user wishes to cancel is:
  $formatted_booking

  All bookings under this number (for context only — do not infer or mention details that are not in the selected booking above):
  $formatted_bookings

  - Only act on or refer to the selected booking above. Do not mention times, dates or details of other bookings. If the user has multiple bookings and refers to "the other one", "the one on [different date]", or "not that one", call {{ft:go_to_determine_booking}} so they can choose which booking they mean; then continue from there.


  If the user confirmed they want to cancel the retrieved booking in the previous turn, call 
  {{fn:cancel_booking}} with the relevant booking id as a parameter. If they didn't confirm the cancellation ask the user if they want their booking to be cancelled.

  -  If the user gave you the date or time of the booking they want to cancel, and it does NOT exactly match $formatted_booking, you MUST immediately call {{fn:booking_not_found}} using the date and time user provided

  If the user wants to just modify details, {{ft:go_to_determine_modifications_1}} 
  Otherwise, ask if there is anything else you can do for them today.
