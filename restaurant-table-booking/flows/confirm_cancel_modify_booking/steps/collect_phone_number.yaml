step_type: advanced_step
name: Collect phone number
asr_biasing:
  is_enabled: true
  alphanumeric: false
  name_spelling: false
  numeric: false
  party_size: false
  precise_date: false
  relative_date: false
  single_number: false
  time: false
  yes_no: false
  address: false
  custom_keywords: []
dtmf_config:
  is_enabled: false
  inter_digit_timeout: 3
  max_digits: 0
  end_key: ""
  collect_while_agent_speaking: true
  is_pii: false
prompt: |-
  - Ask the user for the phone number to they booked with
  - NEVER ask user for the country code
  - Then call {{ft:save_phone_number_and_get_bookings}} 
  - If the user doesn't give you a phone number, and says they booked online using their email, call {{fn:try_transfer_call}}with handoff_reason "booked_online" and handoff_utterance "Let me transfer you to my colleague who can help with that. One second."
