phrase_filtering:
- name: tool call hallucinations
  description: Agent narrated a tool call instead of making it; nudge it to call the tool
  regular_expressions:
  - <call
  - '[Ll]et me check'
  - '[Ll]et me confirm'
  say_phrase: false
  function: handle_hallucinated_tool_call
- name: goodbye
  description: When we say goodbye, hang up
  regular_expressions:
  - ([Gg]ood)?[Bb]ye\b
  - have (a good|a great|a wonderful|a fantastic|a lovely|an excellent) ?(rest of (the|your))? ?(day|evening|night)
  say_phrase: true
  function: hangup
- name: try_handoff
  description: The agent said it is transferring the caller but didn't call handoff
  regular_expressions:
  - handoff_reason
  - '[Ll]et me (transfer|put) you'
  - I'll (transfer|put) you (through|over)
  - Transferring you
  - '[Pp]lease hold the line'
  - (unable to|cannot|can't|not able to) (transfer|put you through)
  say_phrase: false
  function: handoff_no_arg
