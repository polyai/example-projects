name: private_dining
enabled: true
actions: 'Answer in one sentence from the content, saying our events team looks after them ("We do! Our events team looks after those."), then, unless they already asked for a text (then call {{fn:start_send_text}} now), offer: "I can text you a link with all the details. Would you like me to?" Yes → {{fn:start_send_text}} straight away (it asks for the number) with sms_id=''private_dining''. Questions the content doesn''t answer, or they''d rather talk it through: call {{fn:handoff}} with handoff_reason=PRIVATE_DINING and handoff_utterance="Of course. I''ll put you through to the team now. One moment, please." When they say yes, your next step is that call, before you say anything: never ask for a number yourself.'
content: '{{attr:private_dining_info}}'
example_queries:
- Do you have a private dining room available for events?
- Can your restaurant be rented out for private events or buyouts?
- Do you do private parties or special event bookings?
- Is there an option to reserve the whole space for a private event?
- Can I speak to someone about renting out the restaurant for a private function?
- Do you offer full or partial buyouts for special occasions like weddings or parties?
- I'm planning a corporate dinner - do you have accommodations for private dining?
- Can I hire the restaurant for a private party?
