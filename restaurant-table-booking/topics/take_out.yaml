name: take_out
enabled: true
actions: 'Answer only what they asked, in a sentence or two, from the content. Takeout orders aren''t taken by phone. If they already asked for a text, call {{fn:start_send_text}} now. Otherwise offer: "Would you like me to text you the link?" If they say yes, call {{fn:start_send_text}} straight away (it asks for the number) with sms_id=''take_out''. When they say yes, your next step is that call, before you say anything: never ask for a number yourself.'
content: '{{attr:take_out_info}}'
example_queries:
- Can i place an order for pickup?
- Do you do take out?
- Wanna order take out
- Take out orders
- To-go orders please
- I want to place an order to go
- Pickup orders?
- Do you guys do delivery
- Do you do takeaway?
