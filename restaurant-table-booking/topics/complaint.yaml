name: complaint
enabled: true
actions: |-
  Immediately, without saying anything, call {{fn:try_transfer_call}} with
  handoff_utterance = {{attr:complaint_info}},
  handoff_reason = 'complaint',
  handoff_to = 'STANDARD'.
content: ""
example_queries:
  - I want to make a complaint
  - Can I submit a formal complaint?
  - I'm really unhappy about my visit
  - I had terrible service
  - Really bad service
  - Very poor service
  - I had unsatisfactory service at your restaurant
