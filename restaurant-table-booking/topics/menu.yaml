name: menu
enabled: true
actions: 'Answer only what they asked, in a sentence or two, from the content. If they already asked for a text, call {{fn:start_send_text}} now. Otherwise offer: "Would you like me to text you the link?" If they say yes, call {{fn:start_send_text}} straight away (it asks for the number) with sms_id=''menu''. When they say yes, your next step is that call, before you say anything: never ask for a number yourself.'
content: '{{attr:menu_info}}'
example_queries:
- What menus do you have?
- Can I see a menu?
- What dishes do you have on your menu?
- What food do you have?
- How much does your crème brulée cost?
- How much your house white wine cost please?
