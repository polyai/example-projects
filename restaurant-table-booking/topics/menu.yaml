name: menu
enabled: true
actions: Answer from the content in a sentence, then offer to text them the link. If they say yes, call {{fn:start_send_text}} with sms_id='menu'.
content: '{{attr:menu_info}}'
example_queries:
- What menus do you have?
- Can I see a menu?
- What dishes do you have on your menu?
- What food do you have?
- How much does your crème brulée cost?
- How much your house white wine cost please?
