name: late
enabled: true
actions: 'Say: "Thanks for letting us know." Then the hold time from the content, in a sentence. If they''ll be later than that: "...so it might be best to move your booking. Shall I see what we''ve got a bit later?" Yes → {{fn:start_change_booking}}. If they''d rather speak to the team, call {{fn:handoff}} with handoff_reason=RUNNING_LATE. If they''d rather keep it, say that''s fine and ask if there''s anything else; don''t offer again.'
content: '{{attr:late_arrival_info}}'
example_queries:
- If we show up 10 minutes late, what happens?
- If we are 10 minutes late, what happens?
- Yeah, but we might be 10 minutes late.
- Stuck in traffic so will be late
- I have a booking at 2pm but the traffic is horrible so I won't be able to make it on time
- I am going to be late
- I'm running about 15 minutes late, is that okay?
- I'm going to be delayed
